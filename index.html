<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d08">
<meta name="description" content="Seidla — die fränkische Wirtshausrunde. Partyspiele für 2 bis 100 Leut: Ich hab noch nie, Bumm, Franken-Quiz und mehr. Runde mit Code aufmachen, läuft auch ohne Netz weiter.">
<title>Seidla — die fränkische Wirtshausrunde</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2322150d'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23d9a521' font-family='Georgia'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Seidla — Gestaltung
   Wirtshaus-Abend: dunkles Holz, Biergold, Creme, kräftige Serifen.
   Alles responsiv von 2 bis 100 Leuten, Handy bis Beamer.
   ========================================================================== */

:root{
  --wood-1:#140d08;
  --wood-2:#22150d;
  --wood-3:#31200f;
  --wood-4:#3f2a15;
  --cream:#f6ead3;
  --cream-2:#e6d3b0;
  --cream-3:#cdb489;
  --ink:#2a1a10;
  --ink-soft:#5b4433;
  --gold:#d9a521;
  --gold-2:#f2c85e;
  --gold-3:#8a6510;
  --amber:#b5722a;
  --red:#8f2b26;
  --red-2:#c8462f;
  --green:#4f7a3a;
  --blue:#3a5f86;
  --line:rgba(217,165,33,.28);
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --shadow-sm:0 8px 20px rgba(0,0,0,.35);
  --maxw:1120px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -8%, rgba(217,165,33,.13), transparent 62%),
    repeating-linear-gradient(92deg, rgba(255,255,255,.014) 0 3px, rgba(0,0,0,.02) 3px 7px),
    linear-gradient(180deg, var(--wood-2), var(--wood-1) 68%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:var(--sans);
  font-size:16.5px;
  line-height:1.55;
  min-height:100%;
  overflow-x:hidden;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.14;margin:0 0 .5em;color:#fff6e2}
h1{font-size:clamp(26px,4.6vw,46px);letter-spacing:.2px}
h2{font-size:clamp(21px,3.1vw,31px);margin-top:1.1em}
h3{font-size:clamp(17px,2vw,21px)}
p{margin:0 0 1em}
a{color:var(--gold-2)}
hr.rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.muted{color:var(--cream-3)}
.center{text-align:center}
.serif{font-family:var(--serif)}
.kbd{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:6px;
  background:rgba(0,0,0,.28);font-family:var(--sans);font-size:12px;color:var(--gold-2)}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lead{font-size:clamp(15px,1.7vw,18px);color:var(--cream-2);max-width:70ch}

/* ── Kopfzeile ─────────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, rgba(20,13,8,.97), rgba(20,13,8,.86));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(9px);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 18px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;
  padding:4px;text-align:left;color:#fff;min-width:0;font-family:var(--serif)}
.brand-mark{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 24%, var(--gold-2), var(--gold-3));
  color:#2a1a06;font-size:24px;line-height:1;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.28), 0 6px 14px rgba(0,0,0,.4);
}
.brand-text{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.brand-text strong{font-size:24px;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-text small{color:var(--cream-3);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.net-badge{
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  color:var(--cream-2);background:rgba(255,255,255,.05);white-space:nowrap;
}
.net-badge.online{border-color:rgba(122,196,132,.7);color:#d9f3d9;background:rgba(79,122,58,.32)}
.net-badge.warn{border-color:rgba(240,201,138,.7);color:#ffeccb;background:rgba(181,114,42,.32)}
.net-badge.bad{border-color:rgba(242,166,166,.75);color:#ffdede;background:rgba(143,43,38,.42)}

/* ── Grundgerüst ──────────────────────────────────────────────────────── */
.view{max-width:var(--maxw);margin:0 auto;padding:26px 18px 56px}
.card{
  position:relative;
  background:linear-gradient(180deg, rgba(246,234,211,.985), rgba(230,211,176,.965));
  color:var(--ink);
  border-radius:var(--radius);
  padding:22px 24px;
  box-shadow:var(--shadow);
  border:1px solid rgba(90,60,20,.35);
}
.card::before{
  content:"";position:absolute;inset:6px;border-radius:9px;
  border:1px solid rgba(90,60,20,.22);pointer-events:none;
}
.card h1,.card h2,.card h3,.card h4{color:var(--ink)}
.card .muted{color:var(--ink-soft)}
.card .lead{color:var(--ink-soft)}
.card .eyebrow{color:var(--gold-3)}
.banner{
  border-left:4px solid var(--gold);background:rgba(217,165,33,.14);
  padding:12px 14px;border-radius:8px;font-size:14.5px;color:inherit;margin:12px 0;
}
.banner.green{border-color:var(--green);background:rgba(79,122,58,.16)}
.banner.red{border-color:var(--red);background:rgba(143,43,38,.16)}
.banner.gold{border-color:var(--gold);background:rgba(217,165,33,.2)}
.footnote{margin-top:30px;padding:16px 18px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--cream-3);line-height:1.6}

/* ── Knöpfe ────────────────────────────────────────────────────────────── */
.btn{
  font-family:var(--sans);font-size:15px;font-weight:700;
  padding:12px 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;
  transition:transform .12s ease, box-shadow .18s ease, background .18s ease;
  background:rgba(255,255,255,.06);color:var(--cream);line-height:1.2;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-gold{
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  color:#2b1a05;box-shadow:0 6px 16px rgba(217,165,33,.28), inset 0 -2px 0 rgba(0,0,0,.18);
  border-color:rgba(120,85,10,.5);
}
.btn-outline{background:transparent;border-color:var(--line);color:var(--cream)}
.btn-outline:hover{background:rgba(217,165,33,.12)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--cream-2)}
.btn-ghost:hover{background:rgba(255,255,255,.07);color:#fff}
.btn-red{background:linear-gradient(180deg,var(--red-2),var(--red));color:#fff;border-color:rgba(80,10,8,.5)}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:9px}
.btn-lg{padding:16px 34px;font-size:18px;border-radius:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card .btn-outline{border-color:rgba(90,60,20,.4);color:var(--ink)}
.card .btn-outline:hover{background:rgba(90,60,20,.1)}
.card .btn-ghost{color:var(--ink-soft)}

/* ── Startseite ────────────────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:1.35fr .95fr;gap:28px;align-items:stretch;margin-bottom:28px}
.hero-main{display:flex;flex-direction:column;justify-content:center}
.stat-card{
  display:flex;gap:14px;align-items:flex-start;
  background:linear-gradient(180deg, rgba(246,234,211,.95), rgba(230,211,176,.9));
  color:var(--ink);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);border:1px solid rgba(90,60,20,.32);
}
.stat-card .big{font-family:var(--serif);font-size:40px;line-height:1;color:var(--red);min-width:52px}
.stat-card h3{margin:0 0 2px;font-size:17px}
.stat-card p{margin:0;font-size:14px;color:var(--ink-soft)}

/* ── Spielkarten ───────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.game-card{
  text-align:left;background:linear-gradient(180deg, rgba(246,234,211,.97), rgba(226,206,170,.95));
  color:var(--ink);border:1px solid rgba(90,60,20,.34);border-radius:var(--radius);
  padding:0;overflow:hidden;cursor:pointer;font-family:var(--sans);
  box-shadow:var(--shadow-sm);transition:transform .14s ease, box-shadow .2s ease;
}
.game-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.game-card .thumb{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:linear-gradient(135deg, var(--accent,#3a5f86), rgba(0,0,0,.42));
  color:#fff;
}
.game-card .glyph{font-family:var(--serif);font-size:30px;line-height:1}
.game-card .n{margin-left:auto;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(0,0,0,.32);padding:4px 9px;border-radius:999px;color:#ffe9bd;white-space:nowrap}
.game-card .body{padding:14px 16px 16px}
.game-card h3{margin:0 0 4px;font-size:19px}
.game-card p{margin:0 0 10px;font-size:14px;color:var(--ink-soft)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  background:rgba(90,60,20,.14);color:var(--ink-soft);padding:3px 8px;border-radius:999px}
.game-card .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);gap:8px}

/* ── Filter & Formular ─────────────────────────────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.chip{
  font-size:13px;font-weight:700;padding:8px 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream-2);
}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#2b1a05;border-color:rgba(120,85,10,.5)}
.search{flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:rgba(0,0,0,.32);color:var(--cream);font-size:15px;font-family:var(--sans)}
.search::placeholder{color:var(--cream-3)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card .field>span{color:var(--gold-3)}
input,select,textarea{
  font-family:var(--sans);font-size:16px;padding:11px 13px;border-radius:10px;
  border:1px solid rgba(90,60,20,.42);background:rgba(255,255,255,.82);color:var(--ink);
  width:100%;max-width:100%;
}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.inline-form{display:flex;gap:14px;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:150px}
.code-input{
  font-family:var(--serif);font-size:34px;letter-spacing:.42em;text-align:center;text-transform:uppercase;
  padding:12px;max-width:230px;
}
.card .code-input{background:#fffdf6}

/* ── Lobby ─────────────────────────────────────────────────────────────── */
.lobby-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.code-chip{
  display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;
  background:linear-gradient(135deg, rgba(143,43,38,.14), rgba(217,165,33,.2));
  border:1px dashed rgba(90,60,20,.45);border-radius:12px;padding:12px 16px;margin:6px 0 14px;
}
.code-chip .val{font-family:var(--serif);font-size:40px;letter-spacing:.16em;color:var(--red);line-height:1}
.join-link{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:rgba(0,0,0,.1);border:1px solid rgba(90,60,20,.3);border-radius:8px;
  padding:9px 11px;word-break:break-all;color:var(--ink-soft);
}
.net-steps{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:s}
.net-steps li{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;font-size:14.5px}
.net-steps .num{
  counter-increment:s;flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--wood-3);color:var(--gold-2);font-weight:700;font-size:13px;
}
.net-steps .num::before{content:counter(s)}
.player-list{list-style:none;margin:10px 0 0;padding:0;max-height:340px;overflow:auto}
.player-list li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(90,60,20,.16);font-size:15px}
.player-list .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22);
}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:rgba(90,60,20,.16);color:var(--ink-soft)}
.badge.host{background:rgba(143,43,38,.18);color:var(--red)}
.badge.you{background:rgba(217,165,33,.28);color:var(--gold-3)}
.badge.gone{background:rgba(0,0,0,.14);color:#7a6a58}

/* ── Mechanik-Leiste (Punkte) ──────────────────────────────────────────── */
.mechanik{
  position:sticky;bottom:44px;z-index:30;background:linear-gradient(180deg, rgba(20,13,8,.96), rgba(20,13,8,.9));
  border-top:1px solid var(--line);padding:0 18px;
}
.mechanik-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:9px 0;flex-wrap:wrap}
.mechanik h4{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mk-houses{display:flex;gap:8px;flex-wrap:wrap;max-height:76px;overflow:auto;flex:1;min-width:200px}
.mk-house{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;padding:4px 11px 4px 4px;
  border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.mk-house .avatar{width:24px;height:24px;flex-basis:24px;font-size:12px}
.mk-house .pts{font-weight:700;color:var(--gold-2)}
.mk-spacer{flex:0 0 auto}
.mk-round{font-size:13px;color:var(--cream-3)}
.mk-round strong{color:var(--cream)}

.statusbar{
  position:sticky;bottom:0;z-index:31;background:rgba(12,8,5,.97);border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;padding:8px 18px;font-size:12.5px;color:var(--cream-3);
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.statusbar span:last-child{color:var(--gold);white-space:nowrap}

/* ── Spielansicht ──────────────────────────────────────────────────────── */
.game-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.game-head .icon{
  width:62px;height:62px;flex:0 0 62px;border-radius:16px;display:grid;place-items:center;
  font-family:var(--serif);font-size:31px;
  background:radial-gradient(circle at 32% 22%, var(--gold-2), var(--gold-3));
  color:#2b1a05;box-shadow:var(--shadow-sm);
}
.game-head .titles{flex:1;min-width:200px}
.game-head h1{margin:0;font-size:clamp(22px,3.4vw,34px)}
.game-head .sub{margin:2px 0 0;color:var(--cream-3);font-size:14px}
.stage{margin-top:4px}
.turn-banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(135deg, rgba(217,165,33,.2), rgba(143,43,38,.14));
  border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;
  font-size:clamp(15px,1.8vw,18px);font-weight:600;color:#fff3dc;
}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.3)}

/* ── Punktestand-Tabelle ───────────────────────────────────────────────── */
.scoreboard{width:100%;border-collapse:collapse;font-size:15px}
.scoreboard th{text-align:left;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold-3);border-bottom:2px solid rgba(90,60,20,.3);padding:7px 6px}
.scoreboard td{padding:8px 6px;border-bottom:1px solid rgba(90,60,20,.16)}
.scoreboard .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.scoreboard .rank{color:var(--ink-soft);font-weight:700;margin-right:6px}
.scoreboard tr.lead-row td{background:rgba(217,165,33,.2)}

/* ── Partyspiel-Bausteine ──────────────────────────────────────────────── */
.big-prompt{
  font-family:var(--serif);text-align:center;line-height:1.2;margin:8px auto 20px;max-width:22ch;
  font-size:clamp(26px,6vw,58px);color:#fff4dc;text-shadow:0 3px 14px rgba(0,0,0,.5);
}
.big-prompt.small{font-size:clamp(20px,3.4vw,34px);max-width:34ch}

.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.vote-btn{
  display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;
  background:linear-gradient(180deg, rgba(246,234,211,.96), rgba(226,206,170,.94));
  color:var(--ink);border:1px solid rgba(90,60,20,.34);border-radius:12px;
  padding:12px 14px;font-family:var(--sans);font-size:15.5px;font-weight:600;
  box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .18s ease;
  min-width:0;
}
.vote-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.vote-btn:disabled{opacity:.5;cursor:default;transform:none}
.vote-btn .avatar{width:34px;height:34px;flex-basis:34px;font-size:15px}
.vote-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote-btn.chosen{box-shadow:0 0 0 3px var(--gold), var(--shadow-sm)}
.vote-btn .yours{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700}

.poll-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:15px}
.poll-row .nm{flex:0 0 34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#fff2d8}
.poll-track{flex:1;height:24px;border-radius:8px;background:rgba(0,0,0,.34);overflow:hidden;border:1px solid var(--line)}
.poll-bar{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.3,.9,.3,1);min-width:3px}
.poll-row .n{flex:0 0 58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-2);font-weight:700}
.poll-row.winner .nm{color:var(--gold-2)}
.poll-row.winner .poll-bar{box-shadow:0 0 14px rgba(217,165,33,.6)}

.dare-card{
  background:linear-gradient(180deg, rgba(246,234,211,.98), rgba(228,208,172,.96));
  color:var(--ink);border-radius:var(--radius);padding:24px;text-align:center;
  box-shadow:var(--shadow);border:1px solid rgba(90,60,20,.35);margin:0 auto;max-width:620px;
}
.dare-card .kicker{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-3);font-weight:700}
.dare-card .text{font-family:var(--serif);font-size:clamp(20px,3.6vw,32px);line-height:1.3;margin:12px 0 18px}
.dare-card .who{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--red)}

.timer-ring{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 auto 16px}
.timer-ring .clock{font-family:var(--serif);font-size:clamp(44px,11vw,86px);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--gold-2);text-shadow:0 3px 18px rgba(217,165,33,.35)}
.timer-ring.urgent .clock{color:var(--red-2);animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}

.bomb{font-size:clamp(56px,15vw,120px);text-align:center;line-height:1;margin:10px 0;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.bomb.ticking{animation:shake .32s infinite}
@keyframes shake{0%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.06)}100%{transform:rotate(-7deg) scale(1)}}

.roster{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.roster .pill{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);color:var(--cream-2)}
.roster .pill.done{background:rgba(79,122,58,.32);border-color:rgba(122,196,132,.5);color:#dcf5dc}

.wheel-wrap{text-align:center;margin:10px 0 18px}
.wheel-name{font-family:var(--serif);font-size:clamp(28px,7vw,64px);color:var(--gold-2);line-height:1.1;
  animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.08)}100%{transform:scale(1)}}

.bracket{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 14px}
.bracket-round{flex:0 0 auto;min-width:190px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bracket-round h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.match{background:linear-gradient(180deg, rgba(246,234,211,.95), rgba(226,206,170,.93));color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:14px;border:1px solid rgba(90,60,20,.32);box-shadow:var(--shadow-sm)}
.match .side{display:flex;align-items:center;gap:8px;padding:3px 0}
.match .side.win{font-weight:700}
.match .side.win::after{content:"✓";margin-left:auto;color:var(--green)}
.match .side.open{color:var(--ink-soft);font-style:italic}

.seat-switcher{margin-bottom:16px}
.seat-switcher .btn.active{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#2b1a05}

.prompt-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.prompt-list li{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:12px 15px;font-size:15.5px}
.prompt-list .who{font-weight:700;color:var(--gold-2)}

/* ── Dialog & Hinweise ─────────────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;
  background:rgba(8,5,3,.78);backdrop-filter:blur(4px);overflow:auto}
.modal-root[hidden]{display:none}
.modal{
  background:linear-gradient(180deg, var(--cream), var(--cream-2));color:var(--ink);
  border-radius:16px;padding:24px;max-width:560px;width:100%;box-shadow:var(--shadow);
  border:1px solid rgba(90,60,20,.4);max-height:90vh;overflow:auto;
}
.modal h2{margin-top:0;color:var(--red)}
.modal h3{color:var(--ink)}
.modal .muted{color:var(--ink-soft)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .btn-outline{border-color:rgba(90,60,20,.4);color:var(--ink)}
.modal .btn-outline:hover{background:rgba(90,60,20,.1)}
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:70;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:rgba(20,13,8,.95);color:var(--cream);border:1px solid var(--line);
  border-radius:11px;padding:11px 18px;font-size:14.5px;box-shadow:var(--shadow-sm);
  animation:rise .28s ease;
}
.toast.ok{border-color:rgba(122,196,132,.6);color:#dcf5dc}
.toast.err{border-color:rgba(242,166,166,.7);color:#ffdede}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── Ausgangskorb / Sync ───────────────────────────────────────────────── */
.sync-strip{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px dashed var(--line);border-radius:12px;padding:11px 15px;margin:0 0 18px;
  background:rgba(217,165,33,.1);font-size:14px;
}
.sync-strip strong{color:var(--gold-2)}
.sync-strip .count{font-family:var(--serif);font-size:22px;color:var(--cream)}

/* ── Chronik (Wirtshausbuch) ───────────────────────────────────────────── */
.chronicle{list-style:none;padding:0;margin:0}
.chronicle li{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid rgba(90,60,20,.16)}
.chronicle .when{flex:0 0 92px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chronicle .what{flex:1;font-size:15px}
.chronicle .who{font-weight:700}
.chronicle .tag-mini{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:2px 7px;border-radius:999px;background:rgba(90,60,20,.16);color:var(--ink-soft);white-space:nowrap}

/* ── Responsiv ─────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:20px}
  .lobby-grid{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:16px}
  .view{padding:18px 13px 48px}
  .topbar-inner{padding:9px 13px;gap:10px}
  .brand-text small{display:none}
  .brand-mark{width:36px;height:36px;flex-basis:36px;font-size:20px}
  .brand-text strong{font-size:19px}
  /* Kopfzeile muss auf schmalen Geräten in eine Zeile passen:
     Netzbadge entfällt (steht ohnehin in der Statuszeile), Knöpfe schrumpfen. */
  .net-badge{display:none}
  .topbar-right{gap:4px}
  .topbar-right .btn-ghost{padding:7px 9px;font-size:13px}
  .card{padding:17px 15px}
  .code-chip .val{font-size:32px}
  .code-input{font-size:28px;letter-spacing:.3em}
  .mechanik{padding:0 12px;bottom:40px}
  .mk-houses{max-height:60px}
  .statusbar{font-size:11.5px;padding:7px 13px}
  #statusRight{display:none}
  .vote-grid{grid-template-columns:1fr 1fr;gap:9px}
  .vote-btn{padding:10px;font-size:14px}
  .poll-row .nm{flex-basis:40%}
  .game-head .icon{width:50px;height:50px;flex-basis:50px;font-size:25px}
  .toast-root{bottom:64px}
  .chronicle .when{flex-basis:70px}
}
@media (max-width:380px){
  .vote-grid{grid-template-columns:1fr}
  .brand-text strong{font-size:17px}
  .topbar-right .btn-ghost{padding:6px 7px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media print{.topbar,.mechanik,.statusbar,.btn{display:none}}

</style>
</head>
<body>
<div id="app">
  <!-- ══ KOPFZEILE ══════════════════════════════════════════════ -->
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brandBtn" title="Zur Startseite">
        <span class="brand-mark">🍺</span>
        <span class="brand-text">
          <strong>Seidla</strong>
          <small>Die fränkische Wirtshausrunde</small>
        </span>
      </button>
      <div class="topbar-right">
        <span id="netBadge" class="net-badge" title="Verbindungsart">Läuft am Gerät</span>
        <button id="wirtBtn" class="btn btn-ghost" title="Wirt-Bereich">Wirt</button>
        <button id="chronikBtn" class="btn btn-ghost">Chronik</button>
        <button id="helpBtn" class="btn btn-ghost">Anleitung</button>
      </div>
    </div>
  </header>

  <!-- ══ STARTSEITE / LOBBY / SPIEL ═════════════════════════════ -->
  <main id="view" class="view"></main>

  <!-- ══ PUNKTE-LEISTE ══════════════════════════════════════════ -->
  <aside id="mechanik" class="mechanik" hidden></aside>

  <!-- ══ STATUSZEILE ════════════════════════════════════════════ -->
  <footer id="statusbar" class="statusbar">
    <span id="statusText">Bereit.</span>
    <span id="statusRight"></span>
  </footer>
</div>

<!-- ══ DIALOGE ══════════════════════════════════════════════════ -->
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

        SS.state.me = msg.you;
        SS.state.players = msg.players || [];
        SS.state.code = msg.code || SS.state.code;
        setStatus("online");
        SS.emit("joined");
        break;
      }
      case "state": {
        applyState(msg.s);
        SS.emit("net");
        break;
      }
      case "start": {
        // Der Host hat die Partie gestartet — Gäste wechseln in die Spielansicht.
        SS.state.phase = "playing";
        if (SS.ui && SS.state.route !== "game") SS.ui.go("game");
        SS.emit("net");
        break;
      }
      case "priv": {
        SS.state.priv[SS.state.me] = msg.priv;
        SS.emit("net");
        break;
      }
      case "act": {
        // Vom Host autoritativ verteilte Aktion (selten) — direkt anwenden
        SS.applyActionRaw(msg.pid, msg.name, msg.payload);
        SS.emit("net");
        break;
      }
      case "chat": {
        SS.logLine(msg.from + ": " + msg.text, "chat");
        SS.emit("net");
        break;
      }
      case "kick": {
        SS.toast(msg.reason || "Du wurdest entfernt.", "err");
        leave();
        SS.emit("net");
        break;
      }
      case "hostleft": {
        setStatus("lost");
        SS.toast("Der Host hat die Gruppe geschlossen.", "err");
        SS.state.connection = "lost";
        SS.emit("net");
        break;
      }
      default: break;
    }
  }

  /* ── Host-Empfang ─────────────────────────────────────────────────────── */
  function handleHostIncoming(conn, msg) {
    switch (msg.t) {
      case "hello": {
        // Wiedereintritt ist ausdrücklich erlaubt: Wer während einer Partie
        // die Verbindung verliert, soll wieder reinfinden — der Punktestand
        // steht ohnehin am Host. Neue Gäste bekommen den laufenden Stand.
        const name = String(msg.name || "Gast").slice(0, 22);
        let p = msg.pid && SS.player(msg.pid);
        if (!p) p = SS.addPlayer(name, { id: msg.pid || SS.uid(8), connected: true, isHost: false });
        else { p.connected = true; p.name = name; }
        conn.pid = p.id;
        SS.state.priv[p.id] = SS.state.priv[p.id] || {};
        sendConn(conn, {
          t: "welcome",
          you: p.id,
          hostId: SS.state.hostId,
          code: SS.state.code,
          players: SS.state.players,
          gameId: SS.state.gameId,
          phase: SS.state.phase,
        });
        if (SS.store) SS.store.touchMembers(SS.state.players);
        SS.logLine(name + " is dabei.", "ok");
        broadcast({ t: "state", s: publicSnapshot() });
        if (SS.state.phase === "playing") broadcast({ t: "start" });
        SS.emit("net");
        break;
      }
      case "ping": {
        sendConn(conn, { t: "pong" });
        break;
      }
      case "act": {
        const pid = conn.pid || msg.pid;
        if (!pid) return;
        SS.applyActionRaw(pid, msg.name, msg.payload);
        SS.emit("net");
        break;
      }
      case "chat": {
        const who = SS.player(conn.pid);
        const line = (who ? who.name : "Gast") + ": " + String(msg.text).slice(0, 200);
        SS.logLine(line, "chat");
        broadcast({ t: "chat", from: who ? who.name : "Gast", text: String(msg.text).slice(0, 200) });
        SS.emit("net");
        break;
      }
      case "leave": {
        if (conn.pid) {
          const who = SS.player(conn.pid);
          SS.removePlayer(conn.pid);
          SS.logLine((who ? who.name : "Ein Gast") + " hat verlassen.");
          broadcast({ t: "state", s: publicSnapshot() });
          SS.emit("net");
        }
        break;
      }
      case "req": {
        // Gast erbittet kompletten Zustand (z. B. nach Neuverbinden)
        sendConn(conn, { t: "state", s: publicSnapshot() });
        if (conn.pid && SS.state.priv[conn.pid] !== undefined) sendConn(conn, { t: "priv", priv: SS.state.priv[conn.pid] });
        break;
      }
      case "outbox": {
        // Nachgereichtes aus der offline verbrachten Zeit.
        const evts = Array.isArray(msg.events) ? msg.events : [];
        if (!evts.length) return;
        let merges = 0;
        evts.forEach((e) => {
          if (!e || typeof e !== "object") return;
          if (e.kind === "spielzug" || e.kind === "runde" || e.kind === "sieg") {
            if (SS.store) SS.store.addChronicle({
              type: e.kind === "spielzug" ? "runde" : e.kind,
              groupCode: SS.state.code || null,
              game: (SS.getMeta(e.gameId) || {}).name || "",
              round: e.round || 0,
              who: (SS.player(conn.pid) || {}).name || "Gast",
              offline: true,
            });
            merges++;
          } else if (e.kind === "punkte" && e.pid) {
            SS.state.scores[e.pid] = (SS.state.scores[e.pid] || 0) + (e.points || 0);
            merges++;
          }
        });
        if (merges) {
          SS.logLine((SS.player(conn.pid) || {}).name + ": " + merges + " Eintrag/Einträge aus der Offline-Zeit nachgreicht.", "ok");
          broadcast({ t: "state", s: publicSnapshot() });
          SS.emit("net");
        }
        break;
      }
      default: break;
    }
  }

  function applyState(s) {
    if (!s) return;
    ["players", "hostId", "gameId", "settings", "phase", "round", "turn", "scores", "pub", "lastResult", "syncSeed", "syncSeq"].forEach((k) => {
      if (s[k] !== undefined) SS.state[k] = s[k];
    });
  }

  /* ── Ausgangskorb: offline Gespieltes nachreichen ─────────────────────── */
  /**
   * Was ohne Netz passiert ist, liegt in SS.store.outbox(). Sobald wieder
   * Kontakt zum Host besteht, geht der ganze Korb in einem Zug raus und
   * wird danach geleert. Der Host verbucht die Einträge in seiner Chronik.
   */
  function flushOutbox() {
    if (!SS.store) return false;
    if (SS.state.role !== "guest") return false;
    if (SS.state.connection !== "online") return false;
    const list = SS.store.outbox();
    if (!list.length) return false;
    if (!sendToHost({ t: "outbox", events: list })) return false;
    SS.store.clearOutbox();
    SS.state.pending = false;
    SS.toast(list.length + " offline Gespieltes is nachgreicht worn.", "ok");
    return true;
  }
  SS.on("net", () => { if (SS.state.role === "guest") setTimeout(flushOutbox, 400); });

  /* ── Gruppe erstellen (Host) ──────────────────────────────────────────── */
  function createGroup(hostName) {
    return new Promise((resolve, reject) => {
      if (!ensureLib()) return reject(new Error("Netzwerk-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen."));
      setStatus("connecting");

      // Eigener, frischer Code bei jedem Öffnen — kein Wiederverwenden des alten.
      let code = null;
      let attempts = 0;

      const tryCreate = () => {
        code = newCode();
        const id = peerIdFor(code);
        peer = new window.Peer(id, { debug: 1, config: { iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ] } });

        let settled = false;

        peer.on("open", () => {
          settled = true;
          SS.state.mode = "online";
          SS.state.role = "host";
          SS.state.code = code;
          SS.state.hostId = SS.state.me = "host";
          SS.state.syncSeed = code + ":" + SS.uid(6);
          // Host selbst als Teilnehmer
          SS.state.players = [];
          SS.state.scores = {};
          const own = SS.addPlayer(hostName || "Host", { id: "host", isHost: true, connected: true });
          SS.state.me = own.id;
          setStatus("online");
          // Runde bleibt am Gerät — taucht nach Neustart oder ohne Netz wieder auf.
          if (SS.store) {
            SS.store.saveGroup({
              code: code, name: (SS.store.loadGroup() || {}).name || "Wirtshausrunde",
              role: "host", lastHost: true, members: [],
            });
            SS.store.touchMembers(SS.state.players);
          }
          SS.logLine("Runde " + code + " geöffnet. Warte auf Beitritte …", "ok");
          resolve({ code });
          SS.emit("net");
        });

        peer.on("connection", (conn) => {
          conns.push(conn);
          attachConn(conn, {});
          SS.emit("net");
        });

        peer.on("error", (err) => {
          const type = err && err.type;
          if (!settled && (type === "unavailable-id" || type === "unavailable")) {
            try { peer.destroy(); } catch (e) {}
            attempts++;
            if (attempts < 10) { code = newCode(); return setTimeout(tryCreate, 220); }
            setStatus("lost");
            return reject(new Error("Kein freier Gruppencode gefunden. Bitte erneut versuchen."));
          }
          if (!settled && (type === "network" || type === "server-error" || type === "socket-error" || type === "ssl-unavailable")) {
            setStatus("offline");
            return reject(new Error("Der Verbindungsdienst ist gerade nicht erreichbar. Nutze so lange den Modus «Am selben Gerät»."));
          }
          console.warn("Peer-Fehler", type, err);
        });

        peer.on("disconnected", () => {
          setStatus("lost", "Broker getrennt");
          try { peer.reconnect(); } catch (e) {}
        });
      };

      tryCreate();
    });
  }

  /* ── Gruppe betreten (Gast) ───────────────────────────────────────────── */
  function joinGroup(code, guestName) {
    return new Promise((resolve, reject) => {
      if (!ensureLib()) return reject(new Error("Netzwerk-Bibliothek konnte nicht geladen werden."));
      code = String(code || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length !== CODE_LEN) return reject(new Error("Bitte einen " + CODE_LEN + "-stelligen Rundencode eingeben."));
      setStatus("connecting");
      SS.state.code = code;

      // Feste Kennung pro Gerät: erlaubt den Wiedereintritt nach einem Abbruch.
      let myPid = SS.store ? SS.store.read("devicePid", null) : null;
      if (!myPid) {
        myPid = SS.uid(10);
        if (SS.store) SS.store.write("devicePid", myPid);
      }
      peer = new window.Peer({
        debug: 1,
        config: { iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ] },
      });

      let settled = false;
      const giveUpAfter = setTimeout(() => {
        if (settled) return;
        settled = true;
        setStatus("offline");
        try { peer.destroy(); } catch (e) {}
        reject(new Error("Keine Gruppe mit dem Code «" + code + "» gefunden. Läuft das Spiel am Host-Gerät, ist der Code richtig, und sind beide Geräte im Internet?"));
      }, 22000);

      peer.on("open", () => {
        const conn = peer.connect(peerIdFor(code), { reliable: true, serialization: "json" });
        hostConn = conn;
        attachConn(conn, { isHost: true });

        conn.on("open", () => {
          settled = true;
          clearTimeout(giveUpAfter);
          SS.state.mode = "online";
          SS.state.role = "guest";
          SS.state.me = myPid;
          if (SS.store) {
            SS.store.saveGroup({
              code: code, name: (SS.store.loadGroup() || {}).name || "Wirtshausrunde",
              role: "guest", lastHost: false,
            });
          }
          sendConn(conn, { t: "hello", name: guestName || "Gast", pid: myPid });
          resolve({ code: code });
        });
        conn.on("error", (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Verbindung fehlgeschlagen: " + (err && err.message ? err.message : "unbekannt")));
        });
      });

      peer.on("error", (err) => {
        const type = err && err.type;
        if (type === "peer-unavailable") {
          if (settled) return;
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Keine Gruppe mit dem Code «" + code + "» gefunden. Ist der Code richtig und der Host bereits in der Lobby?"));
          return;
        }
        if (!settled && (type === "network" || type === "server-error" || type === "socket-error" || type === "ssl-unavailable")) {
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Der Verbindungsdienst ist gerade nicht erreichbar. Nutze so lange den Modus «Am selben Gerät»."));
        }
      });
    });
  }

  /* ── Wieder in die Runde finden (nach Verbindungsabbruch) ─────────────── */
  function rejoin(code, name) {
    if (SS.state.connection === "connecting") return Promise.reject(new Error("läuft schon"));
    setStatus("connecting", "Neu verbinden …");
    return joinGroup(code, name).then(() => {
      SS.toast("Wieder in der Runde.", "ok");
      return true;
    }).catch(() => {
      setStatus("lost");
      return false;
    });
  }

  /* ── Verlassen ────────────────────────────────────────────────────────── */
  function leave() {
    try {
      if (SS.state.role === "host") {
        broadcast({ t: "hostleft" });
        conns.forEach((c) => { try { c.close(); } catch (e) {} });
      } else if (hostConn) {
        sendConn(hostConn, { t: "leave" });
      }
    } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    peer = null; conns = []; hostConn = null;
    setStatus("offline");
  }

  /* ── Selbsttest des Verbindungsdienstes ───────────────────────────────── */
  function available() { return ensureLib(); }

  function init() {
    if (!ensureLib()) {
      setStatus("offline", "Ohne Netzwerk");
      console.info("Schulspiele: PeerJS nicht verfügbar — es läuft nur der Modus «Am selben Gerät».");
      return Promise.resolve(false);
    }
    // Sanfter Erreichbarkeitstest (kein Peer wird dauerhaft geöffnet).
    return probeBroker().catch(() => false);
  }

  function probeBroker() {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ok) => { if (!done) { done = true; try { p.destroy(); } catch (e) {} resolve(ok); } };
      let p;
      try {
        p = new window.Peer({ debug: 0, config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });
      } catch (e) { return resolve(false); }
      p.on("open", () => finish(true));
      p.on("error", () => finish(false));
      setTimeout(() => finish(false), 6000);
    });
  }

  /* ── Export ───────────────────────────────────────────────────────────── */
  Object.assign(SS.net, {
    init, available, setStatus, flushOutbox, rejoin,
    createGroup, joinGroup, leave,
    sendToHost, broadcastState, broadcast, sendTo,
  });
})();

        el("span", { class: "count", text: String(ob) }),
        el("span", {}, [el("strong", { text: "Einträge im Ausgangskorb. " }), "Die gehen raus, sobald wieder Netz da is."]),
        el("button", { class: "btn btn-sm btn-outline", text: "Jetzt versuchen", onclick: () => { SS.net.flushOutbox(); render(); } }),
      ]));
    }

    // Fortsetzen
    if (SS.state.lastSession) {
      const s = SS.state.lastSession;
      const meta = SS.getMeta(s.gameId);
      wrap.appendChild(el("div", { class: "card", style: { marginBottom: "18px" } }, [
        el("div", { class: "eyebrow", text: "Da war doch was" }),
        el("h3", { text: "Letzte Runde fortsetzen" }),
        el("p", { class: "muted", text: (meta ? meta.name : s.gameId) + " · Runde " + s.round + " · " + (s.players || []).length + " Leut · " + fmtWhen(s.at) }),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn btn-gold", text: "Fortsetzen", onclick: () => resumeSession(s) }),
          el("button", { class: "btn btn-outline", text: "Verwerfen", onclick: () => { SS.store.clearSession(); SS.state.lastSession = null; render(); } }),
        ]),
      ]));
    }

    // Person & Strafen-Modus
    const nameCard = el("div", { class: "card" }, [
      el("h3", { text: "Erst kurz der Name" }),
      el("p", { class: "muted", text: "Der Name steht bei den anderen in der Runde." }),
      el("label", { class: "field", style: { maxWidth: "380px" } }, [
        el("span", { text: "Dein Name" }),
        el("input", { type: "text", placeholder: "z. B. Sepp, Resi, Kalle …", value: prof.name, maxlength: "22",
          dataset: { persist: "homeName" }, oninput: (e) => { SS.store.saveProfile({ name: e.target.value }); SS.LS.set("name", e.target.value); } }),
      ]),
      el("div", { class: "eyebrow", style: { marginTop: "6px" }, text: "Was passiert bei einer Strafe?" }),
      el("div", { class: "btn-row" }, PENALTIES.map((p) =>
        el("button", { class: "btn btn-sm " + (prof.penalty === p.key ? "btn-gold" : "btn-outline"), text: p.label,
          onclick: () => { SS.store.saveProfile({ penalty: p.key }); render(); } })
      )),
      el("p", { class: "muted", style: { marginTop: "8px" }, text: (PENALTIES.find((p) => p.key === prof.penalty) || PENALTIES[0]).hint }),
    ]);
    wrap.appendChild(nameCard);

    // Katalog
    wrap.appendChild(el("div", { style: { marginTop: "26px" } }, [
      el("div", { class: "eyebrow", text: "Spiele" }),
      el("h2", { text: "Was spiel ma heut?" }),
      el("p", { class: "lead", text: "Klassiker zum Einstieg, Action für zwischendurch und ein paar Sachen für die ganze Runde. Läuft alles im Browser." }),
      el("div", { class: "grid", style: { marginTop: "16px" } }, SS.GAMES.slice(0, 6).map(gameCard)),
      el("div", { class: "btn-row", style: { marginTop: "18px" } }, [
        el("button", { class: "btn btn-outline", text: "Alle " + SS.GAMES.length + " Spiele", onclick: () => go("catalog") }),
        el("button", { class: "btn btn-ghost", text: "Wirtshaus-Chronik", onclick: () => go("chronik") }),
      ]),
    ]));

    wrap.appendChild(el("div", { class: "footnote" }, [
      el("strong", { text: "Wegen dem Netz. " }),
      "Eine Runde verbindet die Geräte direkt über WebRTC; dafür braucht's einmalig einen Vermittlungsdienst im Internet. Fällt das Netz aus, spielt's trotzdem weiter — was passiert is, wandert in den Ausgangskorb und wird später nachgereicht. Reines Bluetooth zwischen iPhone und Android geht im Browser leider ned, dazu bräucht's a App.",
    ]));

    return wrap;
  }

  function stat(big, title, text) {
    return el("div", { class: "stat-card" }, [
      el("div", { class: "big", text: big }),
      el("div", {}, [el("h3", { text: title }), el("p", { text: text })]),
    ]);
  }

  function fmtWhen(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function resumeSession(s) {
    SS.state.gameId = s.gameId;
    SS.state.settings = s.settings || {};
    SS.state.round = s.round || 1;
    SS.state.players = s.players || SS.state.players;
    SS.state.scores = s.scores || {};
    SS.state.pub = s.pub || {};
    SS.state.phase = "playing";
    SS.state.lastSession = null;
    SS.state.mode = "local";
    SS.state.role = "solo";
    SS.net.setStatus("offline");
    go("game");
  }

  /* ══ Katalog ════════════════════════════════════════════════════════════ */
  let catalogFilter = { tag: "alle", q: "" };

  function viewCatalog() {
    const tags = ["alle", "einstieg", "party", "action", "wissen", "wort", "team", "wettkampf", "ruhig"];
    const chips = tags.map((t) => el("button", {
      class: "chip", "aria-pressed": catalogFilter.tag === t ? "true" : "false",
      text: t === "alle" ? "Alle" : TAGS[t] || t,
      onclick: () => { catalogFilter.tag = t; render(); },
    }));
    const search = el("input", { class: "search", type: "search", placeholder: "Suchen …", value: catalogFilter.q,
      dataset: { persist: "search" }, oninput: (e) => { catalogFilter.q = e.target.value.toLowerCase(); softFilter(); } });
    const listHost = el("div", { class: "grid", id: "catalogGrid" });
    fillCatalog(listHost);
    return el("div", {}, [
      el("div", { class: "eyebrow", text: "Katalog" }),
      el("h1", { text: "Alle Spiele" }),
      el("p", { class: "lead", text: "Wähle ein Spiel. Danach legst du fest, ob's online in der Runde oder am selben Gerät läuft." }),
      el("div", { class: "filters" }, [chips, search]),
      listHost,
    ]);
  }

  function fillCatalog(host) {
    host.innerHTML = "";
    const q = catalogFilter.q, tag = catalogFilter.tag;
    const list = SS.GAMES.filter((g) => {
      if (tag !== "alle" && !(g.tags || []).includes(tag)) return false;
      if (q && !((g.name + " " + g.tagline + " " + (g.tags || []).map((t) => TAGS[t] || t).join(" ")).toLowerCase().includes(q))) return false;
      return true;
    });
    if (!list.length) { host.appendChild(el("div", { class: "card center muted", text: "Nix passt zu der Auswahl." })); return; }
    list.forEach((g) => host.appendChild(gameCard(g)));
  }
  function softFilter() { const grid = SS.$("#catalogGrid"); if (grid) fillCatalog(grid); }

  function gameCard(g) {
    return el("button", { class: "game-card", onclick: () => openGame(g.id) }, [
      el("div", { class: "thumb", style: { "--accent": g.accent || "#3a5f86" } }, [
        el("span", { class: "glyph", text: g.glyph || "★" }),
        el("span", { class: "n", text: (g.minP || 2) + "–" + (g.maxP || 100) + " Leut" }),
      ]),
      el("div", { class: "body" }, [
        el("h3", { text: g.name }),
        el("p", { text: g.tagline }),
        el("div", { class: "tags" }, (g.tags || []).map((t) => el("span", { class: "tag", text: TAGS[t] || t }))),
        el("div", { class: "meta" }, [el("span", { text: g.duration || "" }), el("span", { text: "Regeln →" })]),
      ]),
    ]);
  }

  /* ══ Runden-Lobby ═══════════════════════════════════════════════════════ */
  function viewLobby() {
    const isHost = SS.isHost();
    const guestView = SS.state.mode === "online" && !isHost;
    const wrap = el("div");

    wrap.appendChild(el("div", { class: "eyebrow", text: isHost ? "Runde offen" : guestView ? "Du bist dabei" : "Am selben Gerät" }));
    wrap.appendChild(el("h1", { text: SS.state.mode === "online" ? (isHost ? "Wer kommt alles mit?" : "Du bist dabei") : "Wer spielt mit?" }));

    const pend = SS.store ? SS.store.outboxCount() : 0;
    if (pend > 0 || SS.state.connection === "lost") {
      wrap.appendChild(el("div", { class: "sync-strip" }, [
        el("span", { class: "count", text: String(pend) }),
        el("span", {}, [el("strong", { text: SS.state.connection === "lost" ? "Kein Kontakt zur Runde. " : "Ausgangskorb: " }),
          SS.state.connection === "lost" ? "Es geht am Gerät weiter — nachgereicht wird, sobald's wieder geht." : "Wird nachgereicht, sobald Netz da is."]),
        el("button", { class: "btn btn-sm btn-outline", text: "Jetzt versuchen", onclick: () => { SS.net.flushOutbox(); render(); } }),
      ]));
    }

    const grid = el("div", { class: "lobby-grid" });
    const codeChip = el("div", { class: "code-chip" }, [
      el("div", {}, [el("div", { class: "eyebrow", style: { marginBottom: "2px" }, text: "Rundencode" }), el("div", { class: "val", text: SS.state.code || "----" })]),
      el("button", { class: "btn btn-sm btn-gold", text: "Code kopieren", onclick: () => copy(SS.state.code, "Code kopiert") }),
    ]);
    const link = location.origin + location.pathname + "?code=" + (SS.state.code || "");
    const joinBox = el("div", {}, [
      el("p", { class: "muted", style: { marginTop: "12px" }, text: "Diesen Link kannst in die Gruppe schicken — er füllt den Code auf den anderen Geräten von allein aus." }),
      el("div", { class: "join-link", text: link }),
      el("div", { class: "btn-row", style: { marginTop: "10px" } }, [
        el("button", { class: "btn btn-sm btn-outline", text: "Link kopieren", onclick: () => copy(link, "Link kopiert") }),
      ]),
    ]);

    const left = SS.state.mode === "online"
      ? el("div", { class: "card" }, [
          el("h3", { text: "Wie kommt ma nei" }),
          codeChip, joinBox,
          el("hr", { class: "rule" }),
          el("ol", { class: "net-steps" }, [
            li("num", "1", "Der Code oben wird auf den anderen Geräten unter «Mit Code nei» eingetippt."),
            li("num", "2", "Kurz Internet zum Beitreten, danach reden die Geräte direkt miteinander."),
            li("num", "3", isHost ? "Du wählst unten das Spiel und startest." : "Der Wirt wählt das Spiel und startet."),
          ]),
        ])
      : el("div", { class: "card" }, [
          el("h3", { text: "Ein Gerät, alle dran" }),
          el("p", { class: "lead", text: "Ihr spielt nacheinander an diesem Schirm. Trag unten alle ein, die mitspielen." }),
          el("div", { class: "btn-row" }, [
            el("button", { class: "btn btn-gold", text: "Person dazu", onclick: addLocalPlayerDialog }),
            el("button", { class: "btn btn-outline", text: "In der Runde spielen", onclick: openCreateDialog }),
          ]),
          el("hr", { class: "rule" }),
          el("div", { class: "banner", text: "Tipp: Unter «Punktestand» siehst jederzeit, wer führt. Punkte laufen über alle Runden weiter." }),
        ]);

    const plist = el("ul", { class: "player-list" });
    SS.state.players.forEach((p) => {
      const badges = [];
      if (p.id === SS.state.hostId) badges.push(el("span", { class: "badge host", text: "Wirt" }));
      if (SS.state.mode === "online" && p.id === SS.state.me) badges.push(el("span", { class: "badge you", text: "Du" }));
      if (p.connected === false) badges.push(el("span", { class: "badge gone", text: "weg" }));
      plist.appendChild(el("li", {}, [
        el("span", { class: "avatar", style: { background: p.color }, text: SS.initial(p.name) }),
        el("span", { class: "nm", text: p.name }), badges,
      ]));
    });

    const right = el("div", { class: "card" }, [
      el("h3", { text: "In der Runde (" + SS.connectedCount() + ")" }),
      el("p", { class: "muted", text: SS.state.mode === "online" ? "Bis zu 100 Geräte. Neue Beitritte tauchen von allein auf." : "Am selben Gerät wird abwechselnd gespielt." }),
      plist,
      el("hr", { class: "rule" }),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-sm btn-outline", text: "Namen dazu", onclick: addLocalPlayerDialog }),
        SS.state.mode === "online" && isHost ? el("button", { class: "btn btn-sm btn-outline", text: "Runde schließen", onclick: () => { SS.net.leave(); toHome(); } }) : null,
        guestView ? el("button", { class: "btn btn-sm btn-outline", text: "Runde verlassen", onclick: () => { SS.net.leave(); toHome(); } }) : null,
      ]),
    ]);

    grid.appendChild(left); grid.appendChild(right);
    wrap.appendChild(grid);

    // Spielwahl
    const picker = el("div", { class: "card", style: { marginTop: "18px" } });
    if (isHost) {
      picker.appendChild(el("h3", { text: "Spiel wählen" }));
      picker.appendChild(el("div", { class: "grid" }, SS.GAMES.map((g) =>
        el("button", { class: "game-card", style: SS.state.gameId === g.id ? { boxShadow: "0 0 0 3px var(--gold), var(--shadow)" } : null,
          onclick: () => { selectGame(g.id); render(); } }, [
          el("div", { class: "thumb", style: { "--accent": g.accent || "#3a5f86", height: "58px" } }, [
            el("span", { class: "glyph", text: g.glyph }), el("span", { class: "n", text: g.name }),
          ]),
        ])
      )));
      const meta = SS.getMeta(SS.state.gameId);
      if (meta) {
        picker.appendChild(el("hr", { class: "rule" }));
        picker.appendChild(el("h3", { text: "Einstellungen · " + meta.name }));
        picker.appendChild(el("p", { class: "muted", text: meta.tagline }));
        picker.appendChild(settingsForm(meta));
        picker.appendChild(el("div", { class: "banner", text: "Regeln: " + meta.rules }));
      }
    } else {
      const meta = SS.getMeta(SS.state.gameId);
      picker.appendChild(el("h3", { text: "Gewähltes Spiel" }));
      picker.appendChild(el("p", { class: "lead", text: meta ? meta.glyph + "  " + meta.name + " — " + meta.tagline : "Der Wirt wählt grad a Spiel." }));
      if (meta) picker.appendChild(el("div", { class: "banner", text: "Regeln: " + meta.rules }));
    }
    wrap.appendChild(picker);

    if (isHost) {
      const enough = SS.connectedCount() >= (SS.getMeta(SS.state.gameId) || { minP: 2 }).minP;
      wrap.appendChild(el("div", { class: "card center", style: { marginTop: "18px" } }, [
        SS.state.gameId
          ? el("button", { class: "btn btn-gold btn-lg", disabled: !enough, text: "Los geht's", onclick: startGame })
          : el("p", { class: "muted", text: "Wähle zuerst oben a Spiel." }),
        !enough && SS.state.gameId ? el("p", { class: "muted", style: { marginTop: "10px" }, text: "Für das Spiel braucht's mindestens " + SS.getMeta(SS.state.gameId).minP + " Leut." }) : null,
      ]));
    } else {
      wrap.appendChild(el("div", { class: "banner green", style: { marginTop: "18px" }, text: "Alles bereit. Sobald der Wirt startet, geht's von allein los." }));
    }
    return wrap;
  }

  function li(cls, num, text) { return el("li", {}, [el("span", { class: cls, text: num }), el("span", { text: text })]); }

  function settingsForm(meta) {
    const box = el("div");
    const defs = meta.settings || [];
    if (!defs.length) { box.appendChild(el("p", { class: "muted", text: "Für das Spiel braucht's keine Einstellungen." })); return box; }
    const row = el("div", { class: "inline-form" });
    defs.forEach((d) => {
      const cur = SS.state.settings[d.key] !== undefined ? SS.state.settings[d.key] : d.default;
      let input;
      if (d.type === "select") {
        input = el("select", { onchange: (e) => setSetting(d.key, e.target.value) },
          (d.options || []).map((o) => el("option", { value: o.value, selected: String(cur) === String(o.value) ? true : null, text: o.label })));
      } else if (d.type === "number") {
        input = el("input", { type: "number", min: d.min, max: d.max, value: cur, onchange: (e) => setSetting(d.key, Number(e.target.value)) });
      } else {
        input = el("select", { onchange: (e) => setSetting(d.key, e.target.value === "true") }, [
          el("option", { value: "true", selected: cur === true || cur === "true" ? true : null, text: "Ja" }),
          el("option", { value: "false", selected: cur === false || cur === "false" ? true : null, text: "Nein" }),
        ]);
      }
      row.appendChild(el("label", { class: "field" }, [el("span", { text: d.label }), input]));
    });
    box.appendChild(row);
    return box;
  }

  function setSetting(key, value) {
    SS.state.settings[key] = value;
    SS.LS.set("settings:" + SS.state.gameId, SS.state.settings);
    if (SS.isHost()) SS.sync();
  }

  function selectGame(id) {
    SS.state.gameId = id;
    SS.state.settings = SS.LS.get("settings:" + id, {});
    const meta = SS.getMeta(id);
    (meta.settings || []).forEach((d) => { if (SS.state.settings[d.key] === undefined) SS.state.settings[d.key] = d.default; });
    if (SS.isHost()) SS.sync();
  }

  /* ══ Spielansicht ═══════════════════════════════════════════════════════ */
  function viewGame() {
    const meta = SS.getMeta(SS.state.gameId) || { name: "Spiel", glyph: "★", tagline: "" };
    const head = el("div", { class: "game-head" }, [
      el("div", { class: "icon", text: meta.glyph || "★" }),
      el("div", { class: "titles" }, [
        el("h1", { text: meta.name }),
        el("p", { class: "sub", text: meta.tagline + (SS.state.mode === "online" ? "  ·  Runde " + SS.state.code : "  ·  am Gerät") }),
      ]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-sm btn-outline", text: "Regeln", onclick: () => rulesDialog(meta) }),
        SS.isHost() ? el("button", { class: "btn btn-sm btn-outline", text: "Neue Runde", onclick: restartGame }) : null,
        el("button", { class: "btn btn-sm btn-outline", text: "Verlassen", onclick: leaveGame }),
      ]),
    ]);
    const seatBar = seatSwitcher();
    const stage = el("div", { class: "stage", id: "stageHost" }, buildStage());
    return frag([head, seatBar, stage]);
  }

  /** Lokaler Modus, gleichzeitige Spiele: wer hält grad das Gerät? */
  function seatSwitcher() {
    if (SS.state.mode !== "local" || !SS.isSimultaneous() || SS.state.phase !== "playing") return null;
    return el("div", { class: "card seat-switcher", style: { marginBottom: "16px", padding: "14px 16px" } }, [
      el("div", { class: "eyebrow", text: "Wer hält grad das Gerät?" }),
      el("div", { class: "btn-row" }, SS.state.players.map((p) =>
        el("button", { class: "btn btn-sm " + (SS.state.seat === p.id ? "btn-gold active" : "btn-outline"), text: p.name,
          onclick: () => { SS.state.seat = p.id; renderCurrentGame(); } })
      )),
      el("p", { class: "muted", style: { margin: "8px 0 0", fontSize: "13px" }, text: "Tippt euren Namen an, bevor ihr antwortet. So landen die Punkte im richtigen Haus." }),
    ]);
  }

  function buildStage() {
    const impl = SS.IMPL[SS.state.gameId];
    if (!impl) return el("p", { class: "muted", text: "Das Spiel is ned geladen." });
    const ctx = SS.makeCtx();
    // Partie vorbei: Endstand mit Auswertung zeigen.
    if (SS.state.phase === "over") {
      const title = (SS.state.lastResult && SS.state.lastResult.title) || "Endstand";
      try { return SS.util.finalScreen(ctx, title, "Gut Schluck — und bis zum nächsten Mal."); }
      catch (e) { console.error(e); return el("div", { class: "banner red", text: "Fehler beim Endstand: " + e.message }); }
    }
    if (SS.state.phase === "playing" && SS.state.pub && SS.state.pub.game && SS.state.pub.game !== SS.state.gameId) {
      return el("div", { class: "center muted", style: { padding: "40px 0" }, text: "Die Runde wird vorbereitet …" });
    }
    try { return impl.render(ctx) || el("div"); }
    catch (e) { console.error(e); return el("div", { class: "banner red", text: "Fehler beim Zeichnen: " + e.message }); }
  }

  /* ══ Chronik ════════════════════════════════════════════════════════════ */
  function viewChronicle() {
    const entries = SS.store ? SS.store.chronicle() : [];
    const tally = SS.store ? SS.store.tally() : [];
    const wrap = el("div");
    wrap.appendChild(el("div", { class: "eyebrow", text: "Wirtshausbuch" }));
    wrap.appendChild(el("h1", { text: "Chronik" }));
    wrap.appendChild(el("p", { class: "lead", text: "Was im Wirtshaus halt so passiert. Bleibt im Gerät stehen — auch die Zeit, in der kein Netz da war." }));

    const usage = SS.store ? SS.store.usage() : { kb: 0 };
    const ob = SS.store ? SS.store.outboxCount() : 0;
    wrap.appendChild(el("div", { class: "sync-strip" }, [
      el("span", {}, [el("strong", { text: entries.length + " Einträge " }), "· " + usage.kb + " kB belegt"]),
      ob ? el("span", {}, [el("strong", { text: ob + " im Ausgangskorb" })]) : el("span", { class: "muted", text: "Ausgangskorb leer" }),
      el("button", { class: "btn btn-sm btn-outline", text: "Ausgangskorb leeren", onclick: () => { SS.store.clearOutbox(); SS.state.pending = false; render(); } }),
      el("button", { class: "btn btn-sm btn-outline", text: "Chronik leeren", onclick: confirmWipeChronicle }),
    ]));

    if (tally.length) {
      wrap.appendChild(el("div", { class: "card", style: { marginBottom: "18px" } }, [
        el("h3", { text: "Wer war am fleißigsten" }),
        el("table", { class: "scoreboard" }, [
          el("thead", {}, el("tr", {}, [el("th", { text: "#" }), el("th", { text: "Name" }), el("th", { text: "Siege" }), el("th", { text: "Schlucke" }), el("th", { text: "Punkte" })])),
          el("tbody", {}, tally.slice(0, 20).map((t, i) => el("tr", { class: i === 0 ? "lead-row" : "" }, [
            el("td", {}, el("span", { class: "rank", text: (i + 1) + "." })),
            el("td", { text: t.name }),
            el("td", { class: "num", text: String(t.wins) }),
            el("td", { class: "num", text: String(t.drinks) }),
            el("td", { class: "num", text: String(t.points) }),
          ]))),
        ]),
      ]));
    }

    if (!entries.length) {
      wrap.appendChild(el("div", { class: "card center muted", text: "Noch nix drin. Spielt a Runde, dann füllt sich das Buch." }));
    } else {
      const ul = el("ul", { class: "chronicle" });
      entries.slice(0, 200).forEach((e) => {
        ul.appendChild(el("li", {}, [
          el("span", { class: "when", text: fmtWhen(e.at) }),
          el("span", { class: "what" }, [
            el("span", { class: "who", text: e.who || "Runde" }), " ",
            e.type === "sieg" ? "hat gewonnen" : e.type === "schluck" ? "hat einen Schluck kassiert" : "hat eine Runde gespielt",

  function confirmWipeChronicle() {
    SS.modal("Chronik leeren?", frag([el("p", { text: "Alles, was im Buch steht, wird gelöscht. Des kommt nimmer zurück." })]), [
      { label: "Behalten" },
