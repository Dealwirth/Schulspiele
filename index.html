<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140d08">
<meta name="description" content="Seidla — die fränkische Wirtshausrunde. Ein Abend, eine Runde, jeder kriegt 5 bis 10 Aufgaben und weist sie mit einem Foto nach. Die Aufgaben hängen aneinander, Sidequests kommen von der Runde selbst. Läuft auch ohne Netz weiter.">
<title>Seidla — die fränkische Wirtshausrunde</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2322150d'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23d9a521' font-family='Georgia'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Seidla — Wirtshaus-Design
   Klassisch gehalten: Kupfer, Bierfilz, dunkles Holz. Kein grelles Party-Bunt.
   Alle Größen sind so gebaut, dass es ab 360 px sauber läuft und am Tablet
   und Laptop großzügiger wird.
   ========================================================================== */
:root{
  --wood:#140d08;
  --wood-2:#22150d;
  --wood-3:#31200f;
  --copper:#c98b3c;
  --gold:#d9a521;
  --cream:#f4e9d4;
  --cream-2:#e8d8b8;
  --ink:#241a10;
  --ink-soft:#5c4a33;
  --red:#9c2b23;
  --green:#3d6b45;
  --blue:#35507d;
  --line:rgba(201,139,60,.28);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:14px;
  --font-serif:Georgia,"Times New Roman",serif;
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(201,139,60,.16), transparent 60%),
    repeating-linear-gradient(90deg, var(--wood) 0 38px, #180f09 38px 40px),
    var(--wood);
  color:var(--cream);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ── Kopfzeile ─────────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, rgba(20,13,8,.97), rgba(20,13,8,.9));
  border-bottom:2px solid var(--line);
  backdrop-filter:blur(6px);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;flex-wrap:wrap;
}
.top-left{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand{
  background:none;border:0;color:var(--gold);font-family:var(--font-serif);
  font-size:22px;font-weight:700;letter-spacing:.5px;cursor:pointer;padding:2px 0;
}
.brand:hover{color:var(--cream)}
.brand-sub{color:var(--ink-soft);color:#a08a68;font-size:12px;font-style:italic;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.net-badge{
  font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);
  color:#c0a577;background:rgba(201,139,60,.08);white-space:nowrap;
}
.net-badge.online{color:#b7e0bd;border-color:rgba(61,107,69,.6);background:rgba(61,107,69,.18)}
.net-badge.warn{color:#f0d9a0;border-color:rgba(217,165,33,.6)}
.net-badge.bad{color:#f0b0aa;border-color:rgba(156,43,35,.6)}
.outbox-bar{
  flex-basis:100%;margin-top:6px;font-size:12.5px;color:#f0d9a0;
  background:rgba(217,165,33,.12);border:1px solid rgba(217,165,33,.4);
  border-radius:8px;padding:6px 10px;
}

/* ── Grundgerüst ───────────────────────────────────────────────────────── */
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:22px 16px 60px;flex:1}
.view{flex:1;display:flex;flex-direction:column}
h1{font-family:var(--font-serif);font-size:clamp(26px,5vw,40px);margin:0 0 8px;color:var(--cream)}
h2{font-family:var(--font-serif);font-size:20px;margin:0;color:var(--gold)}
h3{font-family:var(--font-serif);font-size:17px;margin:18px 0 8px;color:var(--copper)}
p{margin:8px 0}
.lead{font-size:17px;color:#dcc9a6;max-width:62ch}
.muted{color:#b09a78}
.small{font-size:13px}
.spacer{flex:1}
.foot{
  text-align:center;padding:20px 16px 34px;color:#8a7458;font-size:12.5px;
  border-top:1px solid rgba(201,139,60,.16);margin-top:20px;
}

/* ── Knöpfe ────────────────────────────────────────────────────────────── */
.btn{
  font:inherit;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);
  transition:transform .08s ease, background .15s ease;
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:translateY(1px)}
.btn.tiny{font-size:12.5px;padding:6px 11px}
.btn-gold{background:linear-gradient(180deg,var(--gold),#b8860f);color:#241a10;border-color:#8f6a0c;font-weight:600}
.btn-gold:hover{background:linear-gradient(180deg,#e8b83a,#c8940f)}
.btn-outline{background:transparent}
.btn-ghost{background:transparent;border-color:rgba(201,139,60,.2);color:#d7c3a0}
.btn-danger{background:rgba(156,43,35,.22);border-color:rgba(156,43,35,.6);color:#f3c9c4}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Startseite ────────────────────────────────────────────────────────── */
.hero{padding:18px 0 6px;border-bottom:1px solid rgba(201,139,60,.16);margin-bottom:20px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
}
.card h3{margin-top:0;color:var(--gold);font-size:16px}
.card ul{margin:0;padding-left:18px;color:#d3c0a0;font-size:14px}
.card li{margin:5px 0}

/* ── Lobby ─────────────────────────────────────────────────────────────── */
.lobby-head{text-align:center;padding:10px 0 22px}
.code-box{
  display:inline-flex;align-items:center;gap:12px;margin-top:10px;
  background:linear-gradient(180deg,var(--cream),var(--cream-2));color:var(--ink);
  border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);
  border:1px solid rgba(90,60,20,.35);flex-wrap:wrap;justify-content:center;
}
.code-label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-soft)}
.code-big{
  font-family:var(--font-serif);font-size:38px;font-weight:700;letter-spacing:6px;
  color:var(--red);
}
.code-box .btn{border-color:rgba(90,60,20,.4);color:var(--ink)}

.panel{
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;
}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pill{
  font-size:11.5px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--line);color:#c0a577;background:rgba(201,139,60,.1);
}
.pill.gold{background:rgba(217,165,33,.2);border-color:rgba(217,165,33,.55);color:#f2dc9e}
.pill.ok{background:rgba(61,107,69,.2);border-color:rgba(61,107,69,.55);color:#b7e0bd}
.pill.ghost{background:transparent;color:#9d8867}

/* ── Teilnehmer ────────────────────────────────────────────────────────── */
.roster{display:flex;flex-direction:column;gap:6px}
.roster-row{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;
  background:rgba(0,0,0,.2);border:1px solid rgba(201,139,60,.14);
}
.roster-name{font-weight:600}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;flex:0 0 auto;
  box-shadow:inset 0 -2px 6px rgba(0,0,0,.3);
}
.avatar.tiny{width:22px;height:22px;font-size:11px}
.avatar.big{width:54px;height:54px;font-size:22px}

/* ── Einstellungen ─────────────────────────────────────────────────────── */
.settings{display:flex;flex-direction:column;gap:14px}
.setting-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.setting-row.check{gap:8px;font-size:14px;cursor:pointer}
.setting-label{font-size:13px;color:#c0a577;min-width:150px}
.setting-row input[type=range]{flex:1;min-width:120px;accent-color:var(--gold)}
.setting-block{display:flex;flex-direction:column;gap:8px}
.type-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.type-chip{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;
  border:1px solid rgba(201,139,60,.22);background:rgba(0,0,0,.2);color:#cbb896;
  font:inherit;font-size:13.5px;cursor:pointer;text-align:left;
}
.type-chip.on{border-color:var(--gold);background:rgba(217,165,33,.16);color:var(--cream)}
.type-chip.dim{opacity:.45}
.type-chip .type-count{margin-left:auto;font-size:11px;color:#9d8867}
select,input[type=text],input[type=password],input[type=number]{
  font:inherit;font-size:15px;padding:9px 11px;border-radius:9px;
  border:1px solid rgba(201,139,60,.3);background:rgba(0,0,0,.3);color:var(--cream);
  width:100%;max-width:340px;
}
select{cursor:pointer}
.code-input{letter-spacing:5px;font-family:var(--font-serif);font-size:20px;max-width:150px;text-align:center}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field-label{font-size:12.5px;color:#c0a577;text-transform:uppercase;letter-spacing:.8px}

/* ── Aufgaben ──────────────────────────────────────────────────────────── */
.task-head{padding:6px 0 16px}
.progress{height:9px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--copper),var(--gold));transition:width .3s ease}
.task-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.task{
  background:linear-gradient(180deg,var(--cream),var(--cream-2));color:var(--ink);
  border-radius:var(--radius);padding:14px;border:1px solid rgba(90,60,20,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;
}
.task.confirmed{border-color:rgba(61,107,69,.6);background:linear-gradient(180deg,#eaf0e4,#dde6d4)}
.task.drawn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,165,33,.35),0 4px 14px rgba(0,0,0,.3)}
.task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-points{margin-left:auto;font-weight:700;color:var(--red);font-size:14px}
.task-text{margin:0;font-size:15.5px;line-height:1.45}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-target{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600}
.task-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.task .btn{border-color:rgba(90,60,20,.4);color:var(--ink);background:rgba(255,255,255,.5)}
.task .btn:hover{background:rgba(255,255,255,.8)}
.task .btn-gold{color:#241a10}
.task .btn-danger{background:rgba(156,43,35,.16);border-color:rgba(156,43,35,.5);color:var(--red)}
.type-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.12);color:var(--ink-soft);
  border:1px solid rgba(90,60,20,.25);
}
.type-badge.lvl-3{background:rgba(156,43,35,.16);color:var(--red);border-color:rgba(156,43,35,.35)}
.type-badge.lvl-2{background:rgba(201,139,60,.2);color:#8a5a12}
.type-glyph{font-size:13px}
.proof{display:flex;flex-direction:column;gap:4px}
.proof-img{
  width:100%;border-radius:9px;display:block;border:1px solid rgba(90,60,20,.35);
  max-height:280px;object-fit:cover;background:#000;
}
.done-panel .task{opacity:.94}
.sidequest-panel .task{background:linear-gradient(180deg,#f3ead6,#e6d9bd)}

/* ── Album ─────────────────────────────────────────────────────────────── */
.album-head{padding:6px 0 16px}
.album-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.album-item{margin:0;background:rgba(0,0,0,.25);border-radius:10px;padding:8px;border:1px solid var(--line)}
.album-item img{width:100%;border-radius:7px;display:block;aspect-ratio:1;object-fit:cover}
.album-item figcaption{margin-top:6px;font-size:11.5px;color:#b09a78;line-height:1.3}

/* ── Bericht ───────────────────────────────────────────────────────────── */
.report{max-height:62vh;overflow:auto}
.podium{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.podium-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);min-width:110px}
.podium-item.rank-1{border-color:var(--gold);background:rgba(217,165,33,.14)}
.rank-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
.rank-table th,.rank-table td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(201,139,60,.18)}
.rank-table th{color:var(--copper);font-size:12px;text-transform:uppercase;letter-spacing:.7px}
.report-text{
  width:100%;min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.5;padding:12px;border-radius:10px;
  border:1px solid rgba(201,139,60,.3);background:rgba(0,0,0,.35);color:var(--cream);
  resize:vertical;
}

/* ── Wirt-Bereich ──────────────────────────────────────────────────────── */
.wirt{min-width:min(560px,84vw)}
.wirt-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid rgba(201,139,60,.25);padding-bottom:8px;margin-bottom:12px}
.wirt-tab{
  font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(201,139,60,.25);background:transparent;color:#c0a577;
}
.wirt-tab.on{background:rgba(217,165,33,.18);border-color:var(--gold);color:var(--cream)}
.wirt-body{max-height:60vh;overflow:auto}
.wirt-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid rgba(201,139,60,.14)}
.stat-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));margin-bottom:14px}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stat strong{font-size:22px;color:var(--gold);font-family:var(--font-serif)}

/* ── Dialoge & Hinweise ────────────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;
  background:rgba(8,5,3,.8);backdrop-filter:blur(4px);overflow:auto}
.modal-root[hidden]{display:none}
.modal{
  background:linear-gradient(180deg,var(--cream),var(--cream-2));color:var(--ink);
  border-radius:16px;padding:20px;max-width:600px;width:100%;box-shadow:var(--shadow);
  border:1px solid rgba(90,60,20,.4);max-height:92vh;overflow:auto;
}
.modal h2{margin:0 0 12px;color:var(--red);font-family:var(--font-serif)}
.modal h3{color:var(--ink);margin:14px 0 6px}
.modal .muted{color:var(--ink-soft)}
.modal .field-label{color:var(--ink-soft)}
.modal input,.modal select,.modal textarea{border-color:rgba(90,60,20,.35);background:rgba(255,255,255,.6);color:var(--ink)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal .btn{border-color:rgba(90,60,20,.4);color:var(--ink);background:rgba(255,255,255,.5)}
.modal .btn:hover{background:#fff}
.modal .btn-gold{background:linear-gradient(180deg,var(--gold),#b8860f);color:#241a10;border-color:#8f6a0c}
.modal .btn-danger{background:rgba(156,43,35,.16);border-color:rgba(156,43,35,.5);color:var(--red)}
.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:rgba(34,21,13,.96);color:var(--cream);border:1px solid var(--line);
  border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:var(--shadow);
  max-width:88vw;
}
.toast.err{border-color:rgba(156,43,35,.7);color:#f6cdc8}
.toast.ok{border-color:rgba(61,107,69,.7);color:#c9e6cd}

.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row-actions input{flex:1;min-width:160px}

/* ── QR-Code und Beitritt ──────────────────────────────────────────────── */
.code-wrap{
  display:flex;gap:18px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-top:12px;
}
.qr-panel{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--cream),var(--cream-2));
  border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);
  border:1px solid rgba(90,60,20,.35);max-width:260px;
}
.qr-box{line-height:0}
.qr-box svg{display:block;width:100%;height:auto;max-width:220px;border-radius:6px}
.qr-panel .muted{color:var(--ink-soft);text-align:center;margin:0}
.qr-fallback{padding:20px;text-align:center}

/* ── Modi ──────────────────────────────────────────────────────────────── */
.mode-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.mode-chip{
  display:flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:11px;
  border:1px solid rgba(201,139,60,.25);background:rgba(0,0,0,.22);color:#cbb896;
  font:inherit;cursor:pointer;text-align:left;
}
.mode-chip.on{border-color:var(--gold);background:rgba(217,165,33,.16);color:var(--cream)}
.mode-chip .mode-glyph{font-size:20px}
.mode-chip .mode-name{font-family:var(--font-serif);font-size:16px;font-weight:700}
.mode-chip .mode-hint{font-size:11.5px;line-height:1.35;color:#a08a68}
.mode-chip.on .mode-hint{color:#d3c0a0}
.mode-chip.mode-vollsuff.on{border-color:rgba(156,43,35,.85);background:rgba(156,43,35,.2)}
.mode-chip.mode-hardcore.on{border-color:rgba(201,139,60,.9)}
.mode-warn{
  margin-top:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;
  background:rgba(156,43,35,.16);border:1px solid rgba(156,43,35,.6);color:#f0cfc9;
}

/* ── Chat ──────────────────────────────────────────────────────────────── */
.chat-log{
  display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;
  padding:10px;border-radius:10px;background:rgba(0,0,0,.28);
  border:1px solid rgba(201,139,60,.16);margin-bottom:10px;
}
.chat-line{
  display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:8px;
  background:rgba(255,255,255,.03);
}
.chat-line.own{background:rgba(217,165,33,.1)}
.chat-who{font-weight:600;font-size:13px;color:var(--copper);white-space:nowrap}
.chat-text{flex:1;font-size:14px;word-break:break-word}
.chat-at{font-size:11px;color:#8a7458;white-space:nowrap}
.chat-panel .row-actions input{flex:1;min-width:140px}

/* ── Wertung ───────────────────────────────────────────────────────────── */
.review-card .host-acts{border-top:1px dashed rgba(90,60,20,.35);padding-top:8px;margin-top:4px}
.task.voided{opacity:.62;border-color:rgba(156,43,35,.7);background:linear-gradient(180deg,#efe2df,#e3d3d0)}
.task.voided .task-text{text-decoration:line-through}
.pill.bad{background:rgba(156,43,35,.2);border-color:rgba(156,43,35,.6);color:#f3c9c4}
.pill.warn{background:rgba(217,165,33,.18);border-color:rgba(217,165,33,.55);color:#f2dc9e}

/* ── Schmale Geräte ────────────────────────────────────────────────────── */
@media (max-width:600px){
  .wrap{padding:16px 12px 50px}
  .brand{font-size:19px}
  .brand-sub{display:none}
  .top-right{gap:5px}
  .btn.tiny{font-size:12px;padding:5px 9px}
  .task-list{grid-template-columns:1fr}
  .setting-label{min-width:0;width:100%}
  .code-big{font-size:30px;letter-spacing:4px}
  .modal{padding:16px}
  .wirt{min-width:0}
  .album-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .code-wrap{gap:12px}
  .qr-panel{max-width:100%}
  .qr-box svg{max-width:170px}
  .mode-grid{grid-template-columns:1fr}
  .chat-log{max-height:46vh}
}
@media (max-width:360px){
  .top-left{width:100%}
  .brand{font-size:17px}
}

        else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
        else if (k === "dataset") Object.assign(node.dataset, v);
        else if (k === "value" && "value" in node) node.value = v;
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : String(v));
      }
    }
    appendChildren(node, children);
    return node;
  }
  function appendChildren(node, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) return children.forEach((c) => appendChildren(node, c));
    if (children instanceof Node) return node.appendChild(children);
    node.appendChild(document.createTextNode(String(children)));
  }
  const frag = (children) => {
    const f = document.createDocumentFragment();
    appendChildren(f, children);
    return f;
  };
  const esc = (s) =>
    String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );

  /* ── Zufall & Kennungen ───────────────────────────────────────────────── */
  function shuffle(arr, rndFn) {
    const a = arr.slice();
    const r = rndFn || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // deterministischer Zufall aus Text (für gemeinsames Austeilen im Netzwerk)
  function seededRng(seedStr) {
    let h = 1779033703 ^ String(seedStr).length;
    for (let i = 0; i < String(seedStr).length; i++) {
      h = Math.imul(h ^ String(seedStr).charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    let a = h >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const uid = (n) => {
    const s = "abcdefghijklmnopqrstuvwxyz0123456789";
    let out = "";
    for (let i = 0; i < (n || 8); i++) out += s[Math.floor(Math.random() * s.length)];
    return out;
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const pick = (arr, rndFn) => arr[Math.floor((rndFn || Math.random)() * arr.length)];

  /* ── Farben & Abzeichen ───────────────────────────────────────────────── */
  const PALETTE = ["#35507d", "#a4262c", "#2f6b4f", "#c99a3a", "#5b4a86", "#256b6b", "#b2622a", "#7d3f6b", "#3c6e9a", "#8a6a1f"];
  const colorFor = (idx) => PALETTE[idx % PALETTE.length];
  const initial = (name) => (String(name || "?").trim()[0] || "?").toUpperCase();

  /* ── Hinweise (Toast) & Dialog ────────────────────────────────────────── */
  function toast(msg, kind) {
    const root = $("#toastRoot");
    if (!root) return;
    const t = el("div", { class: "toast " + (kind || ""), text: msg });
    root.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity .3s ease";
      t.style.opacity = "0";
      setTimeout(() => t.remove(), 320);
    }, kind === "err" ? 4200 : 2900);
  }

  function modal(title, bodyNode, actions) {
    const root = $("#modalRoot");
    root.hidden = false;
    root.innerHTML = "";
    const box = el("div", { class: "modal", role: "dialog", "aria-modal": "true" });
    box.appendChild(el("h2", { text: title }));
    box.appendChild(bodyNode);
    const act = el("div", { class: "modal-actions" });
    (actions || [{ label: "Zumachen" }]).forEach((a) => {
      act.appendChild(
        el("button", {
          class: "btn " + (a.kind === "primary" ? "btn-gold" : a.kind === "danger" ? "btn-danger" : "btn-outline"),
          text: a.label,
          onclick: () => { if (!a.onClick || a.onClick() !== false) closeModal(); },
        })
      );
    });
    box.appendChild(act);
    root.appendChild(box);
    const onBackdrop = (e) => { if (e.target === root) closeModal(); };
    root.addEventListener("click", onBackdrop);
    root._cleanup = () => root.removeEventListener("click", onBackdrop);
    return box;
  }
  function closeModal() {
    const root = $("#modalRoot");
    if (root._cleanup) root._cleanup();
    root.hidden = true;
    root.innerHTML = "";
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#modalRoot").hidden) closeModal(); });

  /* ── Zeichenroutine (wird von ui.js gesetzt) ──────────────────────────── */
  let renderFn = function () {};
  const setRenderCurrent = (fn) => { renderFn = fn; };
  const renderCurrent = () => renderFn();

  /* ── Netzwerkschicht (wird von net.js befüllt) ────────────────────────── */
  const net = {
    init: () => Promise.resolve(false),
    sendToHost: () => false,
    broadcastState: () => false,
    broadcast: () => false,
    createGroup: () => Promise.reject(new Error("Netzwerk nicht geladen")),
    joinGroup: () => Promise.reject(new Error("Netzwerk nicht geladen")),
    leave: () => {},
    available: () => false,
    setStatus: () => {},
  };

  /* ── Anwendungszustand ────────────────────────────────────────────────── */
  const state = {
    route: "home",
    // Netzwerk
    mode: "local",            // 'local' | 'online'
    role: "solo",             // 'host' | 'guest' | 'solo'
    code: null,
    connection: "offline",    // 'offline' | 'connecting' | 'online' | 'lost'
    pending: false,
    // Teilnehmer
    players: [],
    hostId: null,
    me: null,
    // Abend
    phase: "lobby",           // 'lobby' | 'running' | 'review' | 'over'
    groupName: "Wirtshausrunde",
    seed: null,
    ring: [],
    assignments: {},
    sidequests: [],
    proposals: [],
    settings: {
      perPlayer: 7,
      modeId: "entspannt",
      maxLevel: 1,
      types: null,            // null = alle Kategorien des Modus
      sidequests: true,
      chat: true,
      review: true,           // Gesamtwertung am Ende
      hostOverride: true,     // Wirt darf Wertung unterbinden
    },
    reviews: {},              // aid -> { ok:[pid], bad:[pid] }
    log: [],
  };

  const listeners = {};
  const on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); };
  const emit = (evt, payload) => {
    if (evt !== "render") (listeners[evt] || []).forEach((f) => f(payload));
    (listeners["*"] || []).forEach((f) => f(evt, payload));
  };

  const player = (pid) => state.players.find((p) => p.id === pid) || null;
  const alive = () => state.players.filter((p) => p.connected !== false);
  const myPid = () => state.me;
  const isHost = () => state.role === "host" || state.role === "solo";
  const connectedCount = () => alive().length;
  const nameOf = (pid) => { const p = player(pid); return p ? p.name : "jemand"; };

  function logLine(text, kind) {
    state.log.push({ t: Date.now(), text: String(text), kind: kind || "" });
    if (state.log.length > 200) state.log.shift();
    emit("log", state.log[state.log.length - 1]);
  }

  /* ── Teilnehmerverwaltung ─────────────────────────────────────────────── */
  function addPlayer(name, opts) {
    opts = opts || {};
    const idx = state.players.length;
    const p = {
      id: opts.id || uid(8),
      name: String(name || "Gast").slice(0, 22),
      color: opts.color || colorFor(idx),
      connected: opts.connected !== false,
      isHost: !!opts.isHost,
      index: idx,
      joinedAt: Date.now(),
    };
    state.players.push(p);
    if (p.isHost) state.hostId = p.id;
    return p;
  }
  function removePlayer(pid) {
    const p = player(pid);
    if (p) p.connected = false;
  }

  /* ══ Der Abend ══════════════════════════════════════════════════════════ */

  const tasksOf = (pid) => state.assignments[pid] || [];
  function findTask(pid, aid) { return tasksOf(pid).find((t) => t.aid === aid) || null; }
  function findTaskAnywhere(aid) {
    for (const pid in state.assignments) {
      const t = tasksOf(pid).find((x) => x.aid === aid);
      if (t) return { pid: pid, task: t };
    }
    return null;
  }

  /**
   * Ist diese Aufgabe ungültig? Das passiert, wenn die Runde sie am Ende
   * mehrheitlich ablehnt und der Wirt die Übersteuerung nicht nutzt.
   */
  const isVoid = (t) => !!t.voided;

  /** Punkte einer Person: gültige Aufgaben plus geschaffte Sidequests. */
  function pointsOf(pid) {
    let n = tasksOf(pid).reduce((sum, t) => sum + (t.confirmed && !isVoid(t) ? t.points : 0), 0);
    (state.sidequests || []).forEach((q) => {
      if (q.done && q.done[pid] && !q.done[pid].voided) n += (q.done[pid].points || 2);
    });
    return n;
  }
  function sidequestsDone(pid) {
    return (state.sidequests || []).filter((q) => q.done && q.done[pid] && !q.done[pid].voided).length;
  }
  function doneCount(pid) {
    const list = tasksOf(pid);
    return {
      done: list.filter((t) => t.confirmed && !isVoid(t)).length,
      open: list.filter((t) => !t.confirmed || isVoid(t)).length,
      total: list.length,
    };
  }

  const photoFor = (aid) => (SS.store ? SS.store.album().find((p) => p.aid === aid) : null);

  /** Foto zur Aufgabe hinterlegen. Ohne Bild gilt eine Aufgabe nicht. */
  function attachPhoto(pid, aid, data) {
    const t = findTask(pid, aid);
    if (!t) { toast("Die Aufgabe gibt's ned.", "err"); return false; }
    if (t.confirmed) { toast("Is scho abgehakt.", "err"); return false; }
    if (!data) { toast("Ohne Bild geht's ned.", "err"); return false; }
    const rec = SS.store.addPhoto({
      aid: aid, pid: pid, data: data, taskId: t.taskId,
      who: nameOf(pid), groupCode: state.code || null, text: t.text,
    });
    t.photo = rec.id;
    t.at = Date.now();
    t.done = true;
    // Neuer Nachweis: alte Bewertungen gelten nicht mehr.
    t.flagBy = []; t.voided = false;
    state.reviews[aid] = { ok: [], bad: [] };
    logLine(nameOf(pid) + " hat einen Nachweis gebracht.", "ok");
    return true;
  }

  /** Eine Aufgabe abhaken — nur mit Foto. */
  function confirmTask(pid, aid, byHost) {
    const t = findTask(pid, aid);
    if (!t) return false;
    if (t.confirmed) return false;
    if (!t.photo) { toast("Ohne Foto wird des nix.", "err"); return false; }
    t.confirmed = true;
    t.confirmedAt = Date.now();
    t.confirmedBy = byHost ? "wirt" : "selbst";
    if (SS.store) SS.store.addChronicle({
      type: "aufgabe", groupCode: state.code || null, group: !!state.code,
      who: nameOf(pid), task: t.text, points: t.points, game: state.groupName,
    });
    logLine(nameOf(pid) + " hat eine Aufgabe abgehakt (+" + t.points + ").", "ok");
    return true;
  }

  function rejectTask(pid, aid, reason) {
    const t = findTask(pid, aid);
    if (!t) return false;
    const rec = t.photo ? SS.store.album().find((p) => p.id === t.photo) : null;
    if (rec) SS.store.dropPhoto(rec.id);
    t.photo = null; t.done = false; t.at = null;
    logLine("Nachweis von " + nameOf(pid) + " wurde abgelehnt" + (reason ? ": " + reason : "."));
    return true;
  }

  /* ── Sidequests ───────────────────────────────────────────────────────── */
  function takeSidequest(pid, sid) {
    const sq = state.sidequests.find((s) => s.id === sid);
    if (!sq) return false;
    if ((sq.takenBy || []).indexOf(pid) !== -1) return false;
    sq.takenBy = (sq.takenBy || []).concat([pid]);
    logLine(nameOf(pid) + " nimmt sich eine Sidequest.", "ok");
    return true;
  }

  function finishSidequest(pid, sid, data) {
    const sq = state.sidequests.find((s) => s.id === sid);
    if (!sq) return false;
    sq.done = sq.done || {};
    if (sq.done[pid]) { toast("Is scho erledigt.", "err"); return false; }
    if (!data) { toast("Ohne Bild geht's ned.", "err"); return false; }
    const rec = SS.store.addPhoto({
      aid: "sq:" + sid, pid: pid, data: data, who: nameOf(pid),
      groupCode: state.code || null, text: sq.text, sidequest: true,
    });
    sq.done[pid] = { photo: rec.id, at: Date.now(), points: sq.points || 2, voided: false };
    if (SS.store) SS.store.addChronicle({
      type: "sidequest", groupCode: state.code || null, group: !!state.code,
      who: nameOf(pid), task: sq.text, points: sq.points || 2, game: state.groupName,
    });
    logLine(nameOf(pid) + " hat eine Sidequest geschafft (+" + (sq.points || 2) + ").", "ok");
    return true;
  }

  function proposeSidequest(pid, text) {
    const t = String(text || "").trim().slice(0, 140);
    if (t.length < 6) { toast("Des is a bissla kurz.", "err"); return false; }
    state.proposals.push({ id: uid(8), text: t, by: pid, at: Date.now(), status: "offen" });
    logLine(nameOf(pid) + " hat eine Sidequest vorgeschlagen.", "ok");
    return true;
  }

  /** Vorschlag freigeben: wird zur Sidequest und bekommt eine zufällige Person. */
  function approveProposal(id) {
    const i = state.proposals.findIndex((p) => p.id === id);
    if (i === -1) return false;
    const p = state.proposals[i];
    const rng = seededRng((state.seed || "seidla") + ":sq:" + p.id);
    const pool = alive().map((x) => x.id);
    const drawn = pool.length ? pool[Math.floor(rng() * pool.length)] : null;
    state.sidequests.push({
      id: uid(8), text: p.text, points: 2, by: p.by, drawn: drawn,
      takenBy: [], done: {}, at: Date.now(),
    });
    state.proposals[i].status = "freigegeben";
    logLine("Sidequest freigegeben: " + p.text + (drawn ? " — gezogen: " + nameOf(drawn) : ""), "ok");
    return true;
  }
  function rejectProposal(id) {
    const i = state.proposals.findIndex((p) => p.id === id);
    if (i === -1) return false;
    state.proposals[i].status = "abgelehnt";
    return true;
  }

  /** Aufgaben für alle austeilen. Nur der Wirt. */
  function dealTasks() {
    const res = SS.assign.deal(state.players, {
      perPlayer: state.settings.perPlayer,
      modeId: state.settings.modeId,
      maxLevel: state.settings.maxLevel,
      types: state.settings.types,
      seed: state.seed,
    });
    state.assignments = res.byPlayer;
    state.ring = res.ring;
    state.phase = "running";
    state.sidequests = state.sidequests || [];
    state.proposals = [];
    state.reviews = {};
    const lonely = SS.assign.lonelyPlayers(state.players, res.byPlayer);
    if (lonely.length) logLine("Achtung: " + lonely.map(nameOf).join(", ") + " bekommt keinen Besuch ab.", "err");
    const mode = SS.tasks.modeById(state.settings.modeId);
    logLine("Aufgaben ausgeteilt: " + alive().length + " Leut, " + state.settings.perPlayer +
      " pro Person, Modus «" + mode.name + "».", "ok");
    if (SS.store) SS.store.addChronicle({
      type: "abend", groupCode: state.code || null, group: true,
      who: null, game: state.groupName,
      task: "Aufgaben ausgeteilt (" + alive().length + " Leut, " + mode.name + ")",
    });
    // Der neue Stand muss raus, sonst sitzen die Gäste ohne Aufgaben da.
    if (isHost()) {
      sync();
      if (state.mode === "online") net.broadcast({ t: "deal" });
    }
  }

  /* ── Gesamtwertung ────────────────────────────────────────────────────── */
  /**
   * Am Ende bewertet die Runde die Nachweise. Jeder bestätigte Nachweis kann
   * von den Mitspielern als "gilt" oder "gilt nicht" bewertet werden. Kippt
   * die Mehrheit auf "gilt nicht", wird die Aufgabe ungültig und die Punkte
   * sind weg.
   *
   * Der Wirt kann das übersteuern: er kann eine Wertung aussetzen oder eine
   * Aufgabe wieder gültig machen. Damit hängt niemand von einer Laune ab.
   */
  function startReview() {
    state.phase = "review";
    state.reviews = state.reviews || {};
    logLine("Die Gesamtwertung läuft. Jeder bewertet die Nachweise der anderen.", "ok");
    if (isHost()) { sync(); if (state.mode === "online") net.broadcast({ t: "review" }); }
    return true;
  }

  function reviewOf(aid) {
    if (!state.reviews[aid]) state.reviews[aid] = { ok: [], bad: [] };
    return state.reviews[aid];
  }

  /** Bewertung abgeben: ok = gilt, bad = gilt nicht. */
  function rate(pid, aid, verdict) {
    const found = findTaskAnywhere(aid);
    if (!found) return false;
    const t = found.task;
    if (!t.confirmed) { toast("Erst wenn der Nachweis freigegeben ist.", "err"); return false; }
    if (found.pid === pid) { toast("Die eigene Aufgabe bewertet man nicht.", "err"); return false; }
    const r = reviewOf(aid);
    r.ok = r.ok.filter((x) => x !== pid);
    r.bad = r.bad.filter((x) => x !== pid);
    if (verdict === "ok") r.ok.push(pid); else r.bad.push(pid);
    // Schwelle: ein Drittel der Runde, mindestens zwei Stimmen.
    const need = Math.max(2, Math.ceil(alive().length / 3));
    t.flagBy = r.bad;
    t.flagged = r.bad.length;
    if (r.bad.length >= need && !state.settings.hostOverride) {
      t.voided = true;
      logLine("Aufgabe von " + nameOf(found.pid) + " wurde für ungültig erklärt.", "err");
    } else if (r.bad.length >= need) {
      logLine("Aufgabe von " + nameOf(found.pid) + " hat genug Gegenstimmen — der Wirt entscheidet.", "err");
    }
    return true;
  }

  /** Wirt: eine beanstandete Aufgabe für ungültig erklären oder retten. */
  function setVoid(pid, aid, voided) {
    const t = findTask(pid, aid);
    if (!t) return false;
    t.voided = !!voided;
    logLine((voided ? "Der Wirt erklärt eine Aufgabe für ungültig: " : "Der Wirt rettet eine Aufgabe: ") + t.text);
    return true;
  }
  /** Wirt: Wertung komplett aussetzen — nichts wird ungültig. */
  function clearFlags(pid, aid) {
    const t = findTask(pid, aid);
    if (!t) return false;
    t.flagBy = []; t.flagged = 0; t.voided = false;
    state.reviews[aid] = { ok: [], bad: [] };
    logLine("Der Wirt setzt die Beanstandungen zurück.");
    return true;
  }

  /** Welche Aufgaben stehen zur Bewertung? Alles Bestätigte. */
  function reviewable(exceptPid) {
    const out = [];
    Object.keys(state.assignments).forEach((pid) => {
      if (pid === exceptPid) return;
      tasksOf(pid).forEach((t) => { if (t.confirmed) out.push({ pid: pid, task: t }); });
    });
    return out;
  }

  /* ── Chat ─────────────────────────────────────────────────────────────── */
  /**
   * Der Spielchat. Alle Nachrichten laufen über den Wirt, damit auch Gäste
   * untereinander schreiben können. Ohne Netz wandert die Nachricht in den
   * Ausgangskorb und kommt später an.
   */
  function sendChat(text) {
    const msg = String(text || "").trim().slice(0, 200);
    if (!msg) return false;
    const pid = state.mode === "online" ? state.me : (state.players[0] && state.players[0].id);
    const from = nameOf(pid) || "Gast";
    const id = uid(10);
    if (SS.store) SS.store.addChat({ id: id, pid: pid, from: from, text: msg, at: Date.now(), own: true });
    if (state.mode === "online" && state.role === "guest") {
      if (!net.sendToHost({ t: "chat", id: id, text: msg, from: from })) {
        state.pending = true;
        if (SS.store) SS.store.queue({ kind: "chat", text: msg, from: from, id: id, at: Date.now() });
        toast("Kein Netz — die Nachricht geht später raus.", "err");
      }
    } else if (state.mode === "online" && state.role === "host") {
      net.broadcast({ t: "chat", id: id, text: msg, from: from });
    }
    emit("chat");
    return true;
  }
  /** Eingehende Chatzeile (vom Wirt oder von einem Gast) ablegen. */
  function receiveChat(line) {
    if (!SS.store) return;
    SS.store.addChat(line);
    emit("chat");
  }

  /* ── Netzwerkaktionen ─────────────────────────────────────────────────── */
  function act(name, payload) {
    const pid = state.mode === "online" ? state.me : (state.players[0] && state.players[0].id) || null;
    actAs(pid, name, payload);
  }
  function actAs(pid, name, payload) {
    if (!pid) { toast("Kein Teilnehmer angemeldet.", "err"); return; }
    if (state.mode === "online" && state.role === "guest") {
      if (pid !== state.me) { toast("Nur eigene Sachen sind möglich.", "err"); return; }
      if (!net.sendToHost({ t: "act", pid: pid, name: name, payload: payload })) {
        state.pending = true;
        if (SS.store) SS.store.queue({ kind: "aktion", action: name, payload: payload, pid: pid, at: Date.now() });
        // Ohne Netz trotzdem am eigenen Gerät ausführen, damit sofort sichtbar
        // ist, dass es geklappt hat. Beim nächsten Kontakt schickt der Wirt
        // seinen verbindlichen Stand nach und überschreibt das wieder.
        applyAction(pid, name, payload);
        toast("Kein Netz — am Gerät gespeichert, wird nachgereicht.", "err");
      }
    } else {
      applyAction(pid, name, payload);
    }
  }

  /** Die zentralen Abend-Aktionen. */
  function applyAction(pid, name, payload) {
    payload = payload || {};
    let changed = false;
    switch (name) {
      case "photo":
        changed = attachPhoto(payload.pid || pid, payload.aid, payload.data);
        break;
      case "confirm":
        changed = confirmTask(payload.pid, payload.aid, true);
        break;
      case "reject":
        changed = rejectTask(payload.pid, payload.aid, payload.reason);
        break;
      case "sidequest-take":
        changed = takeSidequest(pid, payload.sid);
        break;
      case "sidequest-done":
        changed = finishSidequest(pid, payload.sid, payload.data);
        break;
      case "propose":
        changed = proposeSidequest(pid, payload.text);
        break;
      case "approve":
        changed = approveProposal(payload.id);
        break;
      case "reject-proposal":
        changed = rejectProposal(payload.id);
        break;
      case "rate":
        changed = rate(pid, payload.aid, payload.verdict);
        break;
      case "void":
        changed = setVoid(payload.pid, payload.aid, true);
        break;
      case "rescue":
        changed = setVoid(payload.pid, payload.aid, false);
        break;
      case "clear-flags":
        changed = clearFlags(payload.pid, payload.aid);
        break;
      default:
        console.warn("Unbekannte Aktion", name);
    }
    if (changed) {
      if (isHost()) sync();
      persist();
      renderCurrent();
    }
  }

  function persist() {
    if (!SS.store) return;
    SS.store.saveSession(state);
    if (state.phase !== "running" && state.phase !== "review" && state.phase !== "over") return;
    if (state.mode === "online" && state.role === "guest" && state.connection !== "online") {
      state.pending = true;
    }
  }

  function sync() { net.broadcastState(); renderCurrent(); }

  /* ── Auswertung ───────────────────────────────────────────────────────── */
  function allProofs() { return SS.store ? SS.store.photosOf(state.code || null) : []; }

  function ranking() {
    return alive()
      .map((p) => ({
        pid: p.id, name: p.name, color: p.color,
        points: pointsOf(p.id),
        sidequests: sidequestsDone(p.id),
        voided: tasksOf(p.id).filter((t) => t.confirmed && isVoid(t)).length,
        ...doneCount(p.id),
      }))
      .sort((a, b) => b.points - a.points || b.done - a.done);
  }

  function network() {
    const edges = [];
    Object.keys(state.assignments).forEach((pid) => {
      state.assignments[pid].forEach((t) => {
        if (t.target) edges.push({ from: pid, to: t.target, task: t, confirmed: t.confirmed });
      });
    });
    return edges;
  }

  function buildReport() {
    const L = [];
    const mode = SS.tasks.modeById(state.settings.modeId);
    L.push("SEIDLA — Abendbericht");
    L.push("Runde: " + state.groupName + (state.code ? " (" + state.code + ")" : ""));
    L.push("Modus: " + mode.name);
    L.push("Stand: " + new Date().toLocaleString("de-DE"));
    L.push("Dabei: " + alive().length + " Leut · " + state.settings.perPlayer + " Aufgaben pro Person");
    L.push("");
    const r = ranking();
    if (r.length) {
      L.push("RANGLISTE");
      r.forEach((x, i) => {
        let line = (i + 1) + ". " + x.name + " — " + x.points + " Punkte, " + x.done + " von " + x.total + " Aufgaben";
        if (x.sidequests) line += ", " + x.sidequests + " Sidequests";
        if (x.voided) line += " (" + x.voided + " ungültig)";
        L.push(line);
      });
      L.push("");
    }
    const sq = state.sidequests.filter((s) => Object.keys(s.done || {}).length);
    if (sq.length) {
      L.push("SIDEQUESTS");
      sq.forEach((s) => {
        L.push("- " + s.text);
        Object.keys(s.done).forEach((pid) => L.push("    ✓ " + nameOf(pid) + (s.done[pid].voided ? " (ungültig)" : "")));
      });
      L.push("");
    }
    L.push("WER HAT WEN BESUCHT");
    network().filter((e) => e.confirmed).forEach((e) => {
      L.push("- " + nameOf(e.from) + " → " + nameOf(e.to) + ": " + e.task.text);
    });
    L.push("");
    L.push("Nachweise: " + allProofs().length + " Bilder im Album");
    return L.join("\n");
  }

    $, $$, el, frag, esc, shuffle, seededRng, uid, clamp, pick,

    dealTasks, act, actAs, applyAction, applyActionRaw: applyAction,

    startReview, reviewOf, rate, setVoid, clearFlags, reviewable,
    // Chat
    sendChat, receiveChat,
    sync, net, persist, setRenderCurrent, renderCurrent,
    allProofs, ranking, network, buildReport,
  };
})();

/* ── js/assign.js ── */
/* ==========================================================================
   Seidla — Aufgaben austeilen
   Jeder bekommt für den Abend eine Handvoll Aufgaben. Aufgaben, die an einer
   anderen Person hängen ("{ziel}"), bekommen ihren Mitspieler von hier
   zugeteilt — nicht von der Person gewählt. So landet jeder auch mal bei
   jemandem, den er sonst den ganzen Abend nicht ansprechen würde.

   Damit niemand am Rand steht, wird zusätzlich ein Ring gelegt: Jeder
   bekommt mindestens eine Aufgabe, die auf den Nächsten im Ring zeigt, und
   ab vier Leuten auch eine auf den Vorherigen.

   Alles läuft über einen festen Zufallskeim, damit Wirt und Gäste dieselben
   Aufgaben sehen, ohne dass jede Aufgabe einzeln verschickt werden muss.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;
  const T = () => SS.tasks;

  const POINTS_BY_LEVEL = { 1: 1, 2: 2, 3: 3 };
  const pointsFor = (level) => POINTS_BY_LEVEL[level] || 1;

  const hasZiel = (text) => /\{ziel\}/.test(text);

  /** Aufgabe in lesbaren Text verwandeln: {ziel} und {zahl} einsetzen. */
  function render(text, targetName, rng) {
    let out = String(text);
    out = out.replace(/\{ziel\}/g, targetName || "jemand aus der Runde");
    out = out.replace(/\{zahl\}/g, () => String(2 + Math.floor((rng ? rng() : Math.random()) * 4)));
    return out;
  }

  /**
   * Aufgaben für einen Abend austeilen.
   *
   * players  : [{id,name,...}]
   * settings : { perPlayer, modeId, maxLevel, types:[...], seed }
   * Rückgabe : { ring:[pid], byPlayer:{ pid:[aufgabe] } }
   */
  function deal(players, settings) {
    settings = settings || {};
    const list = players.filter((p) => p.connected !== false);
    const ids = list.map((p) => p.id);
    const nameOf = (id) => { const p = list.find((x) => x.id === id); return p ? p.name : "jemand"; };
    const rng = SS.seededRng(settings.seed || "seidla");
    const byPlayer = {};
    ids.forEach((id) => (byPlayer[id] = []));
    if (!ids.length) return { ring: [], byPlayer: byPlayer };

    const wanted = SS.clamp(Number(settings.perPlayer) || 7, 5, 10);
    // Der Modus setzt die Härtegrenze. Ein Modus kann nur verschärfen, nie
    // über sich hinaus: bei "entspannt" bleibt es harmlos, auch wenn jemand
    // per Hand etwas anderes in die Einstellungen schreibt.
    const mode = T().modeById(settings.modeId || "entspannt");
    const maxLevel = Math.min(mode.level, Number(settings.maxLevel) || mode.level);
    const types = (settings.types && settings.types.length) ? settings.types : T().TYPES.map((t) => t.id);

    // Vorrat: nur gewählte Kategorien, nur bis zur Härtegrenze.
    let pool = T().TASKS.filter((t) => types.indexOf(t.type) !== -1 && t.level <= maxLevel);
    // Ganz kleine Runden: Aufgaben mit Mitspieler fallen weg, sonst wird's sinnlos.
    if (ids.length < 2) pool = pool.filter((t) => !hasZiel(t.text));
    if (!pool.length) pool = T().TASKS.filter((t) => t.level <= maxLevel && !hasZiel(t.text));
    if (!pool.length) pool = T().TASKS.filter((t) => !hasZiel(t.text));

    const withZiel = pool.filter((t) => hasZiel(t.text));
    const withoutZiel = pool.filter((t) => !hasZiel(t.text));

    // Ring legen — der rote Faden des Abends.
    const ring = SS.shuffle(ids, rng);
    // Nachfolger und Vorgänger aus dem Ring ableiten. Wichtig: die Position im
    // Ring hat nichts mit der Position in ids zu tun, sonst zeigt eine Aufgabe
    // auf den Verfasser selbst.
    const succOf = {};
    const predOf = {};
    ring.forEach((pid, k) => {
      succOf[pid] = ring[(k + 1) % ring.length];
      predOf[pid] = ring[(k - 1 + ring.length) % ring.length];
    });

    const usedGlobal = {};
    const takeOnce = (arr) => {
      const fresh = arr.filter((t) => !usedGlobal[t.id]);
      if (fresh.length) { const t = fresh[Math.floor(rng() * fresh.length)]; usedGlobal[t.id] = true; return t; }
      // Vorrat erschöpft: Wiederholung bei anderen Personen ist verkraftbar.
      if (!arr.length) return null;
      return arr[Math.floor(rng() * arr.length)];
    };

    /** Eine andere Person als pid — hier wird der Mitspieler gezogen. */
    const otherThan = (pid) => {
      if (ids.length < 2) return null;
      const others = ids.filter((x) => x !== pid);
      return others[Math.floor(rng() * others.length)];
    };

    const make = (task, targetId) => ({
      aid: SS.uid(8),
      taskId: task.id,
      type: task.type,
      level: task.level,
      target: targetId || null,
      points: pointsFor(task.level),
      text: render(task.text, targetId ? nameOf(targetId) : null, rng),
      done: false,
      at: null,
      photo: null,          // Foto liegt im Album, hier nur die Kennung
      confirmed: false,
      flagged: 0,           // Stimmen gegen diese Aufgabe (siehe Wertung)
      flagBy: [],
    });

    ids.forEach((pid) => {
      // Der Ring zuerst: je eine Aufgabe auf Nachfolger und Vorgänger.
      if (ids.length >= 2 && withZiel.length) {
        const succ = succOf[pid];
        const t = takeOnce(withZiel);
        if (t) byPlayer[pid].push(make(t, succ));
        if (ids.length >= 4 && wanted >= 5 && withZiel.length > 1) {
          const pred = predOf[pid];
          if (pred !== succ) {
            const t2 = takeOnce(withZiel);
            if (t2) byPlayer[pid].push(make(t2, pred));
          }
        }
      }
      // Rest auffüllen. Aufgaben mit Mitspieler sind der Kern des Abends,
      // deshalb bekommen sie hier den Vorzug.
      let guard = 0;
      while (byPlayer[pid].length < wanted && guard++ < wanted * 8) {
        const needsTargetSoon = byPlayer[pid].length < 2 && ids.length >= 2;
        if (ids.length >= 2 && withZiel.length && (needsTargetSoon || rng() < 0.6)) {
          const task = takeOnce(withZiel);
          if (task) { byPlayer[pid].push(make(task, otherThan(pid))); continue; }
        }
        const task = takeOnce(withoutZiel.length ? withoutZiel : pool);
        if (task) {
          byPlayer[pid].push(make(task, hasZiel(task.text) ? otherThan(pid) : null));
        } else break;
      }
    });

    return { ring: ring, byPlayer: byPlayer };
  }

  /** Wie viele Aufgaben hängen an einer Person? (für die Netz-Anzeige) */
  function targetsOf(byPlayer) {
    const incoming = {};
    Object.keys(byPlayer).forEach((pid) => {
      byPlayer[pid].forEach((a) => { if (a.target) incoming[a.target] = (incoming[a.target] || 0) + 1; });
    });
    return incoming;
  }

  /** Wurde jemand von keinem einzigen Auftrag besucht? Dann stimmt was nicht. */
  function lonelyPlayers(players, byPlayer) {
    const incoming = targetsOf(byPlayer);
    return players.filter((p) => p.connected !== false && !incoming[p.id]).map((p) => p.id);
  }

  SS.assign = { deal, render, pointsFor, targetsOf, lonelyPlayers, hasZiel };
})();

;
/* ── js/proof.js ── */
/* ==========================================================================
   Seidla — Fotonachweis
   Aufgaben gelten erst als erledigt, wenn ein Bild da ist. Die Aufnahme läuft
   über <input type="file" accept="image/*" capture="environment"> — das öffnet
   auf iPhone, iPad und Android die Kamera und am Laptop den Dateidialog.

   Vor dem Speichern wird das Bild auf Daumennagelgröße verkleinert. Handys
   liefern sonst mehrere Megabyte pro Foto, und der Gerätespeicher ist schnell
   voll. Für den Nachweis reicht ein kleines Bild vollkommen.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;

  const MAX_EDGE = 720;   // längste Kante im gespeicherten Bild
  const QUALITY = 0.6;    // JPEG-Qualität

  /** Datei einlesen und auf Daumennagelgröße bringen. */
  function shrink(file) {
    return new Promise((resolve, reject) => {
      if (!file) { reject(new Error("Kein Bild ausgewählt.")); return; }
      if (!/^image\//.test(file.type || "")) { reject(new Error("Des is a koa Bild.")); return; }
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("Bild konnte nicht gelesen werden."));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Bild konnte nicht geöffnet werden."));
        img.onload = () => {
          try {
            const scale = Math.min(1, MAX_EDGE / Math.max(img.width || MAX_EDGE, img.height || MAX_EDGE));
            const w = Math.max(1, Math.round((img.width || MAX_EDGE) * scale));
            const h = Math.max(1, Math.round((img.height || MAX_EDGE) * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const g = canvas.getContext("2d");
            g.drawImage(img, 0, 0, w, h);
            resolve({ data: canvas.toDataURL("image/jpeg", QUALITY), w, h, bytes: Math.round(canvas.toDataURL("image/jpeg", QUALITY).length * 0.75) });
          } catch (e) { reject(new Error("Bild konnte nicht verkleinert werden.")); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /** Wählt der Nutzer ein Bild aus? Liefert {data,w,h} oder null. */
  function pick() {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.setAttribute("capture", "environment");
      input.style.position = "fixed";
      input.style.opacity = "0";
      input.style.pointerEvents = "none";
      document.body.appendChild(input);
      let done = false;
      const finish = (val) => { if (done) return; done = true; input.remove(); resolve(val); };
      input.addEventListener("change", () => {
        const f = input.files && input.files[0];
        if (!f) { finish(null); return; }
        shrink(f).then(finish).catch((e) => { SS.toast(e.message, "err"); finish(null); });
      });
      // Wird der Dialog abgebrochen, feuert kein change. Nach einer Weile
      // aufräumen, damit nichts liegen bleibt.
      input.addEventListener("cancel", () => finish(null));
      input.click();
      setTimeout(() => finish(null), 180000);
    });
  }

  const img = (data, cls) => SS.el("img", { class: cls || "proof-img", src: data, alt: "Nachweis" });

  /** Wie viel Platz brauchen alle Nachweise zusammen? */
  function estimate(dataUrl) {
    if (!dataUrl) return 0;
    return Math.round(dataUrl.length * 0.75);
  }

  SS.proof = { pick, shrink, img, estimate, MAX_EDGE };
})();

;
/* ── js/store.js ── */
/* ==========================================================================
   Seidla — Gedächtnis
   Gruppe, laufender Abend, Album, Chat und Chronik bleiben am Gerät. Fällt
   das Netz aus, wird weitergespielt; alles wandert in den Ausgangskorb und
   geht später raus.

   Zwei Dinge sind hier wichtig:

   1. Nachprüfbarkeit. Jeder gespeicherte Stand bekommt eine Signatur aus
      einem Geräteschlüssel. Wer im localStorage herumpfuscht, ohne den
      Schlüssel zu kennen, macht den Stand ungültig — er wird verworfen
      statt still geladen. Das ist kein Schutz gegen einen Angreifer mit
      Zugriff auf das Gerät (der könnte den Schlüssel lesen), aber es
      verhindert bequemes Beschummeln über die Konsole.

   2. Doppelte Ablage. Derselbe Stand liegt zusätzlich in einem Cookie.
      Geht der localStorage verloren (Safari räumt den nach Tagen ohne
      Besuch auf), wird aus dem Cookie wiederhergestellt — und umgekehrt.
      So überlebt ein Abend auch eine längere Pause.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;

  const NS = "seidla:";
  const V = 4;                    // Format-Version; alte Stände werden verworfen
  const COOKIE_KEYS = ["session", "group", "profile"];   // zusätzlich als Cookie
  const COOKIE_DAYS = 400;        // so lange bleibt der Abend auffindbar

  /* ── Geräteschlüssel und Signatur ──────────────────────────────────────── */
  /**
   * Ein zufälliger Schlüssel pro Gerät. Damit wird jeder Stand signiert.
   * Ohne diesen Schlüssel lässt sich ein gefälschter Stand nicht gültig
   * unterschreiben.
   */
  function deviceKey() {
    let k = rawRead("devkey");
    // Der Schlüssel liegt auch im Cookie — sonst wäre nach dem Aufräumen des
    // localStorage jeder gespeicherte Stand plötzlich ungültig.
    if (!k || typeof k !== "string" || k.length < 24) k = getCookie("devkey");
    if (!k || typeof k !== "string" || k.length < 24) {
      k = randomKey();
      setCookie("devkey", k, COOKIE_DAYS);
    }
    rawWrite("devkey", k);
    return k;
  }
  function randomKey() {
    try {
      const a = new Uint8Array(24);
      (window.crypto || window.msCrypto).getRandomValues(a);
      return Array.from(a).map((x) => x.toString(16).padStart(2, "0")).join("");
    } catch (e) {
      let s = "";
      for (let i = 0; i < 48; i++) s += Math.floor(Math.random() * 16).toString(16);
      return s;
    }
  }

  /**
   * Signatur über einen Wert. FNV-1a mit dem Geräteschlüssel als Salz.
   * Reicht, um versehentliches oder bequemes Verfälschen zu erkennen.
   */
  function sign(value) {
    const text = JSON.stringify(value === undefined ? null : value);
    const key = deviceKey();
    let h = 0x811c9dc5;
    const mix = key + "|" + text + "|" + key;
    for (let i = 0; i < mix.length; i++) {
      h ^= mix.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    // Länge mit einrechnen, damit angehängte Zeichen auffallen.
    let h2 = 0x811c9dc5 ^ text.length;
    for (let i = mix.length - 1; i >= 0; i--) {
      h2 ^= mix.charCodeAt(i);
      h2 = Math.imul(h2, 0x01000193) >>> 0;
    }
    return h.toString(36) + "-" + h2.toString(36) + "-" + text.length.toString(36);
  }

  /* ── Rohe Ablage ──────────────────────────────────────────────────────── */
  function rawRead(key) {
    try {
      const v = localStorage.getItem(NS + key);
      return v === null ? null : JSON.parse(v);
    } catch (e) { return null; }
  }
  function rawWrite(key, value) {
    try { localStorage.setItem(NS + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function rawDrop(key) {
    try { localStorage.removeItem(NS + key); } catch (e) {}
    dropCookie(key);
  }

  /* ── Cookies (zweite Ablage, überlebt das Aufräumen des localStorage) ─── */
  function setCookie(name, value, days) {
    try {
      const d = new Date(Date.now() + (days || COOKIE_DAYS) * 864e5);
      const enc = encodeURIComponent(typeof value === "string" ? value : JSON.stringify(value));
      document.cookie = "seidla_" + name + "=" + enc + "; expires=" + d.toUTCString() +
        "; path=/; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : "");
      return true;
    } catch (e) { return false; }
  }
  function getCookie(name) {
    try {
      const m = document.cookie.match(new RegExp("(?:^|; )seidla_" + name + "=([^;]*)"));
      if (!m) return null;
      const v = decodeURIComponent(m[1]);
      try { return JSON.parse(v); } catch (e) { return v; }
    } catch (e) { return null; }
  }
  function dropCookie(name) {
    try { document.cookie = "seidla_" + name + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/"; } catch (e) {}
  }

  /* ── Signiertes Lesen und Schreiben ───────────────────────────────────── */
  /** Legt einen Wert mit Signatur ab — im localStorage und als Cookie. */
  function put(key, value) {
    const payload = { __v: V, d: value, sig: sign(value) };
    const ok = rawWrite(key, payload);
    if (COOKIE_KEYS.indexOf(key) !== -1) putCookie(key, payload);
    return ok;
  }

  /**
   * Cookie-Ablage mit Rückfall. Ein Cookie fasst nur rund 4 KB, ein Abend
   * mit vielen Leuten deutlich mehr. Deshalb wird der Stand fürs Cookie
   * eingekürzt (siehe compactSession) und, falls selbst das zu groß ist,
   * auf das Nötigste zusammengestrichen: Runde, Leute, Einstellungen, Keim.
   * Damit findet die Runde wieder zusammen und die Aufgaben lassen sich
   * identisch neu austeilen.
   *
   * Wichtig: Es wird zurückgelesen und geprüft. Ein Cookie, das still
   * verworfen wurde, darf nicht als gesichert gelten.
   */
  function putCookie(key, payload) {
    const variants = [payload];
    if (key === "session" && payload.d) {
      const small = compactSession(payload.d);
      variants.push({ __v: V, d: small, sig: sign(small) });
      const lean = leanSession(payload.d);
      variants.push({ __v: V, d: lean, sig: sign(lean) });
    }
    for (const cand of variants) {
      setCookie(key, cand, COOKIE_DAYS);
      const back = getCookie(key);
      if (back && back.sig === cand.sig) return true;
    }
    return false;
  }

  /**
   * Kurzform des Abends fürs Cookie: Aufgabentexte fallen weg und werden
   * beim Laden aus Aufgabenkennung und Ziel neu erzeugt. Das spart den
   * größten Batzen.
   */
  function compactSession(s) {
    const tasks = {};
    Object.keys(s.assignments || {}).forEach((pid) => {
      tasks[pid] = (s.assignments[pid] || []).map((t) => {
        const o = { a: t.aid, t: t.taskId };
        if (t.target) o.g = t.target;
        if (t.points) o.n = t.points;
        if (t.level) o.l = t.level;
        if (t.type) o.y = t.type;
        if (t.confirmed) o.c = 1;
        if (t.photo) o.p = 1;
        if (t.voided) o.v = 1;
        if (t.flagBy && t.flagBy.length) o.f = t.flagBy;

/* ==========================================================================
   Seidla — QR-Code
   Damit niemand einen vierstelligen Code abtippen muss: der Wirt zeigt einen
   QR-Code, den die anderen mit der Kamera abscannen. Darin steckt die Adresse
   der Seite samt Code — wer scannt, landet direkt im Beitritt.

   Der Code wird als SVG gezeichnet, damit er auf jedem Bildschirm scharf
   bleibt. Die Rechenarbeit macht die Bibliothek qrcode-generator (MIT).
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;

  /** Ist die QR-Bibliothek geladen? */
  const available = () => typeof window.qrcode === "function";

  /**
   * Adresse für den Beitritt. Der Code steckt als Parameter drin, damit
   * ein Scan direkt in die richtige Runde führt.
   */
  function joinUrl(code) {
    const base = location.origin + location.pathname;
    return base + "#join=" + String(code || "").toUpperCase();
  }

  /** Text in einen QR-Code verwandeln: { svg, size, modules }. */
  function make(text, opts) {
    opts = opts || {};
    if (!available()) return null;
    try {
      // Fehlerkorrektur M: guter Kompromiss aus Größe und Robustheit.
      const qr = window.qrcode(0, opts.ec || "M");
      qr.addData(String(text));
      qr.make();
      const count = qr.getModuleCount();
      const quiet = opts.quiet === undefined ? 2 : opts.quiet;   // Ruhezone
      const total = count + quiet * 2;
      const dark = opts.dark || "#140d08";
      const light = opts.light || "#f4e9d4";
      const parts = [
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + " " + total + '" ' +
        'width="' + (opts.size || 260) + '" height="' + (opts.size || 260) + '" shape-rendering="crispEdges">',
        '<rect width="' + total + '" height="' + total + '" fill="' + light + '"/>',
        '<path fill="' + dark + '" d="',
      ];
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) parts.push("M" + (c + quiet) + " " + (r + quiet) + "h1v1h-1z");
        }
      }
      parts.push('"/></svg>');
      return { svg: parts.join(""), size: opts.size || 260, modules: count };
    } catch (e) {
      console.warn("QR-Code konnte nicht gebaut werden", e);
      return null;
    }
  }

  function element(text, opts) {
    const made = make(text, opts);
    if (!made) {
      return SS.el("div", { class: "qr-fallback muted small", text: "QR-Code gerade nicht möglich — bitte den Code eintippen." });
    }
    const box = SS.el("div", { class: "qr-box" });
    box.innerHTML = made.svg;
    return box;
  }

  SS.qr = { available, make, element, joinUrl };
})();

/* ==========================================================================

        broadcast({ t: "state", s: wireSnapshot() });
        if (SS.state.phase === "running") broadcast({ t: "deal" });
        if (SS.state.phase === "review") broadcast({ t: "review" });
        setStatus("online");
        SS.emit("net");
        break;
      }
      case "ping": sendConn(conn, { t: "pong" }); break;
      case "act": {
        const pid = conn.pid || msg.pid;
        if (!pid) return;
        SS.applyActionRaw(pid, msg.name, msg.payload);
        SS.emit("net");
        break;
      }
      case "chat": {
        const who = SS.player(conn.pid);
        const from = (who ? who.name : "Gast");
        const text = String(msg.text || "").slice(0, 200);
        if (!text) return;
        const id = msg.id || SS.uid(10);
        // Am Host ablegen und an alle weiterreichen (auch an den Absender,
        // damit alle dieselbe Reihenfolge sehen).
        SS.receiveChat({ id: id, pid: conn.pid, from: from, text: text, at: Date.now() });
        broadcast({ t: "chat", id: id, from: from, text: text });
        SS.emit("net");
        break;
      }
      case "leave": {
        if (conn.pid) {
          const who = SS.player(conn.pid);
          SS.removePlayer(conn.pid);
          SS.logLine((who ? who.name : "Ein Gast") + " hat verlassen.");
          broadcast({ t: "state", s: wireSnapshot() });
          SS.emit("net");
        }
        break;
      }
      case "req": sendConn(conn, { t: "state", s: wireSnapshot() }); break;
      case "outbox": {
        // Nachgereichtes aus der offline verbrachten Zeit.
        const evts = Array.isArray(msg.events) ? msg.events : [];
        if (!evts.length) return;
        let merges = 0, chats = 0;
        evts.forEach((e) => {
          if (!e || typeof e !== "object") return;
          if (e.kind === "aktion" && e.action) { SS.applyActionRaw(conn.pid, e.action, e.payload); merges++; }
          else if (e.kind === "chat" && e.text) {
            const from = (SS.player(conn.pid) || {}).name || e.from || "Gast";
            const id = e.id || SS.uid(10);
            SS.receiveChat({ id: id, pid: conn.pid, from: from, text: String(e.text).slice(0, 200), at: e.at || Date.now() });
            broadcast({ t: "chat", id: id, from: from, text: String(e.text).slice(0, 200) });
            chats++;
          }
        });
        if (merges || chats) {
          SS.logLine((SS.player(conn.pid) || {}).name + ": " + (merges + chats) + " Sache(n) aus der Offline-Zeit nachgereicht.", "ok");
          broadcast({ t: "state", s: wireSnapshot() });
          SS.emit("net");
        }
        break;
      }
      default: break;
    }
  }

  function applyState(s) {
    if (!s) return;
    ["players", "hostId", "phase", "groupName", "seed", "ring", "assignments",
      "sidequests", "proposals", "settings", "reviews"].forEach((k) => {
      if (s[k] !== undefined) SS.state[k] = s[k];
    });
    if (Array.isArray(s.log) && s.log.length) SS.state.log = s.log;
  }

  /* ── Ausgangskorb: offline Gespieltes nachreichen ─────────────────────── */
  function flushOutbox() {
    if (!SS.store) return false;
    if (SS.state.role !== "guest") return false;
    if (SS.state.connection !== "online") return false;
    const list = SS.store.outbox();
    if (!list.length) return false;
    if (!sendToHost({ t: "outbox", events: list })) return false;
    SS.store.clearOutbox();
    SS.state.pending = false;
    SS.toast(list.length + " offline Gemachtes is nachgreicht worn.", "ok");
    return true;
  }
  SS.on("net", () => { if (SS.state.role === "guest") setTimeout(flushOutbox, 400); });

  /* ── Gruppe erstellen (Host) ──────────────────────────────────────────── */
  /**
   * Der Code entsteht sofort und ohne Netz. Danach wird versucht, sich mit
   * dem Broker zu verbinden. Klappt das nicht, bleibt der Abend trotzdem
   * voll spielbar — nur eben am selben Gerät. Sobald wieder Netz da ist,
   * verbindet sich die Runde von selbst.
   */
  function createGroup(hostName) {
    const code = newCode();
    SS.state.mode = "online";
    SS.state.role = "host";
    SS.state.code = code;
    SS.state.hostId = SS.state.me = "host";
    SS.state.seed = code + ":" + SS.uid(6);
    SS.state.players = [];
    const own = SS.addPlayer(hostName || "Wirt", { id: "host", isHost: true, connected: true });
    SS.state.me = own.id;
    if (SS.store) {
      SS.store.saveGroup({
        code: code, name: SS.state.groupName || "Wirtshausrunde",
        role: "host", lastHost: true, members: [],
      });
      SS.store.touchMembers(SS.state.players);
    }
    SS.logLine("Runde " + code + " aufgemacht.", "ok");

    // Verbindung im Hintergrund aufbauen. Der Abend läuft schon.
    const connected = tryOpen(code);
    SS.emit("net");
    return Promise.resolve({ code: code, connected: connected });
  }

  /** Broker verbinden. Mehrfach versuchen, ohne den Abend zu stören. */
  function tryOpen(code) {
    if (!ensureLib()) { setStatus("offline"); return false; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    setStatus("connecting");
    try {
      peer = new window.Peer(peerIdFor(code), {
        debug: 1,
        config: { iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ] },
      });
    } catch (e) { setStatus("offline"); return false; }

    peer.on("open", () => {
      setStatus("online");
      SS.logLine("Runde " + code + " ist erreichbar. Beitritt mit dem Code möglich.", "ok");
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      SS.emit("net");
    });

    peer.on("connection", (conn) => {
      conns.push(conn);
      attachConn(conn, {});
      SS.emit("net");
    });

    peer.on("error", (err) => {
      const type = err && err.type;
      if (type === "unavailable-id") {
        // Code schon belegt: einen frischen nehmen. Der Abend bleibt stehen.
        const fresh = newCode();
        SS.state.code = fresh;
        SS.logLine("Code war belegt — neuer Code: " + fresh, "");
        if (SS.store) SS.store.saveGroup({ code: fresh, role: "host", lastHost: true });
        try { peer.destroy(); } catch (e) {}
        peer = null;
        setTimeout(() => tryOpen(fresh), 300);
        SS.emit("net");
        return;
      }
      if (type === "network" || type === "server-error" || type === "socket-error" || type === "ssl-unavailable") {
        setStatus("offline", "Am Gerät");
        scheduleRetry(code);
      }
    });

    peer.on("disconnected", () => {
      setStatus("lost", "Ohne Netz");
      try { peer.reconnect(); } catch (e) {}
      scheduleRetry(code);
    });
    return true;
  }

  /** Ohne Netz: regelmäßig erneut versuchen, ohne den Abend zu stören. */
  function scheduleRetry(code) {
    if (retryTimer) return;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      if (SS.state.role !== "host") return;
      if (SS.state.connection === "online") return;
      if (!navigator.onLine) { scheduleRetry(code); return; }
      tryOpen(SS.state.code || code);
    }, 15000);
  }

  /* ── Gruppe betreten (Gast) ───────────────────────────────────────────── */
  function joinGroup(code, guestName) {
    return new Promise((resolve, reject) => {
      if (!ensureLib()) return reject(new Error("Netzwerk-Bibliothek konnte nicht geladen werden."));
      code = String(code || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length !== CODE_LEN) return reject(new Error("Bitte einen " + CODE_LEN + "-stelligen Rundencode eingeben."));
      setStatus("connecting");
      SS.state.code = code;

      // Feste Kennung pro Gerät: erlaubt den Wiedereintritt nach einem Abbruch.
      let myPid = SS.store ? SS.store.read("devicePid", null) : null;
      if (!myPid) {
        myPid = SS.uid(10);
        if (SS.store) SS.store.write("devicePid", myPid);
      }
      if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
      peer = new window.Peer({
        debug: 1,
        config: { iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ] },
      });

      let settled = false;
      const giveUpAfter = setTimeout(() => {
        if (settled) return;
        settled = true;
        setStatus("offline");
        try { peer.destroy(); } catch (e) {}
        reject(new Error("Keine Runde mit dem Code «" + code + "» gefunden. Stimmt der Code, ist der Wirt schon in der Lobby, und haben beide Geräte Internet?"));
      }, 22000);

      peer.on("open", () => {
        const conn = peer.connect(peerIdFor(code), { reliable: true, serialization: "json" });
        hostConn = conn;
        attachConn(conn, { isHost: true });

        conn.on("open", () => {
          settled = true;
          clearTimeout(giveUpAfter);
          SS.state.mode = "online";
          SS.state.role = "guest";
          SS.state.me = myPid;
          if (SS.store) {
            SS.store.saveGroup({
              code: code, name: SS.state.groupName || "Wirtshausrunde",
              role: "guest", lastHost: false,
            });
          }
          sendConn(conn, { t: "hello", name: guestName || "Gast", pid: myPid });
          resolve({ code: code });
        });
        conn.on("error", (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Verbindung fehlgeschlagen: " + (err && err.message ? err.message : "unbekannt")));
        });
      });

      peer.on("error", (err) => {
        const type = err && err.type;
        if (type === "peer-unavailable") {
          if (settled) return;
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Keine Runde mit dem Code «" + code + "» gefunden. Ist der Code richtig und der Wirt schon in der Lobby?"));
          return;
        }
        if (!settled && (type === "network" || type === "server-error" || type === "socket-error" || type === "ssl-unavailable")) {
          settled = true;
          clearTimeout(giveUpAfter);
          setStatus("offline");
          reject(new Error("Gerade kein Verbindungsdienst erreichbar. Du kannst am selben Gerät mitspielen."));
        }
      });
    });
  }

  /* ── Runde wieder aufmachen (nach Neustart oder ohne Netz) ────────────── */
  /**
   * Der Wirt öffnet seine Runde erneut mit demselben Code. Damit finden alle
   * Gäste zurück, auch wenn der Abend Tage pausiert hat. Ohne Netz passiert
   * nichts Schlimmes — dann wird es eben später erneut versucht.
   */
  function reopen() {
    if (SS.state.role !== "host" || !SS.state.code) return false;
    if (SS.state.connection === "online" && peer && !peer.destroyed) return true;
    return tryOpen(SS.state.code);
  }

  /* ── Wieder in die Runde finden ───────────────────────────────────────── */
  function rejoin(code, name) {
    if (SS.state.connection === "connecting") return Promise.reject(new Error("läuft schon"));
    setStatus("connecting", "Neu verbinden …");
    return joinGroup(code, name).then(() => {
      SS.toast("Wieder in der Runde.", "ok");
      return true;
    }).catch(() => {
      setStatus("lost");
      return false;
    });
  }

  /* ── Verlassen ────────────────────────────────────────────────────────── */
  function leave() {
    try {
      if (SS.state.role === "host") {
        broadcast({ t: "hostleft" });
        conns.forEach((c) => { try { c.close(); } catch (e) {} });
      } else if (hostConn) {
        sendConn(hostConn, { t: "leave" });
      }
    } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    peer = null; conns = []; hostConn = null;
    setStatus("offline");
  }

  function available() { return ensureLib(); }

  function init() {
    if (!ensureLib()) {
      setStatus("offline", "Am Gerät");
      return Promise.resolve(false);
    }
    return probeBroker().catch(() => false);
  }

  function probeBroker() {
    return new Promise((resolve) => {
      let done = false;
      let p;
      const finish = (ok) => { if (!done) { done = true; try { p.destroy(); } catch (e) {} resolve(ok); } };
      try {
        p = new window.Peer({ debug: 0, config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });
      } catch (e) { return resolve(false); }
      p.on("open", () => finish(true));
      p.on("error", () => finish(false));
      setTimeout(() => finish(false), 6000);
    });
  }

  Object.assign(SS.net, {
    init, available, setStatus, flushOutbox, rejoin,
    createGroup, joinGroup, leave, guestCount, reopen,
    sendToHost, broadcastState, broadcast, sendTo,
  });
})();

          el("h2", { text: "Wer ist da?" }),
