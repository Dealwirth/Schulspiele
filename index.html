    ]);
  }

  /* ══ Wirt-Bereich ═══════════════════════════════════════════════════════ */
  /**
   * Zugang für die Person, die den Abend leitet: Runde verwalten, Leut
   * entfernen, Punkte zurücksetzen und am Ende den Abendbericht zusammenstellen.
   *
   * Ehrlicher Hinweis: Das ist ein Wirtshaus-Schlüssel, kein Banktresor. Die
   * Seite läuft ohne Server im Browser, also kann jeder, der sich auskennt,
   * den Schlüssel im Quelltext finden. Er hält die Runde davon ab, versehentlich
   * im Management herumzupfuschen — mehr soll er nicht.
   */
  const WIRT_KEY = "135LowLap";

  const isWirt = () => !!(SS.store && SS.store.loadProfile().wirt);
  const isWirtHost = () => isWirt() && SS.isHost();

  function openWirtDialog() {
    if (isWirt()) return wirtPanel();
    const input = el("input", { type: "password", placeholder: "Wirtsschlüssel", dataset: { persist: "wirtKey" }, autocomplete: "off" });
    SS.modal("Wirt-Bereich", frag([
      el("p", { class: "lead", text: "Der Wirt leitet den Abend: Runde verwalten, Leut entfernen, Punkte zurücksetzen und am Schluss den Bericht zusammenstellen." }),
      el("label", { class: "field" }, [el("span", { text: "Wirtsschlüssel" }), input]),
      el("div", { class: "banner", text: "Der Schlüssel steht im Quelltext — er hält nur davon ab, versehentlich im Management zu landen." }),
    ]), [
      { label: "Abbrechen" },
      { label: "Aufsperren", kind: "primary", onClick: () => {
          if ((input.value || "").trim() !== WIRT_KEY) { SS.toast("Des is ned der Schlüssel.", "err"); return false; }
          SS.store.saveProfile({ wirt: true });
          SS.toast("Wirt-Bereich offen.", "ok");
          setTimeout(wirtPanel, 60);
          return true;
        } },
    ]);
    setTimeout(() => input.focus(), 60);
  }

  function wirtPanel() {
    const grp = SS.store.loadGroup() || {};
    const nameInput = el("input", { type: "text", value: grp.name || "Wirtshausrunde", maxlength: "30", dataset: { persist: "grpName" } });
    const body = frag([
      el("p", { class: "lead", text: "Runde: " + (SS.state.code || grp.code || "am selben Gerät") + " · " + SS.connectedCount() + " Leut dabei" }),
      el("label", { class: "field" }, [el("span", { text: "Name der Runde" }), nameInput]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-sm btn-gold", text: "Namen speichern", onclick: () => {
          const n = (nameInput.value || "").trim() || "Wirtshausrunde";
          const g = SS.store.loadGroup();
          if (g) SS.store.saveGroup(Object.assign({}, g, { name: n }));
          SS.toast("Runde heißt jetzt «" + n + "».", "ok");
        } }),
        el("button", { class: "btn btn-sm btn-outline", text: "Punkte zurücksetzen", onclick: resetScores }),
        el("button", { class: "btn btn-sm btn-outline", text: "Teilnehmer verwalten", onclick: managePlayers }),
      ]),
      el("hr", { class: "rule" }),
      el("h3", { text: "Abendbericht" }),
      el("p", { class: "muted", text: "Fasst die ganze Nacht zusammen: wer dabei war, wer gewonnen hat, wer wie oft einen Schluck kassiert hat. Zum Kopieren und in die Gruppe schicken." }),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-gold", text: "Bericht kopieren", onclick: () => copy(buildReport(), "Bericht kopiert") }),
        el("button", { class: "btn btn-outline", text: "Vorschau", onclick: () => SS.modal("Abendbericht", frag([
          el("textarea", { readonly: true, style: { minHeight: "300px" }, value: buildReport() }),
        ]), [{ label: "Zumachen", kind: "primary" }]) }),
      ]),
      el("hr", { class: "rule" }),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-sm btn-outline", text: "Wirt-Bereich sperren", onclick: () => { SS.store.saveProfile({ wirt: false }); SS.toast("Wirt-Bereich gesperrt."); } }),
        el("button", { class: "btn btn-sm btn-outline", text: "Alles zurücksetzen", onclick: confirmWipeAll }),
      ]),
      el("p", { class: "muted", style: { marginTop: "10px", fontSize: "13px" }, text: "Belegt: " + SS.store.usage().kb + " kB im Gerät · Chronik: " + SS.store.chronicle().length + " Einträge" }),
    ]);
    SS.modal("Wirt-Bereich", body, [{ label: "Fertig", kind: "primary" }]);
  }

  function resetScores() {
    SS.modal("Punkte zurücksetzen?", frag([el("p", { text: "Alle Punkte gehen auf null. Die Chronik bleibt stehen." })]), [
      { label: "Abbrechen" },
      { label: "Zurücksetzen", kind: "primary", onClick: () => {
          Object.keys(SS.state.scores).forEach((k) => (SS.state.scores[k] = 0));
          if (SS.isHost()) SS.sync();
          render(); return true;
        } },
    ]);
  }

  function managePlayers() {
    const list = el("div");
    if (!SS.state.players.length) list.appendChild(el("p", { class: "muted", text: "Keine Teilnehmer eingetragen." }));
    SS.state.players.forEach((p) => {
      list.appendChild(el("div", { class: "btn-row", style: { marginBottom: "8px", justifyContent: "space-between" } }, [
        el("span", {}, [el("span", { class: "avatar", style: { background: p.color }, text: SS.initial(p.name) }), " " + p.name + (p.connected === false ? " (weg)" : "")]),
        el("button", { class: "btn btn-sm btn-outline", text: "Entfernen", onclick: () => {
          if (SS.state.mode === "online" && SS.isHost()) SS.net.sendTo(p.id, { t: "kick", reason: "Der Wirt hat dich aus der Runde genommen." });
          SS.removePlayer(p.id);
          if (SS.isHost()) SS.sync();
          SS.modal("Teilnehmer verwalten", frag([manageList()]), [{ label: "Fertig", kind: "primary" }]);
          return true;
        } }),
      ]));
    });
    SS.modal("Teilnehmer verwalten", list, [{ label: "Fertig", kind: "primary" }]);
  }
  function manageList() {
    const d = el("div");
    SS.state.players.forEach((p) => d.appendChild(el("p", { text: p.name + (p.connected === false ? " (weg)" : "") })));
    return d;
  }

  /** Der Abendbericht — alles aus der Chronik, menschenlesbar zusammengefasst. */
  function buildReport() {
    const grp = SS.store.loadGroup() || {};
    const entries = SS.store.chronicle();
    const t = SS.store.tally();
    const L = [];
    L.push("SEIDLA — Abendbericht");
    L.push("Runde: " + (grp.name || "Wirtshausrunde") + (grp.code ? " (" + grp.code + ")" : ""));
    L.push("Stand: " + new Date().toLocaleString("de-DE"));
    L.push("Einträge: " + entries.length);
    L.push("");
    if (t.length) {
      L.push("WER WAR AM FLEISSIGSTEN");
      t.slice(0, 15).forEach((x, i) => {
        L.push((i + 1) + ". " + x.name + " — " + x.points + " Punkte, " + x.wins + (x.wins === 1 ? " Sieg" : " Siege") + ", " + x.drinks + (x.drinks === 1 ? " Schluck" : " Schlucke"));
      });
      L.push("");
    }
    const games = {};
    entries.forEach((e) => { if (e.game) games[e.game] = (games[e.game] || 0) + 1; });
    if (Object.keys(games).length) {
      L.push("GESPIELT");
      Object.keys(games).sort((a, b) => games[b] - games[a]).forEach((g) => L.push("- " + g + ": " + games[g] + " Runden"));
      L.push("");
    }
    const offline = entries.filter((e) => e.offline).length;
    if (offline) { L.push(offline + " Einträge wurden nachgereicht (ohne Netz gespielt)."); L.push(""); }
    L.push("VERLAUF");
    entries.slice(0, 60).forEach((e) => {
      const d = new Date(e.at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      L.push(d + "  " + (e.who || "Runde") + " — " + (e.type === "sieg" ? "gewonnen" : e.type === "schluck" ? "Schluck" : "Runde") + (e.game ? " (" + e.game + ")" : ""));
    });
    return L.join("\n");
  }

  function confirmWipeAll() {
    SS.modal("Wirklich alles löschen?", frag([el("p", { text: "Chronik, Ausgangskorb und die gespeicherte Runde werden gelöscht. Des kommt nimmer zurück." })]), [
      { label: "Behalten" },
      { label: "Alles löschen", kind: "primary", onClick: () => { SS.store.wipe(); SS.state.pending = false; SS.state.lastSession = null; render(); return true; } },
    ]);
  }

  /* ══ Abläufe ════════════════════════════════════════════════════════════ */
  function getName() {
    const n = (SS.LS.get("name", "") || (SS.store ? SS.store.loadProfile().name : "") || "").trim();
    return n || "Gast " + Math.floor(Math.random() * 90 + 10);
  }

  function openCreateDialog() {
    const nameInput = el("input", { type: "text", value: getName(), maxlength: "22", placeholder: "Dein Name", dataset: { persist: "dlgName" } });
    const body = frag([
      el("p", { class: "lead", text: "Dein Gerät wird der Wirt. Danach steht ein vierstelliger Code auf dem Schirm, den die anderen eintippen." }),
      el("label", { class: "field" }, [el("span", { text: "Dein Name" }), nameInput]),
      el("div", { class: "banner", text: "Alle Geräte brauchen zum Beitreten kurz Internet. Danach läuft der Datenverkehr direkt zwischen den Geräten." }),
    ]);
    SS.modal("Runde aufmachen", body, [
      { label: "Abbrechen" },
      { label: "Aufmachen", kind: "primary", onClick: () => {
          const nm = (nameInput.value || "").trim() || getName();
          SS.LS.set("name", nm);
          if (SS.store) SS.store.saveProfile({ name: nm });
          createGroup(nm);
          return true;
        } },
    ]);
  }

  function createGroup(nm) {
    SS.toast("Runde wird aufgemacht …");
    SS.net.createGroup(nm)
      .then(() => { SS.LS.set("lastCode", SS.state.code); go("lobby"); SS.toast("Runde offen. Code: " + SS.state.code, "ok"); })
      .catch((err) => {
        SS.toast(err.message, "err");
        SS.modal("Runde geht ned auf", frag([
          el("p", { text: err.message }),
          el("div", { class: "banner", text: "Tipp: Wenn im Netz keine WebRTC-Verbindungen erlaubt sind, spielt's am selben Gerät weiter. Alles geht auch ohne Runde." }),
        ]), [
          { label: "Am selben Gerät", kind: "primary", onClick: () => { startLocalFlow(nm); return true; } },
          { label: "Nochmal probieren", onClick: () => { createGroup(nm); return true; } },
          { label: "Zumachen" },
        ]);
      });
  }

  function openJoinDialog(prefill) {
    const codeInput = el("input", { class: "code-input", type: "text", inputmode: "latin", autocapitalize: "characters", autocomplete: "off", maxlength: "4", value: prefill || "", placeholder: "----" });
    const nameInput = el("input", { type: "text", value: getName(), maxlength: "22", placeholder: "Dein Name", dataset: { persist: "dlgJoinName" } });
    const body = frag([
      el("p", { class: "lead", text: "Gib den Code ein, den der Wirt zeigt." }),
      el("label", { class: "field" }, [el("span", { text: "Rundencode" }), codeInput]),
      el("label", { class: "field" }, [el("span", { text: "Dein Name" }), nameInput]),
      el("div", { class: "banner", text: "Groß- und Kleinschreibung is wurscht — der Code wird von allein groß." }),
    ]);
    const box = SS.modal("Mit Code nei", body, [
      { label: "Abbrechen" },
      { label: "Nei", kind: "primary", onClick: () => {
          const code = codeInput.value.trim().toUpperCase();
          const nm = (nameInput.value || "").trim() || getName();
          SS.LS.set("name", nm);
          if (SS.store) SS.store.saveProfile({ name: nm });
          joinGroup(code, nm);
          return true;
        } },
    ]);
    setTimeout(() => { if (!prefill) codeInput.focus(); }, 60);
    return box;
  }

  function joinGroup(code, nm) {
    SS.toast("Verbindung wird aufgebaut …");
    SS.net.joinGroup(code, nm)
      .then(() => { SS.LS.set("lastCode", code); go("lobby"); SS.toast("Dabei: Runde " + SS.state.code, "ok"); })
      .catch((err) => {
        SS.toast(err.message, "err");
        SS.modal("Beitritt geht ned", frag([
          el("p", { text: err.message }),
          el("ul", {}, [
            el("li", { text: "Is der Code richtig abtippt?" }),
            el("li", { text: "Is die Runde am Wirt-Gerät noch offen?" }),
            el("li", { text: "Haben beide Geräte Internet?" }),
          ]),
        ]), [
          { label: "Nochmal", kind: "primary", onClick: () => { openJoinDialog(code); return true; } },
          { label: "Zumachen" },
        ]);
      });
  }

  function startLocalFlow(name) {
    if (name) SS.LS.set("name", name);
    SS.state.mode = "local";
    SS.state.role = "solo";
    SS.state.code = null;
    SS.state.players = [];
    SS.state.scores = {};
    SS.state.priv = {};
    SS.state.pending = false;
    SS.addPlayer(SS.LS.get("name", "") || "Spieler 1", { id: "p1", isHost: true });
    SS.addPlayer("Spieler 2", { id: "p2" });
    SS.state.me = null;
    SS.net.setStatus("offline");
    go("lobby");
  }

  function addLocalPlayerDialog() {
    const input = el("input", { type: "text", maxlength: "22", placeholder: "Name", dataset: { persist: "addP" } });
    SS.modal("Wer noch?", frag([
      el("label", { class: "field" }, [el("span", { text: "Name" }), input]),
      el("p", { class: "muted", text: "Am selben Gerät kannst zusätzliche Leut anlegen, die sich den Schirm teilen." }),
    ]), [
      { label: "Abbrechen" },
      { label: "Dazu", kind: "primary", onClick: () => {
          const n = (input.value || "").trim(); if (!n) return false;
          SS.addPlayer(n, {});
          if (SS.isHost()) SS.sync();
          render(); return true;
        } },
    ]);
    setTimeout(() => input.focus(), 60);
  }

  function openGame(id) {
    const meta = SS.getMeta(id);
    if (!meta) return;
    if (SS.state.mode === "local" && !SS.state.players.length) {
      SS.addPlayer(SS.LS.get("name", "") || "Spieler 1", { id: "p1", isHost: true });
      const min = Math.max(meta.minP || 2, 2);
      for (let i = 2; i <= min; i++) SS.addPlayer("Spieler " + i, { id: "p" + i });
      SS.state.me = null;
    }
    selectGame(id);

    const body = frag([
      el("p", { class: "lead", text: meta.glyph + "  " + meta.tagline }),
      el("div", { class: "tags", style: { marginBottom: "12px" } }, (meta.tags || []).map((t) => el("span", { class: "tag", text: TAGS[t] || t }))),
      el("div", { class: "banner", text: "Regeln: " + meta.rules }),
      meta.howto && meta.howto.length ? el("div", {}, [el("h3", { text: "So läuft's" }), el("ol", {}, meta.howto.map((h) => el("li", { text: h })))]) : null,
    ]);

    SS.modal(meta.name, body, [
      { label: "Zumachen" },
      { label: "Am selben Gerät", onClick: () => { startLocalFlow(); selectGame(id); return true; } },
      { label: "In der Runde", kind: "primary", onClick: () => {
          if (SS.state.mode === "online" && SS.state.role === "host") { selectGame(id); go("lobby"); return true; }
          if (SS.state.mode === "online" && SS.state.role === "guest") { SS.toast("Der Wirt wählt das Spiel.", "err"); return true; }
          window.__pendingGame = id;
          openCreateDialog();
          return true;
        } },
    ]);
  }

  function startGame() {
    const meta = SS.getMeta(SS.state.gameId);
    if (!meta) return;
    const ctx = SS.makeCtx();
    SS.state.scores = {};
    SS.state.players.forEach((p) => (SS.state.scores[p.id] = 0));
    SS.state.priv = {};
    SS.state.phase = "playing";
    SS.state.round = 1;
    SS.state.lastResult = null;
    SS.state.pub = {};
    SS.state.syncSeed = SS.state.syncSeed || (SS.state.code || "lokal") + ":" + SS.uid(6);
    SS.state.players.forEach((p) => (SS.state.priv[p.id] = {}));
    SS.logLine("Los geht's: " + meta.name, "ok");
    const impl = SS.IMPL[SS.state.gameId];
    if (impl && impl.init) { try { impl.init(ctx); } catch (e) { console.error(e); SS.toast("Startfehler: " + e.message, "err"); } }
    if (SS.isHost()) SS.sync();
    if (SS.state.mode === "online" && SS.isHost()) SS.net.broadcast({ t: "start" });
    go("game");
    if (SS.state.mode === "online" && SS.state.role === "guest") SS.net.sendToHost({ t: "req" });
    SS.persist();
  }

  function restartGame() {
    SS.modal("Neue Runde?", frag([el("p", { text: "Der Punktestand wird auf null gesetzt und alles neu gemischt." })]), [
      { label: "Abbrechen" },

    ]);

  function leaveGame() {
    SS.modal("Runde verlassen?", frag([el("p", { text: "Ihr kommt zurück in die Lobby. Die Runde bleibt bestehen." })]), [
      { label: "Weiterspielen" },
      { label: "Verlassen", kind: "primary", onClick: () => {
          SS.state.phase = "lobby"; SS.state.turn = null; SS.state.pub = {}; SS.state.priv = {};
          if (SS.isHost()) SS.sync();
          go("lobby"); return true;
        } },
    ]);

  function toHome() {
    SS.state.mode = "local";
    SS.state.role = "solo";
    SS.state.code = null;
    SS.state.connection = "offline";
    SS.state.phase = "lobby";
    go("home");

  function rulesDialog(meta) {
    SS.modal(meta.name + " — Regeln", frag([
      el("div", { class: "banner", text: meta.rules }),

    ]), [{ label: "Passt", kind: "primary" }]);
  }

  /* ══ Hilfe ══════════════════════════════════════════════════════════════ */
  function helpDialog() {
    SS.modal("Kurze Anleitung", frag([
      el("h3", { text: "Runde aufmachen" }),
      el("ol", {}, [
        el("li", { text: "Ein Gerät wählt «Runde aufmachen» und wird der Wirt." }),
        el("li", { text: "Es zeigt einen vierstelligen Code, zum Beispiel K7QP." }),
        el("li", { text: "Alle anderen tippen den Code ein — bis zu 100 Leut." }),
      ]),
      el("h3", { text: "Wenn's Netz weg is" }),
      el("p", { text: "Für den Beitritt braucht's kurz Internet: Die Geräte finden sich über einen Vermittlungsdienst und reden danach direkt miteinander (WebRTC). Reißt die Verbindung ab, spielt's trotzdem weiter — jede Runde wandert in den Ausgangskorb und wird nachgereicht, sobald wieder Netz da is." }),
      el("p", { text: "Reines Bluetooth zwischen iPhone und Android geht im Browser ned. Des kann die Seite ned leisten, ohne dass ihr a App installiert." }),
      el("h3", { text: "Am selben Gerät" }),
      el("p", { text: "Wähle «Am selben Gerät». Zwei bis hundert Leut spielen nacheinander an einem Schirm. Bei Spielen, wo alle gleichzeitig antworten, tippt jeder vorher seinen Namen an." }),
      el("h3", { text: "Strafen" }),
      el("p", { text: "Auf der Startseite stellst ein, was bei einer Strafe passiert: ein Schluck, eine Aufgabe oder ein Glas Wasser. Dann spielt's jeder so, wie er mag." }),
      el("h3", { text: "Kurzbefehle" }),
      el("p", {}, [el("span", { class: "kbd", text: "Esc" }), " schließt Dialoge."]),
    ]), [{ label: "Passt", kind: "primary" }]);
  }

  /* ══ Kleinkram ══════════════════════════════════════════════════════════ */
  function copy(text, okMsg) {
    if (!text) return;
    const done = () => SS.toast(okMsg || "Kopiert", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = el("textarea", { style: { position: "fixed", opacity: "0" } });
    ta.value = text;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { SS.toast("Kopieren geht ned. Bitte abschreiben.", "err"); }
    ta.remove();
  }

  /* ══ Start ══════════════════════════════════════════════════════════════ */
  function initUI() {
    SS.$("#brandBtn").addEventListener("click", () => { if (SS.state.phase === "playing") leaveGame(); else go("home"); });
    SS.$("#helpBtn").addEventListener("click", helpDialog);
    const cb = SS.$("#chronikBtn");
    if (cb) cb.addEventListener("click", () => go("chronik"));
    const wb = SS.$("#wirtBtn");
    if (wb) wb.addEventListener("click", openWirtDialog);

    SS.on("net", () => {
      if (SS.state.route === "lobby" || SS.state.route === "game") render();
      else { renderMechanik(); updateStatusbar(); }
      if (window.__pendingGame && SS.state.role === "host") { selectGame(window.__pendingGame); window.__pendingGame = null; render(); }
    });
    SS.on("outbox", updateStatusbar);
    SS.on("chronicle", () => { if (SS.state.route === "chronik") render(); });

    setInterval(() => { updateStatusbar(); }, 2500);
    render();
  }

  SS.setRenderCurrent(renderCurrentGame);
  SS.ui = {
    render, renderCurrent: renderCurrentGame, go, initUI, showScoreboard,
    copy, helpDialog, selectGame, startGame, openJoinDialog, openCreateDialog,
    viewChronicle, penalty, penaltyWord,
  };
})();

;

/* ==========================================================================
   Schulspiele — gemeinsame Bausteine für Spielmodule
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;
  const { el } = SS;

  /* ── Zug-Logik ────────────────────────────────────────────────────────── */
  function seatOrder(ctx) {
    return ctx.players.filter((p) => p.connected !== false).map((p) => p.id);
  }
  function nextSeat(ctx) {
    const order = seatOrder(ctx);
    if (!order.length) return null;
    const i = order.indexOf(ctx.state.turn);
    return order[(i + 1) % order.length];
  }
  function advance(ctx) { ctx.state.turn = nextSeat(ctx); }
  function nameOf(ctx, pid) {
    const p = ctx.player(pid);
    return p ? p.name : "—";
  }
  function dot(pid, ctx) {
    const p = ctx.player(pid);
    return el("span", { class: "dot", style: { background: p ? p.color : "#999" } });
  }

  /* ── Anzeigeblöcke ────────────────────────────────────────────────────── */
  function turnBanner(ctx, textOverride) {
    const t = ctx.state.turn;
    const who = nameOf(ctx, t);
    const isMe = ctx.canAct(t);
    const text = textOverride || (isMe ? "Du bist am Zug" : "Am Zug: " + who);
    return el("div", { class: "turn-banner" }, [
      dot(t, ctx),
      el("span", { text: text }),
      ctx.canAct(t) ? null : el("span", { class: "muted", text: "· bitte warten" }),
    ]);
  }

  function waitingBanner(ctx) {
    const t = ctx.state.turn;
    return el("div", { class: "banner", text: "Am Zug: " + nameOf(ctx, t) + ". Der Zug passiert auf dem Gerät dieser Person." });
  }

  function canTouch(ctx, pid) {
    return ctx.canAct(pid === undefined ? ctx.state.turn : pid);
  }

  function scoreTable(ctx, opts) {
    opts = opts || {};
    const order = ctx.players.slice().sort((a, b) => (ctx.scores[b.id] || 0) - (ctx.scores[a.id] || 0));
    return el("table", { class: "scoreboard" }, [
      el("thead", {}, el("tr", {}, [
        el("th", { text: "#" }),
        el("th", { text: opts.label || "Haus" }),
        el("th", { text: opts.valueLabel || "Punkte" }),
      ])),
      el("tbody", {}, order.map((p, i) =>
        el("tr", { class: i === 0 && (ctx.scores[p.id] || 0) > 0 ? "lead-row" : "" }, [
          el("td", {}, el("span", { class: "rank", text: (i + 1) + "." })),
          el("td", {}, [
            el("span", { class: "avatar", style: { background: p.color }, text: SS.initial(p.name) }),
            p.name,
            p.id === ctx.state.turn && ctx.state.phase === "playing" ? el("span", { class: "muted", text: "  ◂ am Zug" }) : null,
          ]),
          el("td", { class: "num", text: String(ctx.scores[p.id] || 0) }),
        ])
      )),
    ]);
  }

  /* ── Runden-Abschluss ─────────────────────────────────────────────────── */
  function roundSummary(ctx, title, lines, onNext, nextLabel) {
    return el("div", { class: "center" }, [
      el("h2", { text: title }),
      el("div", { style: { maxWidth: "460px", margin: "0 auto 16px" } }, lines),
      onNext ? el("button", { class: "btn btn-gold", text: nextLabel || "Weiter", onclick: onNext }) : null,
    ]);
  }

  function finalScreen(ctx, title, sub) {
    const order = ctx.players.slice().sort((a, b) => (ctx.scores[b.id] || 0) - (ctx.scores[a.id] || 0));
    const best = order[0];
    const tied = order.filter((p) => (ctx.scores[p.id] || 0) === (ctx.scores[best.id] || 0));
    const headline = tied.length > 1 ? "Unentschieden: " + tied.map((p) => p.name).join(", ") : best.name + " gewinnt";
    return el("div", { class: "center" }, [
      el("div", { class: "eyebrow", text: title || "Endstand" }),
      el("h1", { text: headline }),
      sub ? el("p", { class: "lead", style: { margin: "0 auto 18px" }, text: sub }) : null,
      el("div", { style: { maxWidth: "520px", margin: "0 auto 20px" } }, scoreTable(ctx)),
      ctx.isHost ? el("div", { class: "btn-row", style: { justifyContent: "center" } }, [
        el("button", { class: "btn btn-gold", text: "Nochmal", onclick: () => SS.ui.startGame() }),
        el("button", { class: "btn btn-outline", text: "Zur Lobby", onclick: () => { ctx.state.phase = "lobby"; ctx.sync(); SS.ui.go("lobby"); } }),
      ]) : el("p", { class: "muted", text: "Der Host kann eine neue Partie starten." }),
    ]);
  }

  /* ── Zeitgeber ────────────────────────────────────────────────────────── */
  function now() { return Date.now(); }
  function remaining(deadline) { return Math.max(0, Math.ceil((deadline - now()) / 1000)); }

  function timerBar(seconds) {
    return el("div", { class: "center", style: { marginBottom: "14px" } }, [
      el("div", { class: "eyebrow", text: "Zeit" }),
      el("div", { class: "serif", style: { fontSize: "30px", color: "var(--red)" }, id: "clock", text: String(seconds) }),
    ]);
  }

  /* ── Einfacher Haupt-Ticker für Spielmodule ───────────────────────────── */
  const tickers = {};
  function setTicker(key, fn, ms) {
    clearTicker(key);
    tickers[key] = setInterval(fn, ms || 500);
    return tickers[key];
  }
  function clearTicker(key) {
    if (tickers[key]) { clearInterval(tickers[key]); delete tickers[key]; }
  }
  function clearAllTickers() { Object.keys(tickers).forEach(clearTicker); }

  /* ── Sonstiges ────────────────────────────────────────────────────────── */
  function shuffleInPlace(arr, rnd) { return SS.shuffle(arr, rnd); }

  function pickUnique(ctx, pool, count) { return SS.shuffle(pool).slice(0, count); }

  /** Fragen/Positionen für alle Geräte gleich mischen (Seed aus Runde + Spiel). */
  function sharedShuffle(ctx, arr, salt) {
    return SS.shuffle(arr, ctx.rng(ctx.state.gameId + ":" + ctx.state.round + ":" + (salt || "")));
  }

  SS.util = {
    seatOrder, nextSeat, advance, nameOf, dot,
    turnBanner, waitingBanner, canTouch, scoreTable,
    roundSummary, finalScreen, now, remaining, timerBar,
    setTicker, clearTicker, clearAllTickers, shuffleInPlace,
    pickUnique, sharedShuffle,
  };
})();

/* ==========================================================================
   Seidla — Wirtshausrunde
   Ich hab noch nie · Wer würde eher · Wahrheit oder Pflicht · Flaschendrehen

(function () {
  "use strict";
  const SS = window.SS;
  const C = SS.content;
  const U = () => SS.util;

  const wer = (pid, ctx) => { const p = ctx.player(pid); return p ? p.name : "—"; };
  const av = (pid, ctx) => { const p = ctx.player(pid); return SS.el("span", { class: "avatar", style: { background: p ? p.color : "#999" }, text: SS.initial(p ? p.name : "?") }); };
  const living = (ctx) => ctx.players.filter((x) => x.connected !== false);

  /** Rotierende Liste, damit bei vielen Leuten nicht immer dieselben drankommen. */
  function rotation(ctx, seed, count) {
    const pool = SS.shuffle(living(ctx).map((x) => x.id), ctx.rng("rot:" + (ctx.state.syncSeed || ctx.state.code || "lokal") + ":" + seed));
    return pool.slice(0, Math.max(1, count || 1));
  }

  /* Der Host hält den Vorrat an Karten; alle Geräte sehen dieselbe Reihenfolge. */
  function deck(ctx, pool) {
    const key = ctx.state.gameId + ":deck";
    const seed = ctx.state.syncSeed || String(ctx.state.code || "lokal");
    const order = SS.shuffle(pool.map((_, i) => i), ctx.rng(seed + key));
    return order;
  }

  function draw(ctx, pool) {
    if (!ctx.pub.order || ctx.pub.order.length !== pool.length) ctx.pub.order = deck(ctx, pool);
    if (ctx.pub.idx === undefined) ctx.pub.idx = 0;
    const i = ctx.pub.order[ctx.pub.idx % pool.length];
    return pool[i];
  }

  function nextCard(ctx, pool, extra) {
    ctx.pub.idx = (ctx.pub.idx === undefined ? 0 : ctx.pub.idx) + 1;
    ctx.pub.stage = "prompt";
    ctx.pub.answers = {};
    ctx.pub.revealed = false;
    if (extra) Object.assign(ctx.pub, extra);
    ctx.pub.card = draw(ctx, pool);
    ctx.sync();
  }

  /** Nach so vielen Karten ist Schluss und es gibt einen Endstand. */
  function cardLimit(ctx) {
    return Number((ctx.settings && ctx.settings.karten) || 12);
  }

  function finishOrNext(ctx, pool) {
    if ((ctx.pub.idx || 0) + 1 >= cardLimit(ctx)) {
      ctx.finish({ title: "Runde beendet" });
      return;
    }
    nextCard(ctx, pool);
  }

  function runde(done, ctx, opts) {
    // Rundenende protokollieren und Punkte/Schlucke verteilen
    const meta = SS.getMeta(ctx.state.gameId);
    ctx.log("Runde " + ctx.state.round + " · " + meta.name);
    SS.store.addChronicle({
      type: "runde", groupCode: ctx.state.code || null, game: meta.name,
      round: ctx.state.round, who: (opts && opts.who) || null,
    });
    if (ctx.isHost) { ctx.state.round++; }
  }

  /* ══ Ich hab noch nie ═══════════════════════════════════════════════════ */
  SS.registerImpl("ichhabnochnie", {
    init(ctx) {
      ctx.pub.game = "ichhabnochnie";
      ctx.pub.drinks = {};
      nextCard(ctx, C.ICH_NOCH_NIE);
    },
    render(ctx) {
      const p = ctx.pub;
      const all = living(ctx);
      const order = all.length > 14 ? all.slice(0, 14) : all;
      const box = SS.el("div");
      box.appendChild(SS.el("div", { class: "eyebrow center", text: "Runde " + ctx.round }));

      if (p.stage === "prompt") {
        const me = SS.activePid();
        const mine = p.answers[me];
        const row = SS.el("div", { class: "btn-row", style: { justifyContent: "center", gap: "14px" } }, [
          SS.el("button", {
            class: "btn btn-gold btn-lg" + (mine === "scho" ? " chosen" : ""),
            text: "Hab i scho · " + SS.ui.penaltyWord().replace("trinkt ", "").replace("erfüllt ", ""),
            disabled: !ctx.canAct(me),
            onclick: () => SS.actAs(me, "answer", { v: "scho" }),
          }),
          SS.el("button", {
            class: "btn btn-outline btn-lg" + (mine === "nie" ? " chosen" : ""),
            text: "Noch nie",
            disabled: !ctx.canAct(me),
            onclick: () => SS.actAs(me, "answer", { v: "nie" }),
          }),
        ]);

        // In großer Runde wartet man nicht auf alle — wer will, antwortet.
        if (all.length > 14) {
          box.appendChild(SS.el("div", { class: "big-prompt small", text: "Tippt, was auf euch zutrifft." }));
          box.appendChild(row);
          box.appendChild(SS.el("div", { class: "roster", style: { justifyContent: "center" } },
            all.map((x) => SS.el("span", { class: "pill" + (p.answers[x.id] ? " done" : ""), text: x.name }))));
        } else {
          box.appendChild(SS.el("div", { class: "big-prompt small", text: p.card }));
          box.appendChild(row);
          const open = all.filter((x) => !p.answers[x.id]).map((x) => x.name);
          box.appendChild(SS.el("div", { class: "roster", style: { justifyContent: "center" } },
            all.map((x) => SS.el("span", { class: "pill" + (p.answers[x.id] ? " done" : ""), text: x.name }))));
          if (open.length) box.appendChild(SS.el("p", { class: "muted center", text: "Fehlt noch: " + open.join(", ") }));
        }

        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "16px" } }, [
          SS.el("button", { class: "btn btn-red", text: "Auflösen", onclick: () => SS.act("reveal", {}) }),
        ]));
      } else {
        box.appendChild(SS.el("div", { class: "big-prompt small", text: p.card }));
        const drinkers = Object.keys(p.answers).filter((k) => p.answers[k] === "scho");
        box.appendChild(SS.el("h2", { class: "center", text: drinkers.length + " Leut trifft's" }));
        const list = SS.el("div", { class: "roster", style: { justifyContent: "center" } });
        if (drinkers.length) drinkers.forEach((pid) => list.appendChild(SS.el("span", { class: "pill done", text: wer(pid, ctx) })));
        else list.appendChild(SS.el("span", { class: "pill", text: "Keiner — a saubere Runde!" }));
        box.appendChild(list);
        box.appendChild(SS.el("p", { class: "muted center", text: "Strafe: " + SS.ui.penaltyWord() + "." }));
        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "16px" } }, [
          SS.el("button", { class: "btn btn-gold btn-lg", text: (ctx.pub.idx + 1 >= cardLimit(ctx) ? "Endstand zeigen" : "Nächste Karte"), onclick: () => { runde(true, ctx); SS.act("next", {}); } }),
        ]));

    },
    action(ctx, pid, name, payload) {
      const p = ctx.pub;
      if (name === "answer") {
        p.answers[pid] = payload.v;
        if (payload.v === "scho") {
          ctx.addScore(pid, 1);
          SS.store.addChronicle({ type: "schluck", groupCode: ctx.state.code || null, who: wer(pid, ctx), points: 1, game: SS.getMeta(ctx.state.gameId).name });
        }
      } else if (name === "reveal") {
        p.stage = "result";
      } else if (name === "next") {

  /* ══ Wer würde eher ═════════════════════════════════════════════════════ */
  SS.registerImpl("werwuerdeeher", {
    init(ctx) {

      ctx.pub.tally = {};

    render(ctx) {

      box.appendChild(SS.el("div", { class: "big-prompt small", text: p.card }));

        const grid = SS.el("div", { class: "vote-grid", style: { maxWidth: "780px", margin: "0 auto" } });
        ctx.players.filter((x) => x.connected !== false).forEach((x) => {
          grid.appendChild(SS.el("button", {
            class: "vote-btn" + (mine === x.id ? " chosen" : ""),
            disabled: !ctx.canAct(me),
            onclick: () => SS.actAs(me, "vote", { target: x.id }),

        });

        const open = ctx.players.filter((x) => x.connected !== false && !p.answers[x.id]).map((x) => x.name);

        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "16px" } }, [
          SS.el("button", { class: "btn btn-red", text: "Stimmen zeigen", onclick: () => SS.act("reveal", {}) }),

      } else {

        const max = Math.max(1, ...Object.values(counts));

        order.forEach((x) => {
          const n = counts[x.id] || 0;

            SS.el("span", { class: "nm", text: x.name }),
            SS.el("span", { class: "poll-track" }, SS.el("span", { class: "poll-bar", style: { width: Math.round((n / max) * 100) + "%", background: x.color } })),
            SS.el("span", { class: "n", text: String(n) }),

        box.appendChild(wrap);
        const top = order.filter((x) => (counts[x.id] || 0) === max && max > 0);

        ctx.log(q.q + " → " + q.a[q.c] + (best ? " (" + wer(best, ctx) + ")" : " (keiner)"));
      } else if (name === "next") {
        p.idx++;
        p.q = p.questions[p.idx];
        p.answers = {};
        p.stage = "ask";
        ctx.state.round++;
        ctx.sync();
      } else if (name === "finish") {
        ctx.finish({ title: "Quiz beendet" });
      }
    },
  });

  function shufflePool(ctx, pool) {
    const seed = (ctx.state.syncSeed || ctx.state.code || "lokal") + ":" + ctx.state.round;
    return SS.shuffle(pool, ctx.rng(seed));
  }
  function countAnswers(p, i) {
    return Object.keys(p.answers).filter((k) => p.answers[k] === i).length;
  }

  /* ══ Zungenbrecher ══════════════════════════════════════════════════════ */
  SS.registerImpl("zungenbrecher", {
    init(ctx) {
      ctx.pub.game = "zungenbrecher";
      ctx.pub.stage = "ready";
      ctx.pub.done = {};
      ctx.pub.twister = SS.pick(C.ZUNGENBRECHER, ctx.rng((ctx.state.syncSeed || "lokal") + ":zt:" + ctx.round));
    },
    render(ctx) {
      const p = ctx.pub;
      const box = SS.el("div");
      box.appendChild(SS.el("div", { class: "eyebrow center", text: "Zungenbrecher · Runde " + ctx.round }));
      box.appendChild(SS.el("div", { class: "big-prompt small", text: p.twister }));

      if (p.stage === "ready") {
        box.appendChild(SS.el("p", { class: "lead center", text: "Der Host startet die Uhr. Jeder sagt's dreimal schnell vor sich hin — wer fertig is, tippt auf seinen Namen." }));
        const dec = SS.el("div", { class: "btn-row", style: { justifyContent: "center" } }, living(ctx).map((x) => SS.el("button", {
          class: "vote-btn" + (p.done[x.id] ? " chosen" : ""),
          onclick: () => SS.actAs(x.id, "done", {}),
        }, [av(x.id, ctx), SS.el("span", { class: "nm", text: x.name })])));
        box.appendChild(dec);
        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "12px" } }, [
          SS.el("button", { class: "btn btn-red", text: "Uhr starten", onclick: () => SS.act("start", {}) }),
        ]));
      } else if (p.stage === "run") {
        box.appendChild(SS.el("div", { class: "timer-ring " + (p.left <= 5 ? "urgent" : "") }, [SS.el("div", { class: "clock", id: "ztClock", text: String(p.left) })]));
        box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center" } }, living(ctx).map((x) => SS.el("button", {
          class: "vote-btn" + (p.done[x.id] ? " chosen" : ""),
          disabled: p.done[x.id],
          onclick: () => SS.actAs(x.id, "done", {}),
        }, [av(x.id, ctx), SS.el("span", { class: "nm", text: x.name }), p.done[x.id] ? SS.el("span", { class: "yours", text: "gschafft" }) : null]))));
      } else {
        const done = Object.keys(p.done);
        box.appendChild(SS.el("h2", { class: "center", text: done.length + " von " + living(ctx).length + " habn's gschafft" }));
        box.appendChild(SS.el("div", { class: "roster", style: { justifyContent: "center" } }, living(ctx).map((x) =>
          SS.el("span", { class: "pill" + (p.done[x.id] ? " done" : ""), text: x.name + (p.done[x.id] ? " ✓" : " ✗") }))));
        box.appendChild(SS.el("p", { class: "muted center", text: "Wer's ned gschafft hat, " + SS.ui.penaltyWord() + "." }));
        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "12px" } }, [
          SS.el("button", { class: "btn btn-gold btn-lg", text: ((ctx.pub.idx || 0) + 1 >= Number(ctx.settings.runden || 6) ? "Endstand zeigen" : "Nächster Zungenbrecher"), onclick: () => SS.act("next", {}) }),
        ]));
      }
      return box;
    },
    action(ctx, pid, name, payload) {
      const p = ctx.pub;
      if (name === "start") {
        p.stage = "run";
        p.startedAt = Date.now();
        p.seconds = 20;
        p.left = p.seconds;
        if (p._tick) clearInterval(p._tick);
        startZT(ctx);
      } else if (name === "done") {
        if (!p.done[pid]) {
          p.done[pid] = true;
          ctx.addScore(pid, 1);
          chronicle(ctx, "sieg", wer(pid, ctx), 1);
        }
      } else if (name === "resolve") {
        p.stage = "result";
      } else if (name === "next") {
        const limit = Number(ctx.settings.runden || 6);
        if ((p.idx || 0) + 1 >= limit) { ctx.finish({ title: "Zungenbrecher beendet" }); return; }
        p.idx = (p.idx || 0) + 1;
        p.stage = "ready";
        p.done = {};
        p.twister = SS.pick(C.ZUNGENBRECHER, ctx.rng((ctx.state.syncSeed || "lokal") + ":zt:" + (ctx.state.round + 1)));
        ctx.state.round++;
        ctx.sync();
      }
    },
  });

  function startZT(ctx) {
    const p = ctx.pub;
    p._tick = setInterval(() => {
      if (ctx.state.phase !== "playing" || ctx.pub.game !== "zungenbrecher" || ctx.pub.stage !== "run") {
        clearInterval(p._tick); p._tick = null; return;
      }
      p.left = Math.max(0, Math.ceil((p.startedAt + p.seconds * 1000 - Date.now()) / 1000));
      SS.emit("syncBoard");
      if (p.left <= 0) { clearInterval(p._tick); p._tick = null; if (ctx.isHost) SS.applyActionRaw("host", "resolve", {}); }
    }, 400);
  }

  /* ══ Turnierbaum ════════════════════════════════════════════════════════ */
  function buildBracket(ctx) {
    const pool = SS.shuffle(living(ctx).map((x) => x.id), ctx.rng("bracket:" + (ctx.state.syncSeed || ctx.state.code || "lokal")));
    const matches = [];
    for (let i = 0; i < pool.length; i += 2) matches.push({ a: pool[i], b: pool[i + 1] || null, win: null });
    return { rounds: [matches], round: 0 };
  }
  SS.registerImpl("turnierbaum", {
    init(ctx) {
      ctx.pub.game = "turnierbaum";
      ctx.pub.bracket = buildBracket(ctx);
      ctx.pub.duell = SS.pick(C.DUELLE);
      ctx.pub.champion = null;
    },
    render(ctx) {
      const p = ctx.pub;
      const box = SS.el("div");
      box.appendChild(SS.el("div", { class: "eyebrow center", text: "Turnierbaum · " + (p.duell ? p.duell.icon + " " + p.duell.name : "") }));

      if (p.champion) {
        box.appendChild(SS.el("div", { class: "eyebrow center", text: "Sieger" }));
        box.appendChild(SS.el("div", { class: "big-prompt", text: wer(p.champion, ctx) }));
        box.appendChild(SS.el("p", { class: "muted center", text: "Der Sieger darf austeilen — zwei Schlucke an wen er will." }));
        if (ctx.isHost) box.appendChild(SS.el("div", { class: "btn-row", style: { justifyContent: "center" } }, [
          SS.el("button", { class: "btn btn-gold btn-lg", text: "Neues Turnier", onclick: () => SS.act("again", {}) }),
        ]));
        return box;
      }

      const br = el("div", { class: "bracket" });
      br.rows = null;
      p.bracket.rounds.forEach((ms, ri) => {
        const col = SS.el("div", { class: "bracket-round" }, [SS.el("h4", { text: ri === 0 ? "Erste Runde" : (ms.length * 2) + "er-Runde" })]);
        ms.forEach((m, mi) => {
          const node = SS.el("div", { class: "match" });
          [[m.a, "a"], [m.b, "b"]].forEach((pair) => {
            const pid = pair[0], side = pair[1];
            if (!pid) { node.appendChild(SS.el("div", { class: "side open", text: "Freilos" })); return; }
            const isWin = m.win === pid;
            const clickable = p.bracket.round === ri && !m.win && ctx.isHost;
            node.appendChild(SS.el("div", {
              class: "side" + (isWin ? " win" : ""),
              style: clickable ? { cursor: "pointer" } : null,
              onclick: clickable ? () => SS.act("win", { r: ri, m: mi, pid: pid }) : null,
            }, [av(pid, ctx), SS.el("span", { text: wer(pid, ctx) })]));
          });
          col.appendChild(node);
        });
        br.appendChild(col);
      });
      box.appendChild(br);
      if (!ctx.isHost) box.appendChild(SS.el("p", { class: "muted center", text: "Der Host tippt die Sieger an." }));
      else box.appendChild(SS.el("p", { class: "muted center", text: "Tippe den Sieger eines Paares an. Bei Freilos geht's automatisch weiter." }));
      return box;
    },
    action(ctx, pid, name, payload) {
      const p = ctx.pub;
      if (name === "win") {
        const ms = p.bracket.rounds[payload.r];
        const m = ms[payload.m];
        if (!m || m.win) return;
        m.win = payload.pid;
        if (ms.every((x) => x.win || !x.b)) advanceBracket(ctx);
      } else if (name === "again") {
        p.bracket = buildBracket(ctx);
        p.duell = SS.pick(C.DUELLE);
        p.champion = null;
        ctx.state.round++;
        ctx.sync();
      }
    },
  });
  function el(tag, attrs, ch) { return SS.el(tag, attrs, ch); }

  function advanceBracket(ctx) {
    const p = ctx.pub;
    const cur = p.bracket.rounds[p.bracket.round];
    const winners = cur.map((m) => m.win).filter(Boolean);
    if (winners.length <= 1) {
      p.champion = winners[0] || null;
      if (p.champion) { ctx.addScore(p.champion, 2); chronicle(ctx, "sieg", wer(p.champion, ctx), 2); }
      ctx.sync();
      return;
    }
    const next = [];
    for (let i = 0; i < winners.length; i += 2) next.push({ a: winners[i], b: winners[i + 1] || null, win: null });
    p.bracket.rounds.push(next);
    p.bracket.round++;
    ctx.sync();
  }
})();

;
/* ── js/boot.js ── */
/* ==========================================================================
   Seidla — Start
   Liest einen Rundencode aus der Adresse, stellt die letzte Runde wieder her
   und prüft den Verbindungsdienst. Fällt das Netz aus, läuft der Abend
   trotzdem weiter — der Ausgangskorb holt das Versäumte später nach.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;

  function param(name) {
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }

  function start() {
    SS.ui.initUI();

    const code = (param("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const direct = param("join");
    if (code.length === 4 || direct) {
      const c = code.length === 4 ? code : String(direct).toUpperCase().replace(/[^A-Z0-9]/g, "");
      setTimeout(() => SS.ui.openJoinDialog ? SS.ui.openJoinDialog(c) : null, 250);
    }

    // Steht noch eine Runde im Gerät? Dann Namen und Punktestand übernehmen,
    // damit der Abend dort weitermacht, wo er aufgehört hat.
    if (SS.store) {
      const sess = SS.store.loadSession();
      const grp = SS.store.loadGroup();
      if (grp && grp.members && grp.members.length) {
        SS.state.code = SS.state.code || grp.code;
        SS.state.players = grp.members.map((m, i) => ({
          id: m.id, name: m.name, color: m.color || SS.colorFor(i),
          connected: false, isHost: !!m.isHost, index: i,
        }));
      }
      if (sess && sess.phase === "playing") SS.state.lastSession = sess;
      SS.state.pending = SS.store.outboxCount() > 0;
    }

    SS.net.init().then((ok) => {
      if (!ok) {
        const badge = SS.$("#netBadge");
        if (badge) { badge.className = "net-badge warn"; badge.textContent = "Läuft am Gerät"; }
        console.info("Seidla: Rundenservice derzeit nicht erreichbar — es läuft am selben Gerät weiter.");
      }
    });

    // Beharrlich nachschauen, ob im Ausgangskorb was liegt.
    setInterval(() => {
      if (SS.state.role === "guest" && SS.state.connection === "online") SS.net.flushOutbox();
    }, 15000);

    // Gast ohne Verbindung: behutsam versuchen, wieder in die Runde zu kommen.
    setInterval(() => {
      if (SS.state.role !== "guest" || SS.state.connection === "online" || SS.state.connection === "connecting") return;
      if (!SS.state.code || !SS.state.me) return;
      const me = SS.player(SS.state.me);
      if (SS.net.rejoin) SS.net.rejoin(SS.state.code, (me && me.name) || "Gast");
    }, 25000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
