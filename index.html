<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="description" content="Schulspiele — klassische Online-Multiplayer-Spiele fuer den Unterricht. Gruppen mit Code erstellen, im selben WLAN verbinden oder direkt am Geraet spielen.">
<title>Schulspiele — Klassiker fuer die Pause</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231d3557'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23e9c46a' font-family='Georgia'%3E%26%2310003%3B%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Schulspiele — klassisches Designsystem
   Farbwelt: Tafel-Navy, Elfenbein-Papier, Messing-Gold, Tinten-Rot
   ========================================================================== */

:root{
  --ink:#221d18;
  --ink-soft:#5b5248;
  --paper:#f6f1e6;
  --paper-2:#efe7d6;
  --panel:#fffdf7;
  --navy:#1d3557;
  --navy-2:#27446b;
  --navy-3:#132540;
  --gold:#e9c46a;
  --gold-2:#c99a3a;
  --red:#a4262c;
  --green:#2f6b4f;
  --blue:#35507d;
  --violet:#5b4a86;
  --orange:#b2622a;
  --teal:#256b6b;
  --line:#d8cdb6;
  --line-strong:#b8a889;
  --shadow:0 1px 0 #fff inset, 0 2px 0 rgba(0,0,0,.06), 0 10px 24px -14px rgba(34,29,24,.5);
  --shadow-sm:0 1px 2px rgba(34,29,24,.18);
  --radius:14px;
  --radius-sm:9px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --maxw:1180px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  background-color:var(--paper);
  background-image:
    radial-gradient(1200px 600px at 12% -8%, #fffdf7 0%, rgba(255,253,247,0) 60%),
    radial-gradient(900px 500px at 105% 0%, #efe2c4 0%, rgba(239,226,196,0) 55%),
    repeating-linear-gradient(0deg, rgba(184,168,137,.10) 0 1px, rgba(0,0,0,0) 1px 28px);
  -webkit-text-size-adjust:100%;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:700;letter-spacing:.2px;color:var(--navy-3);margin:0 0 .35em}
h1{font-size:clamp(28px,5vw,46px);line-height:1.08}
h2{font-size:clamp(21px,3vw,29px)}
h3{font-size:clamp(17px,2.2vw,21px)}
p{margin:0 0 .8em}
a{color:var(--navy-2)}
small{font-size:.82em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:var(--navy-3)}

/* ── Grundgerüst ─────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;min-height:100dvh}
.view{flex:1;width:100%;max-width:var(--maxw);margin:0 auto;padding:22px 18px 40px}

.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy-2),var(--navy));
  border-bottom:3px solid var(--gold);
  box-shadow:0 8px 22px -16px rgba(0,0,0,.9);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:4px;text-align:left;color:#fff;min-width:0}
.brand-text{min-width:0}
.brand-text strong,.brand-text small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--gold),var(--gold-2));color:var(--navy-3);
  font-family:var(--serif);font-size:24px;font-weight:700;
  box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.6);
}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-text strong{font-family:var(--serif);font-size:21px;letter-spacing:.4px}
.brand-text small{color:#cfe0f5;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.net-badge{
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  color:#e8f1ff;background:rgba(255,255,255,.08);white-space:nowrap;
}
.net-badge.online{border-color:#8fd6ac;color:#d6ffe6;background:rgba(47,107,79,.5)}
.net-badge.warn{border-color:#f0c98a;color:#ffeccb;background:rgba(178,98,42,.45)}
.net-badge.bad{border-color:#f2a6a6;color:#ffe0e0;background:rgba(164,38,44,.5)}

.statusbar{
  position:sticky;bottom:0;z-index:30;
  display:flex;justify-content:space-between;gap:14px;align-items:center;
  padding:8px 18px calc(8px + env(safe-area-inset-bottom));
  font-size:13px;color:var(--ink-soft);
  background:var(--paper-2);border-top:1px solid var(--line-strong);
}
#statusRight{font-family:var(--mono);font-size:12px}

/* ── Karten & Abschnitte ─────────────────────────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);position:relative;
}
.card + .card{margin-top:16px}
.card.flush{padding:0;overflow:hidden}
.rule{height:1px;background:linear-gradient(90deg,var(--line-strong),rgba(184,168,137,0));border:0;margin:18px 0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2);font-weight:700;margin-bottom:6px}
.lead{font-size:clamp(15px,2.1vw,18px);color:var(--ink-soft);max-width:70ch}
.muted{color:var(--ink-soft)}
.center{text-align:center}

/* ── Hero ────────────────────────────────────────────────────────────────── */
.hero{
  display:grid;grid-template-columns:1.35fr .95fr;gap:26px;align-items:stretch;margin-bottom:26px;
}
.hero-main{
  background:
    radial-gradient(600px 300px at 90% -20%, rgba(233,196,106,.35), rgba(233,196,106,0) 60%),
    linear-gradient(160deg,var(--navy-3),var(--navy) 65%,var(--navy-2));
  color:#f2f6ff;border-radius:var(--radius);padding:clamp(22px,4vw,38px);
  border:1px solid var(--navy-3);box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero-main::after{
  content:"";position:absolute;inset:auto -40px -60px auto;width:260px;height:260px;
  background:radial-gradient(circle at 30% 30%, rgba(233,196,106,.22), rgba(233,196,106,0) 65%);
}
.hero-main h1{color:#fff}
.hero-main .eyebrow{color:var(--gold)}
.hero-main p{color:#d7e2f5}
.hero-side{display:flex;flex-direction:column;gap:14px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start}
.stat-card .big{font-family:var(--serif);font-size:34px;line-height:1;color:var(--navy);min-width:52px}
.stat-card h3{margin:0 0 3px;font-size:16px}
.stat-card p{margin:0;font-size:14px;color:var(--ink-soft)}

/* ── Knöpfe ──────────────────────────────────────────────────────────────── */
.btn{
  --bg:var(--navy);--fg:#fff;--bd:var(--navy-3);
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 20px;border-radius:999px;border:1px solid var(--bd);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 88%,#fff),var(--bg));
  color:var(--fg);font-weight:600;font-size:15px;letter-spacing:.02em;
  cursor:pointer;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .08s ease, filter .15s ease;min-height:46px;user-select:none;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.btn-gold{--bg:var(--gold);--fg:#33270a;--bd:var(--gold-2);box-shadow:0 2px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-red{--bg:var(--red);--fg:#fff;--bd:#7d1c21}
.btn-green{--bg:var(--green);--fg:#fff;--bd:#1e4a35}
.btn-ghost{--bg:transparent;--fg:#fff;--bd:rgba(255,255,255,.45);background:rgba(255,255,255,.06);box-shadow:none}
.btn-outline{--bg:var(--panel);--fg:var(--navy);--bd:var(--line-strong);background:var(--panel);box-shadow:var(--shadow-sm)}
.btn-sm{padding:8px 14px;min-height:38px;font-size:13.5px}
.btn-block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* ── Formularfelder ──────────────────────────────────────────────────────── */
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:#fffefb;color:var(--ink);font-size:16px;box-shadow:inset 0 2px 4px rgba(34,29,24,.06);
}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(201,154,58,.35);border-color:var(--gold-2)}
.code-input{
  font-family:var(--mono);font-size:clamp(22px,6vw,34px);letter-spacing:.34em;text-align:center;
  text-transform:uppercase;padding:14px 10px 14px 22px;
}
.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline-form > *{flex:1 1 180px}
.inline-form > .btn{flex:0 0 auto}

/* ── Spielkatalog ────────────────────────────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 20px}
.chip{
  padding:7px 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);box-shadow:var(--shadow-sm);
}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy-3)}
.search{margin-left:auto;flex:1 1 180px;max-width:280px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.game-card{
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  text-align:left;padding:0;transition:transform .12s ease, box-shadow .12s ease;position:relative;
}
.game-card:hover{transform:translateY(-3px);box-shadow:0 18px 30px -18px rgba(34,29,24,.6)}
.game-card .thumb{
  --accent:var(--navy);
  height:74px;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));
  border-bottom:1px solid rgba(0,0,0,.25);color:#fff;
}
.game-card .thumb .glyph{font-size:30px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.game-card .thumb .n{font-family:var(--serif);font-size:15px;opacity:.85;letter-spacing:.08em}
.game-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.game-card h3{margin:0;font-size:18px}
.game-card p{margin:0;font-size:13.8px;color:var(--ink-soft);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft);font-weight:600}
.tag.sel{background:#e8f0e4;border-color:#bcd3b4;color:#2f6b4f}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-top:2px}

/* ── Spielansicht ────────────────────────────────────────────────────────── */
.game-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.game-head .icon{
  width:56px;height:56px;flex:0 0 56px;border-radius:12px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(160deg,var(--navy-2),var(--navy-3));color:var(--gold);border:1px solid var(--navy-3);
  box-shadow:var(--shadow-sm);
}
.game-head .titles{flex:1;min-width:180px}
.game-head h1{font-size:clamp(22px,3.4vw,32px);margin:0}
.game-head .sub{color:var(--ink-soft);font-size:14px;margin:2px 0 0}

.stage{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(14px,2.4vw,22px);
}
.stage + .stage{margin-top:16px}

/* Brett ── Tic-Tac-Toe / 4 Gewinnt / Schach-Dame ──────────────────────────── */
.board-wrap{display:flex;justify-content:center;padding:6px 0 4px}
.turn-banner{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:11px 16px;border-radius:999px;margin:0 auto 16px;max-width:560px;text-align:center;
  border:1px solid var(--line-strong);background:var(--paper-2);font-weight:600;
}
.turn-banner .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(255,255,255,.5)}

.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(360px,86vw);aspect-ratio:1}
.ttt .cell{
  border:0;border-radius:10px;background:linear-gradient(180deg,#fffefb,#f1e9d8);
  border:1px solid var(--line-strong);box-shadow:inset 0 2px 6px rgba(34,29,24,.09);
  font-family:var(--serif);font-size:clamp(40px,13vw,68px);line-height:1;cursor:pointer;color:var(--navy-3);
  display:grid;place-items:center;transition:background .12s ease;
}
.ttt .cell:hover:not([disabled]){background:#fff;transform:translateY(-1px)}
.ttt .cell[disabled]{cursor:default}
.ttt .cell.x{color:var(--red)}
.ttt .cell.o{color:var(--blue)}
.ttt .cell.star{color:var(--green)}
.ttt .cell.triangle{color:var(--orange)}
.ttt .cell.win{background:linear-gradient(180deg,#ffeeba,#f3d98c);box-shadow:0 0 0 2px var(--gold-2) inset}

.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;width:min(430px,92vw);
  padding:12px;border-radius:16px;background:linear-gradient(180deg,var(--navy-2),var(--navy-3));
  border:1px solid var(--navy-3);box-shadow:0 12px 26px -18px rgba(0,0,0,.9)}
.c4 .slot{
  aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 50% 38%, #0d1c30, #0a1523);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.7);position:relative;
}
.c4 .slot[data-p="1"]::after,.c4 .slot[data-p="2"]::after,
.c4 .slot[data-p="3"]::after,.c4 .slot[data-p="4"]::after{
  content:"";position:absolute;inset:8%;border-radius:50%;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.55);
}
.c4 .slot[data-p="1"]::after{background:radial-gradient(circle at 42% 34%,#ff7d78,#c0272d)}
.c4 .slot[data-p="2"]::after{background:radial-gradient(circle at 42% 34%,#ffe08a,#d8a029)}
.c4 .slot[data-p="3"]::after{background:radial-gradient(circle at 42% 34%,#8fe0a5,#2f6b4f)}
.c4 .slot[data-p="4"]::after{background:radial-gradient(circle at 42% 34%,#8fb6e8,#35507d)}
.c4 .slot:hover:not([disabled]){background:radial-gradient(circle at 50% 38%, #17304f, #0d1b2d)}
.c4 .slot[disabled]{cursor:default}
.c4 .slot.win::after{outline:3px solid #fff;outline-offset:2px}
.col-hint{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;width:min(430px,92vw);margin:0 auto 6px}
.col-hint button{border:0;background:none;color:var(--gold);font-size:19px;cursor:pointer;padding:2px}
.col-hint button:disabled{opacity:.25;cursor:default}

/* Nim / Haufen */
.piles{display:flex;gap:clamp(12px,3vw,28px);justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:10px 0}
.pile{text-align:center}
.pile .stones{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:180px;margin-bottom:8px}
.pile .stone{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#c8b48c);border:1px solid #9c8862;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.pile button{width:100%}

/* Karten (Memory / Mau-Mau-Basis) */
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:clamp(6px,1.4vw,11px);width:100%;max-width:640px;margin:0 auto}
.mcard{
  aspect-ratio:.78;border:0;padding:0;cursor:pointer;background:none;perspective:800px;
}
.mcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.9,.3,1)}
.mcard.flipped .inner{transform:rotateY(180deg)}
.mcard .face{
  position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  font-size:clamp(22px,6vw,36px);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm);
}
.mcard .front{background:linear-gradient(160deg,var(--navy-2),var(--navy-3));color:var(--gold);font-family:var(--serif)}
.mcard .back{background:#fffefb;transform:rotateY(180deg)}
.mcard.done{opacity:.42;cursor:default}
.mcard.done .back{box-shadow:0 0 0 2px var(--green) inset}

/* Trivia */
.q-card{max-width:760px;margin:0 auto}
.q-text{font-family:var(--serif);font-size:clamp(20px,3vw,28px);color:var(--navy-3);margin:6px 0 18px}
.answers{display:grid;gap:11px}
.answer{
  display:flex;align-items:center;gap:13px;text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line-strong);background:#fffefb;box-shadow:var(--shadow-sm);font-size:16px;
}
.answer .key{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;font-weight:700;
  background:var(--paper-2);border:1px solid var(--line);font-family:var(--serif);color:var(--navy);
}
.answer[aria-pressed=true]{border-color:var(--navy);background:#eef3fb;box-shadow:0 0 0 2px var(--navy) inset}
.answer.right{background:#e9f5ee;border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.answer.wrong{background:#fbeaea;border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.answer[disabled]{cursor:default}

/* Sortieren (Ordnung) */
.sort-area{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--paper-2)}
.sort-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;background:#fffefb;border:1px solid var(--line-strong);cursor:grab;box-shadow:var(--shadow-sm);user-select:none}
.sort-item .handle{color:var(--gold-2);cursor:grab}
.sort-item .idx{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* Anagramm */
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.letter{
  width:clamp(42px,10vw,54px);height:clamp(42px,10vw,54px);border-radius:10px;cursor:pointer;
  border:1px solid var(--line-strong);background:linear-gradient(180deg,#fffefb,#efe6d2);
  font-family:var(--serif);font-size:clamp(20px,4vw,26px);box-shadow:var(--shadow-sm);
}
.letter[aria-pressed=true]{background:var(--navy);color:#fff}
.word-view{font-family:var(--mono);font-size:clamp(22px,6vw,34px);letter-spacing:.3em;text-align:center;min-height:1.4em;
  border-bottom:2px dashed var(--line-strong);max-width:520px;margin:0 auto;padding-bottom:6px}

/* Debattieren / Wer-bin-ich */
.debate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.debate-card{background:#fffefb;border:1px solid var(--line-strong);border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)}
.debate-card h4{margin:0 0 8px;font-size:15px}
.debate-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.debate-list button.item{width:100%;text-align:left;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#fffefb;cursor:pointer;font-size:14px}
.debate-list button.item[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy-3)}
.wortrolle{font-family:var(--serif);font-size:clamp(24px,7vw,40px);color:var(--red);text-align:center;padding:16px;border:2px dashed var(--red);border-radius:14px;background:#fff8f6}

/* ── Lobby / Netzwerk ────────────────────────────────────────────────────── */
.lobby-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.player-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.player-list li{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:#fffefb;border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.player-list .avatar{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;border:1px solid rgba(0,0,0,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
.player-list .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-list .badge{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:700}
.player-list .badge.host{background:var(--gold);color:#33270a;border:1px solid var(--gold-2)}
.player-list .badge.you{background:#e5ecf8;color:var(--navy);border:1px solid #c3d2ea}
.player-list .badge.guest{background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line)}
.player-list .badge.gone{background:#f6dede;color:var(--red);border:1px solid #e2b5b5}

.code-chip{
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  background:linear-gradient(180deg,#fffef8,#f4ecd9);border:1px solid var(--gold-2);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow-sm);
}
.code-chip .val{font-family:var(--mono);font-size:clamp(24px,6vw,32px);letter-spacing:.28em;color:var(--navy-3);font-weight:700}
.join-link{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:block}

.net-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.net-steps li{display:flex;gap:11px;align-items:flex-start;font-size:14px}
.net-steps .num{
  width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:700;margin-top:1px;
}

.conn-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,107,79,.2);display:inline-block}

.log{font-family:var(--mono);font-size:12px;background:var(--navy-3);color:#cfe0f5;border-radius:10px;padding:11px 13px;max-height:150px;overflow:auto}
.log div{white-space:pre-wrap;word-break:break-word}
.log .t{color:var(--gold)}

/* ── Mechanik-Leiste ─────────────────────────────────────────────────────── */
.mechanik{
  position:sticky;bottom:34px;z-index:35;width:100%;max-width:var(--maxw);margin:0 auto 0;
  padding:0 18px;
}
.mechanik-inner{
  background:linear-gradient(180deg,var(--navy),var(--navy-3));border:1px solid var(--navy-3);
  border-radius:12px;padding:10px 14px;box-shadow:0 -6px 24px -14px rgba(0,0,0,.7);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#eef4ff;
}
.mechanik h4{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mk-houses{display:flex;gap:8px;flex-wrap:wrap}
.mk-house{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);font-size:13px}
.mk-house .avatar{width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.mk-house .pts{font-family:var(--mono);font-weight:700;color:var(--gold)}
.mk-spacer{margin-left:auto}
.mk-round{font-size:12.5px;color:#cfe0f5}
.mk-round strong{color:#fff;font-family:var(--mono)}

.scoreboard{width:100%;border-collapse:collapse;font-size:14px;background:#fffefb;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.scoreboard th,.scoreboard td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.scoreboard thead th{background:var(--paper-2);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.scoreboard tbody tr:last-child td{border-bottom:0}
.scoreboard .num{font-family:var(--mono);font-weight:700;color:var(--navy)}
.scoreboard .lead-row{background:#fff8e6}
.scoreboard .avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;color:#fff;font-weight:700;vertical-align:-5px;margin-right:7px}
.rank{font-family:var(--serif);color:var(--gold-2);font-weight:700;width:26px;display:inline-block}

/* ── Dialog / Toast ──────────────────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(19,37,64,.55);backdrop-filter:blur(4px)}
/* Ohne diese Regel überschreibt display:grid das hidden-Attribut und das
   Overlay blockiert dauerhaft alle Klicks auf die Seite darunter. */
.modal-root[hidden]{display:none}
.modal{
  width:min(620px,96vw);max-height:86dvh;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);
  border-radius:16px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);padding:24px;
}
.modal h2{margin-top:0}
.modal .close{position:absolute;top:0;right:0}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.toast-root{position:fixed;z-index:120;left:50%;transform:translateX(-50%);bottom:78px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{
  background:var(--navy-3);color:#f2f6ff;border:1px solid rgba(233,196,106,.5);border-left:4px solid var(--gold);
  border-radius:10px;padding:11px 16px;font-size:14px;box-shadow:0 14px 30px -18px rgba(0,0,0,.9);animation:pop .25s ease
}
.toast.err{border-left-color:#ff8b8b}
.toast.ok{border-left-color:#8fd6ac}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.kbd{font-family:var(--mono);font-size:12px;background:var(--paper-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--navy)}
.banner{
  border-left:4px solid var(--gold);background:#fff8e6;border-radius:10px;padding:12px 15px;font-size:14px;color:#5a4413;
}
.banner.red{border-left-color:var(--red);background:#fbeaea;color:#6d1b1f}
.banner.green{border-left-color:var(--green);background:#eaf5ef;color:#224e3a}

/* ── Fussnote ────────────────────────────────────────────────────────────── */
.footnote{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px}
.footnote a{color:var(--navy-2)}

/* ── Responsiv ───────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .lobby-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .view{padding:16px 13px 40px}
  .topbar-inner{padding:9px 13px;gap:10px}
  .brand-text small{display:none}
  .card{padding:16px}
  .btn{padding:12px 16px}
  .mechanik{padding:0 13px}
  .game-head .icon{width:46px;height:46px;flex-basis:46px;font-size:23px}
  .statusbar{font-size:12px}
  #statusRight{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

@media print{.topbar,.mechanik,.statusbar,.btn{display:none}}

</style>
</head>
<body>
<div id="app">
  <!-- ══ KOPFZEILE ══════════════════════════════════════════════ -->
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="brandBtn" title="Zur Startseite">
        <span class="brand-mark">&#10003;</span>
        <span class="brand-text">
          <strong>Schulspiele</strong>
          <small>Klassiker fuer die Pause</small>
        </span>
      </button>
      <div class="topbar-right">
        <span id="netBadge" class="net-badge" title="Verbindungsart">Offline bereit</span>
        <button id="helpBtn" class="btn btn-ghost">Anleitung</button>
      </div>
    </div>
  </header>

  <!-- ══ STARTSEITE / LOBBY ═════════════════════════════════════ -->
  <main id="view" class="view"></main>

  <!-- ══ MECHANIK-LEISTE (Haeuser, Punkte, Runden) ══════════════ -->
  <aside id="mechanik" class="mechanik" hidden></aside>

  <!-- ══ STATUSZEILE ════════════════════════════════════════════ -->
  <footer id="statusbar" class="statusbar">
    <span id="statusText">Bereit.</span>
    <span id="statusRight"></span>
  </footer>
</div>

<!-- ══ DIALOGE ══════════════════════════════════════════════════ -->
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

      }
    } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    peer = null; conns = []; hostConn = null;
    setStatus("offline");
  }

  /* ── Selbsttest des Verbindungsdienstes ───────────────────────────────── */
  function available() { return ensureLib(); }

  function init() {
    if (!ensureLib()) {
      setStatus("offline", "Ohne Netzwerk");
      console.info("Schulspiele: PeerJS nicht verfügbar — es läuft nur der Modus «Am selben Gerät».");
      return Promise.resolve(false);
    }
    // Sanfter Erreichbarkeitstest (kein Peer wird dauerhaft geöffnet).
    return probeBroker().catch(() => false);
  }

  function probeBroker() {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ok) => { if (!done) { done = true; try { p.destroy(); } catch (e) {} resolve(ok); } };
      let p;
      try {
        p = new window.Peer({ debug: 0, config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });
      } catch (e) { return resolve(false); }
      p.on("open", () => finish(true));
      p.on("error", () => finish(false));
      setTimeout(() => finish(false), 6000);
    });
  }

  /* ── Export ───────────────────────────────────────────────────────────── */
  Object.assign(SS.net, {
    init, available, setStatus,
    createGroup, joinGroup, leave,
    sendToHost, broadcastState, broadcast, sendTo,
  });
})();

    if (!snap) return;

    node.focus();

      try { node.setSelectionRange(snap.start, snap.end); } catch (e) {}
    }
  }

        ]);
      }
      row.appendChild(el("label", { class: "field" }, [el("span", { text: d.label }), input]));
    });
    box.appendChild(row);
    return box;
  }

  function setSetting(key, value) {
    SS.state.settings[key] = value;
    SS.LS.set("settings:" + SS.state.gameId, SS.state.settings);
    if (SS.isHost()) SS.sync();
  }

  function selectGame(id) {
    if (SS.state.gameId !== id) {
      if (SS.partyReset) SS.partyReset();
      if (SS.triviaReset) SS.triviaReset();
    }
    SS.state.gameId = id;
    SS.state.settings = SS.LS.get("settings:" + id, {});
    const meta = SS.getMeta(id);
    (meta.settings || []).forEach((d) => { if (SS.state.settings[d.key] === undefined) SS.state.settings[d.key] = d.default; });
    if (SS.isHost()) SS.sync();
  }

  /* ══ Spielansicht ═══════════════════════════════════════════════════════ */
  function viewGame() {
    const meta = SS.getMeta(SS.state.gameId) || { name: "Spiel", glyph: "★", tagline: "" };
    const head = el("div", { class: "game-head" }, [
      el("div", { class: "icon", text: meta.glyph || "★" }),
      el("div", { class: "titles" }, [
        el("h1", { text: meta.name }),
        el("p", { class: "sub", text: meta.tagline + (SS.state.mode === "online" ? "  ·  Gruppe " + SS.state.code : "  ·  am selben Gerät") }),
      ]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-sm btn-outline", text: "Regeln", onclick: () => rulesDialog(meta) }),
        SS.isHost()
          ? el("button", { class: "btn btn-sm btn-outline", text: "Neue Partie", onclick: restartGame })
          : null,
        el("button", { class: "btn btn-sm btn-outline", text: "Verlassen", onclick: leaveGame }),
      ]),
    ]);
    const stage = el("div", { class: "stage", id: "stageHost" }, buildStage());
    const seatBar = seatSwitcher();
    return frag([head, seatBar, stage]);
  }

  /** Lokaler Modus, gleichzeitige Spiele: wessen Antwort wird gerade abgegeben? */
  function seatSwitcher() {
    if (SS.state.mode !== "local" || !SS.isSimultaneous() || SS.state.phase !== "playing") return null;
    const row = el("div", { class: "card", style: { marginBottom: "16px", padding: "14px 16px" } }, [
      el("div", { class: "eyebrow", text: "Wer hält gerade das Gerät?" }),
      el("div", { class: "btn-row" }, SS.state.players.map((p) =>
        el("button", {
          class: "btn btn-sm " + (SS.state.seat === p.id ? "btn-gold" : "btn-outline"),
          text: p.name,
          onclick: () => { SS.state.seat = p.id; renderCurrentGame(); },
        })
      )),
      el("p", { class: "muted", style: { margin: "8px 0 0", fontSize: "13px" }, text: "Tippt euren Namen an, bevor ihr antwortet. So landen die Punkte im richtigen Haus." }),
    ]);
    return row;
  }

  function buildStage() {
    const impl = SS.IMPL[SS.state.gameId];
    if (!impl) return el("p", { class: "muted", text: "Dieses Spiel ist nicht geladen." });
    // Der geteilte Zustand gehört noch zu einem anderen Spiel — nicht zeichnen.
    if (SS.state.phase === "playing" && SS.state.pub && SS.state.pub.game !== SS.state.gameId) {
      return el("div", { class: "center muted", style: { padding: "40px 0" }, text: "Die Runde wird vorbereitet …" });
    }
    const ctx = SS.makeCtx();
    try {
      const node = impl.render(ctx);
      return node || el("div");
    } catch (e) {
      console.error(e);
      return el("div", { class: "banner red", text: "Fehler beim Zeichnen des Spiels: " + e.message });
    }
  }

  /* ══ Abläufe ════════════════════════════════════════════════════════════ */
  function getName() {
    const n = (SS.LS.get("name", "") || "").trim();
    return n || "Spieler " + Math.floor(Math.random() * 90 + 10);
  }

  function openCreateDialog() {
    const nameInput = el("input", { type: "text", value: SS.LS.get("name", ""), maxlength: "22", placeholder: "Dein Name", dataset: { persist: "dlgName" } });
    const body = frag([
      el("p", { class: "lead", text: "Dein Gerät wird zum Host. Danach erscheint ein vierstelliger Code, den die anderen eintippen." }),
      el("label", { class: "field" }, [el("span", { text: "Dein Name" }), nameInput]),
      el("div", { class: "banner", text: "Alle Geräte brauchen für den Beitritt kurz eine Internetverbindung. Danach läuft der Datenverkehr direkt zwischen den Geräten." }),
    ]);
    SS.modal("Gruppe öffnen", body, [
      { label: "Abbrechen" },
      {
        label: "Gruppe öffnen", kind: "primary",
        onClick: () => {
          const nm = (nameInput.value || "").trim() || getName();
          SS.LS.set("name", nm);
          createGroup(nm);
          return true;
        },
      },
    ]);
  }

  function createGroup(nm) {
    SS.toast("Gruppe wird geöffnet …");
    SS.net.createGroup(nm)
      .then(() => { SS.LS.set("lastCode", SS.state.code); go("lobby"); SS.toast("Gruppe geöffnet. Code: " + SS.state.code, "ok"); })
      .catch((err) => {
        SS.toast(err.message, "err");
        SS.modal("Gruppe konnte nicht geöffnet werden", frag([
          el("p", { text: err.message }),
          el("div", { class: "banner", text: "Tipp: Wenn im Schulnetz keine WebRTC-Verbindungen erlaubt sind, spielt ihr einfach am selben Gerät. Alles funktioniert auch ohne Gruppe." }),
        ]), [
          { label: "Am selben Gerät spielen", kind: "primary", onClick: () => { startLocalFlow(nm); return true; } },
          { label: "Erneut versuchen", onClick: () => { createGroup(nm); return true; } },
          { label: "Schliessen" },
        ]);
      });
  }

  function openJoinDialog(prefill) {
    const codeInput = el("input", { class: "code-input", type: "text", inputmode: "latin", autocapitalize: "characters", autocomplete: "off", maxlength: "4", value: prefill || "", placeholder: "----" });
    const nameInput = el("input", { type: "text", value: SS.LS.get("name", ""), maxlength: "22", placeholder: "Dein Name", dataset: { persist: "dlgJoinName" } });
    const body = frag([
      el("p", { class: "lead", text: "Gib den Code ein, den der Host zeigt." }),
      el("label", { class: "field" }, [el("span", { text: "Gruppencode" }), codeInput]),
      el("label", { class: "field" }, [el("span", { text: "Dein Name" }), nameInput]),
      el("div", { class: "banner", text: "Achte auf Gross- und Kleinschreibung nicht — der Code wird automatisch gross geschrieben." }),
    ]);
    const box = SS.modal(SS.state.connection === "offline" ? "Mit Code beitreten" : "Mit Code beitreten", body, [
      { label: "Abbrechen" },
      {
        label: "Beitreten", kind: "primary",
        onClick: () => {
          const code = codeInput.value.trim().toUpperCase();
          const nm = (nameInput.value || "").trim() || getName();
          SS.LS.set("name", nm);
          joinGroup(code, nm);
          return true;
        },
      },
    ]);
    setTimeout(() => { if (!prefill) codeInput.focus(); }, 60);
    return box;
  }

  function joinGroup(code, nm) {
    SS.toast("Verbindung wird aufgebaut …");
    SS.net.joinGroup(code, nm)
      .then(() => { SS.LS.set("lastCode", code); go("lobby"); SS.toast("Beigetreten: Gruppe " + SS.state.code, "ok"); })
      .catch((err) => {
        SS.toast(err.message, "err");
        SS.modal("Beitritt nicht möglich", frag([
          el("p", { text: err.message }),
          el("ul", {}, [
            el("li", { text: "Ist der Code richtig abgetippt?" }),
            el("li", { text: "Ist die Gruppe am Host-Gerät noch offen?" }),
            el("li", { text: "Haben beide Geräte Internet?" }),
          ]),
        ]), [
          { label: "Nochmal", kind: "primary", onClick: () => { openJoinDialog(code); return true; } },
          { label: "Schliessen" },
        ]);
      });
  }

  function startLocalFlow(name) {
    if (name) SS.LS.set("name", name);
    SS.state.mode = "local";
    SS.state.role = "solo";
    SS.state.code = null;
    SS.state.players = [];
    SS.state.scores = {};
    SS.state.priv = {};
    SS.addPlayer(SS.LS.get("name", "") || "Spieler 1", { id: "p1", isHost: true });
    SS.addPlayer("Spieler 2", { id: "p2" });
    SS.state.me = null;
    SS.net.setStatus("offline");
    go("lobby");
  }

  function addLocalPlayerDialog() {
    const input = el("input", { type: "text", maxlength: "22", placeholder: "Name", dataset: { persist: "addP" } });
    SS.modal("Spieler hinzufügen", frag([
      el("label", { class: "field" }, [el("span", { text: "Name" }), input]),
      el("p", { class: "muted", text: SS.state.mode === "online" ? "Am selben Gerät kannst du zusätzliche Spieler anlegen, die sich das Gerät teilen." : "" }),
    ]), [
      { label: "Abbrechen" },
      { label: "Hinzufügen", kind: "primary", onClick: () => {
          const n = (input.value || "").trim(); if (!n) return false;
          SS.addPlayer(n, {});
          if (SS.isHost()) SS.sync();
          render();
          return true;
        } },
    ]);
    setTimeout(() => input.focus(), 60);
  }

  function openGame(id) {
    const meta = SS.getMeta(id);
    if (!meta) return;
    if (SS.state.mode === "local" && !SS.state.players.length) {
      // Spielerzahl aus Meta ableiten
      SS.addPlayer(SS.LS.get("name", "") || "Spieler 1", { id: "p1", isHost: true });
      const min = Math.max(meta.minP || 2, 2);
      for (let i = 2; i <= min; i++) SS.addPlayer("Spieler " + i, { id: "p" + i });
      SS.state.me = null;
    }
    if (!SS.state.gameId) selectGame(id);
    else selectGame(id);

    const body = frag([
      el("p", { class: "lead", text: meta.glyph + "  " + meta.tagline }),
      el("div", { class: "tags", style: { marginBottom: "12px" } }, (meta.tags || []).map((t) => el("span", { class: "tag", text: TAGS[t] || t }))),
      el("div", { class: "banner", text: "Regeln: " + meta.rules }),
      meta.howto && meta.howto.length ? el("div", {}, [el("h3", { text: "So läuft es" }), el("ol", {}, meta.howto.map((h) => el("li", { text: h })))]) : null,
    ]);

    SS.modal(meta.name, body, [
      { label: "Schliessen" },
      { label: "Am selben Gerät", onClick: () => { startLocalFlow(); selectGame(id); return true; } },
      { label: "In Gruppe spielen", kind: "primary", onClick: () => {
          if (SS.state.mode === "online" && SS.state.role === "host") { selectGame(id); go("lobby"); return true; }
          if (SS.state.mode === "online" && SS.state.role === "guest") { SS.toast("Der Host wählt das Spiel.", "err"); return true; }
          window.__pendingGame = id;
          openCreateDialog();
          return true;
        } },
    ]);
  }

  function startGame() {
    const meta = SS.getMeta(SS.state.gameId);
    if (!meta) return;
    const ctx = SS.makeCtx();
    SS.state.scores = {};
    SS.state.players.forEach((p) => (SS.state.scores[p.id] = 0));
    SS.state.priv = {};
    SS.state.phase = "playing";
    SS.state.round = 1;
    SS.state.lastResult = null;
    SS.state.pub = {};
    SS.state.players.forEach((p) => (SS.state.priv[p.id] = {}));
    SS.logLine("Partie gestartet: " + meta.name, "ok");
    const impl = SS.IMPL[SS.state.gameId];
    if (impl && impl.init) { try { impl.init(ctx); } catch (e) { console.error(e); SS.toast("Startfehler: " + e.message, "err"); } }
    if (SS.isHost()) SS.sync();
    // Gäste müssen in die Spielansicht wechseln — der Zustand allein reicht nicht.
    if (SS.state.mode === "online" && SS.isHost()) SS.net.broadcast({ t: "start" });
    go("game");
    if (SS.state.mode === "online" && SS.state.role === "guest") SS.net.sendToHost({ t: "req" });
  }

  function restartGame() {
    SS.modal("Neue Partie?", frag([el("p", { text: "Der aktuelle Punktestand wird auf null gesetzt und das Spiel neu gemischt." })]), [
      { label: "Abbrechen" },
      { label: "Neu starten", kind: "primary", onClick: () => { startGame(); return true; } },
    ]);
  }

  function leaveGame() {
    SS.modal("Partie verlassen?", frag([
      el("p", { text: "Ihr kommt zurück in die Lobby. Die Gruppe bleibt bestehen." }),
    ]), [
      { label: "Weiter spielen" },
      { label: "Verlassen", kind: "primary", onClick: () => {
          SS.state.phase = "lobby";
          SS.state.turn = null;
          SS.state.pub = {};
          SS.state.priv = {};
          if (SS.isHost()) SS.sync();
          go("lobby");
          return true;
        } },
    ]);
  }

  function toHome() {
    SS.state.mode = "local";
    SS.state.role = "solo";
    SS.state.code = null;
    SS.state.connection = "offline";
    SS.state.phase = "lobby";
    go("home");
  }

  function rulesDialog(meta) {
    SS.modal(meta.name + " — Regeln", frag([
      el("div", { class: "banner", text: meta.rules }),
      meta.howto && meta.howto.length ? el("div", {}, [el("h3", { text: "Ablauf" }), el("ol", {}, meta.howto.map((h) => el("li", { text: h })))]) : null,
    ]), [{ label: "Verstanden", kind: "primary" }]);
  }

  /* ══ Hilfe ══════════════════════════════════════════════════════════════ */
  function helpDialog() {
    SS.modal("Anleitung", frag([
      el("h3", { text: "Gruppe eröffnen" }),
      el("ol", {}, [
        el("li", { text: "Ein Gerät wählt «Gruppe öffnen» und wird zum Host." }),
        el("li", { text: "Es zeigt einen vierstelligen Code, zum Beispiel K7QP." }),
        el("li", { text: "Alle anderen öffnen dieselbe Seite und tippen den Code ein." }),
      ]),
      el("h3", { text: "Ehrliche Antwort zur Verbindung" }),
      el("p", { text: "Für den Verbindungsaufbau braucht es kurz Internet: Die Geräte finden sich über einen öffentlichen Vermittlungsdienst und sprechen danach direkt miteinander (WebRTC). Ohne Internet — etwa im Flugmodus oder in einem WLAN ohne Uplink — könnt ihr trotzdem alles spielen, dann wird das Gerät einfach weitergereicht." }),
      el("p", { text: "Reines Bluetooth zwischen iPad und Android-Tablet ist im Browser leider nicht möglich. Das kann diese Seite nicht leisten, ohne dass ihr eine App installiert." }),
      el("h3", { text: "Ohne Internet, ohne Gruppe" }),
      el("p", { text: "Wähle «Am selben Gerät». Zwei bis zehn Personen spielen nacheinander an einem Bildschirm. Die Häuser zeigen, wer wie viele Punkte hat." }),
      el("h3", { text: "Kurzbefehle" }),
      el("p", {}, [el("span", { class: "kbd", text: "Esc" }), " schliesst Dialoge. ", el("span", { class: "kbd", text: "1" }), "–", el("span", { class: "kbd", text: "4" }), " wählt im Quiz eine Antwort."]),
    ]), [{ label: "Schliessen", kind: "primary" }]);
  }

  /* ══ Kleinkram ══════════════════════════════════════════════════════════ */
  function copy(text, okMsg) {
    if (!text) return;
    const done = () => SS.toast(okMsg || "Kopiert", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = el("textarea", { style: { position: "fixed", opacity: "0" } });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { SS.toast("Kopieren nicht möglich. Bitte manuell abschreiben.", "err"); }
    ta.remove();
  }

  /* ══ Start ══════════════════════════════════════════════════════════════ */
  function initUI() {
    SS.$("#brandBtn").addEventListener("click", () => { if (SS.state.phase === "playing") leaveGame(); else go("home"); });
    SS.$("#helpBtn").addEventListener("click", helpDialog);

    SS.on("net", () => {
      // Bei Zustandswechsel in der Gruppe: Lobby oder Spiel neu zeichnen
      if (SS.state.route === "lobby" || SS.state.route === "game") render();
      else { renderMechanik(); updateStatusbar(); }
      if (window.__pendingGame && SS.state.role === "host") {
        selectGame(window.__pendingGame); window.__pendingGame = null; render();
      }
    });

    SS.on("log", () => {});

    // Kleiner Takt: bei online laufender Partie Ansicht aktualisieren
    setInterval(() => {
      if (SS.state.route === "game" && SS.state.phase === "playing") { /* Spiele zeichnen selbst */ }
      updateStatusbar();
    }, 2500);

    render();
  }

  /* Export */
  SS.setRenderCurrent(renderCurrentGame);
  SS.ui = {
    render, renderCurrent: renderCurrentGame, go, initUI, showScoreboard,
    copy, helpDialog, selectGame, startGame, openJoinDialog, openCreateDialog,
  };
})();

;

      wrap.appendChild(el("div", { class: "center" }, [

  const reaction = {

    action(ctx, pid, name, payload) {

            ? el("button", { class: "btn btn-gold", text: pub.run >= pub.rounds ? "Auswertung" : "Nächster Durchgang", onclick: () => SS.act("next", {}) })

    ctx.turn = ctx.players[(pub.run - 1) % ctx.players.length].id;
  }

  /* ══════════════════════════════════════════════════════════════════════
     WER BIN ICH?  (Begriff erklären)
     ══════════════════════════════════════════════════════════════════════ */
  const werbinich = {
    init(ctx) {
      ctx.pub.game = "werbinich";
      ctx.pub.seconds = Number(ctx.settings.seconds) || 90;
      ctx.pub.run = 1;
      ctx.pub.runId = SS.uid(6);
      ctx.pub.active = true;
      ctx.pub.guessed = 0;
      ctx.pub.list = [];
      ctx.pub.explainer = ctx.players[0].id;
      ctx.pub.submitted = {};
      newWerRound(ctx);
      ctx.log("Wer bin ich? Erklärt wird reihum.");
    },
    action(ctx, pid, name, payload) {
      const pub = ctx.pub;
      if (name === "assign") {
        if (!ctx.isHost && !ctx.isLocal) return;
        // Begriffe für die erklärende Person bereitstellen
        const pool = SS.shuffle((dataList().EXPLAIN || []).slice());
        const cart = pool.slice(0, 12);
        ctx.state.priv[pid] = Object.assign({}, ctx.state.priv[pid], { cards: cart, used: [], score: 0 });
        pub.list = [];
        pub.submitted[pid] = true;
      } else if (name === "guess") {
        const mine = ctx.state.priv[pid] || {};
        const cards = mine.cards || [];
        const used = mine.used || [];
        const nextCard = cards.find((c) => !used.includes(c));
        if (!nextCard) return;
        used.push(nextCard);
        ctx.state.priv[pid] = Object.assign({}, mine, { used: used, score: (mine.score || 0) + 1 });
        pub.guessed++;
        ctx.addScore(pid, 1);
        pub.list.push(nextCard);
      } else if (name === "finish") {
        pub.active = false;
        pub.run++;
        if (pub.run > ctx.players.length) { ctx.state.phase = "over"; ctx.finish(); return; }
        ctx.pub.explainer = ctx.players[(pub.run - 1) % ctx.players.length].id;
        newWerRound(ctx);
      } else if (name === "next") {
        pub.run = 1;
        ctx.pub.explainer = ctx.players[0].id;
        newWerRound(ctx);
      }
    },
    render(ctx) {
      const pub = ctx.pub;
      if (pub.game !== "werbinich" || !pub.runId) return el("div");
      if (ctx.state.phase === "over") { stopTick(); return U().finalScreen(ctx, "Wer bin ich? beendet"); }
      const wrap = el("div");
      const isExplainer = ctx.me === pub.explainer || (ctx.isLocal && ctx.turn === pub.explainer);
      const expName = ctx.player(pub.explainer).name;

      markRun(pub.runId);
      const remain = Math.max(0, pub.seconds - Math.floor(elapsedSeconds()));

      wrap.appendChild(el("div", { class: "center" }, [
        el("span", { class: "tag", text: "Runde " + pub.run + " von " + ctx.players.length }),
        el("h3", { style: { marginTop: "12px" }, text: "Erklärt: " + expName }),
        el("div", { class: "serif", style: { fontSize: "34px", color: remain <= 10 ? "var(--red)" : "var(--navy)" }, text: remain + " s" }),
      ]));

      if (isExplainer) {
        const mine = ctx.state.priv[ctx.me] || {};
        const cards = mine.cards || [];
        const used = mine.used || [];
        if (!cards.length) {
          wrap.appendChild(el("div", { class: "center", style: { marginTop: "16px" } }, [
            el("p", { class: "muted", text: "Du erklärst. Lass dir Begriffe austeilen." }),
            el("button", { class: "btn btn-gold", text: "Begriffe austeilen", onclick: () => SS.actAs(ctx.me, "assign", {}) }),
          ]));
        } else {
          const nextCard = cards.find((c) => !used.includes(c));
          wrap.appendChild(el("div", { class: "wortrolle", text: nextCard || "Alle Begriffe geschafft!" }));
          wrap.appendChild(el("div", { class: "center", style: { marginTop: "14px" } }, [
            nextCard ? el("button", { class: "btn btn-gold", style: { fontSize: "18px", padding: "16px 32px" }, text: "Erraten — nächster Begriff", onclick: () => SS.actAs(ctx.me, "guess", {}) }) : null,
            pub.list && pub.list.length ? el("p", { class: "muted", text: "Bisher: " + pub.list.join(" · ") }) : null,
          ]));
        }
      } else {
        wrap.appendChild(el("div", { class: "banner", text: expName + " erklärt gerade. Rufe die Lösung laut in die Runde — " + expName + " tippt auf «Erraten», wenn der Begriff gefallen ist." }));
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "14px" } }, [
          el("p", { class: "muted", text: "Bisher erraten: " + (pub.list || []).join(" · ") }),
        ]));
      }

      wrap.appendChild(el("div", { class: "center", style: { marginTop: "18px" } }, [
        (ctx.isHost || ctx.isLocal)
          ? pub.active
            ? el("button", { class: "btn btn-outline", text: "Runde beenden", onclick: () => SS.act("finish", {}) })
            : el("button", { class: "btn btn-gold", text: pub.run > ctx.players.length ? "Auswertung" : "Nächste Person", onclick: () => SS.act("finish", {}) })
          : el("p", { class: "muted", text: "Der Host beendet die Runde." }),
      ]));

      wrap.appendChild(el("div", { style: { marginTop: "18px" } }, U().scoreTable(ctx)));

      if (pub.active) { if (!local.tickerKey) startTick("werbinich", () => ctx.rerender()); } else stopTick();
      return wrap;
    },
  };

  function newWerRound(ctx) {
    ctx.pub.runId = SS.uid(6);
    ctx.pub.active = true;
    ctx.pub.list = [];
    ctx.pub.guessed = 0;
    local.runId = null;
    // Begriffe der erklärenden Person frisch mischen (Host autoritativ)
    const exp = ctx.pub.explainer;
    if (exp) {
      const pool = SS.shuffle((dataList().EXPLAIN || []).slice());
      ctx.state.priv[exp] = Object.assign({}, ctx.state.priv[exp], { cards: pool.slice(0, 12), used: [] });
    }
  }

  /* ══════════════════════════════════════════════════════════════════════
     WER BIST DU?  (eigene Figur erraten)
     ══════════════════════════════════════════════════════════════════════ */
  const werbistdu = {
    init(ctx) {
      ctx.pub.game = "werbistdu";
      const region = String(ctx.settings.region || "mix");
      let pool = [];
      const d = dataList();
      if (region === "sport") pool = (d.FIGURES_SPORT || []).slice();
      else if (region === "tech") pool = (d.FIGURES_TECH || []).slice();
      else pool = (d.FIGURES_SPORT || []).concat(d.FIGURES_TECH || []);
      pool = SS.shuffle(pool);
      ctx.state.priv = {};
      ctx.players.forEach((p, i) => { ctx.state.priv[p.id] = { figure: pool[i % pool.length], solved: false, wrong: false }; });
      ctx.pub.solvedBy = null;
      ctx.pub.runId = SS.uid(6);
      ctx.log("Wer bist du? Fragt euch reihum Ja-/Nein-Fragen.");
    },
    action(ctx, pid, name, payload) {
      const priv = ctx.state.priv[pid] || {};
      if (name === "attempt") {
        const guess = String(payload.text || "").toLowerCase().trim();
        const target = String(priv.figure || "").toLowerCase();
        if (!guess) return;
        if (guess === target || target.includes(guess) && guess.length >= 4) {
          priv.solved = true;
          ctx.state.priv[pid] = priv;
          if (!ctx.pub.solvedBy) { ctx.pub.solvedBy = pid; ctx.addScore(pid, 2); }
          else ctx.addScore(pid, 1);
          ctx.log(ctx.player(pid).name + " erkennt sich: " + priv.figure);
        } else {
          priv.wrong = true;
          ctx.addScore(pid, -1);
          ctx.log(ctx.player(pid).name + " liegt daneben.");
          ctx.state.priv[pid] = priv;
        }
      } else if (name === "reveal") {
        priv.solved = true; priv.revealed = true;
        ctx.state.priv[pid] = priv;
      } else if (name === "next") {
        const pool = SS.shuffle((dataList().FIGURES_SPORT || []).concat(dataList().FIGURES_TECH || []));
        ctx.state.priv = {};
        ctx.players.forEach((p, i) => { ctx.state.priv[p.id] = { figure: pool[i % pool.length], solved: false, wrong: false }; });
        ctx.pub.solvedBy = null;
        ctx.pub.runId = SS.uid(6);
        ctx.round++;
      }
    },
    render(ctx) {
      const pub = ctx.pub;
      if (pub.game !== "werbistdu" || !pub.runId) return el("div");
      const wrap = el("div");
      const mine = ctx.state.priv[ctx.me] || {};
      const solvedAll = ctx.players.filter((p) => p.connected !== false).every((p) => (ctx.state.priv[p.id] || {}).solved);

      wrap.appendChild(el("p", { class: "lead center", text: "Jede Person hat heimlich eine berühmte Figur. Stellt euch reihum Fragen, die nur mit ja oder nein zu beantworten sind." }));

      // Eigene Rolle
      const card = el("div", { class: "debate-card", style: { maxWidth: "520px", margin: "0 auto 18px" } }, [
        el("h4", { text: "Deine Figur" }),
        mine.solved
          ? el("div", { class: "wortrolle", text: mine.figure || "—" })
          : el("div", { class: "center" }, [
              el("p", { class: "muted", text: "Verdeckt. Frag dich heran — oder löse auf." }),
              el("button", { class: "btn btn-sm btn-outline", text: "Aufdecken (ohne Wertung)", onclick: () => SS.actAs(ctx.me, "reveal", {}) }),
            ]),
      ]);
      wrap.appendChild(card);

      if (!mine.solved) {
        const input = el("input", {
          type: "text", placeholder: "Ich glaube, ich bin …", dataset: { persist: "wbd" },
          style: { maxWidth: "360px", margin: "0 auto", textAlign: "center" },
          onkeydown: (e) => { if (e.key === "Enter") submit(); },
        });
        const submit = () => { const v = input.value.trim(); if (!v) return; SS.actAs(ctx.me, "attempt", { text: v }); input.value = ""; };
        wrap.appendChild(el("div", { class: "center" }, [
          input,
          el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "12px" } }, [
            el("button", { class: "btn btn-gold", text: "Auflösen", onclick: submit }),
          ]),
          mine.wrong ? el("p", { class: "muted", style: { marginTop: "8px" }, text: "Ein Fehlversuch kostet einen Punkt." }) : null,
        ]));
      }

      // Stand
      const rows = ctx.players.map((p) => {
        const pr = ctx.state.priv[p.id] || {};
        const show = pr.solved || (ctx.isLocal && false);
        return el("tr", {}, [
          el("td", {}, [el("span", { class: "avatar", style: { background: p.color }, text: SS.initial(p.name) }), p.name]),
          el("td", { class: "num", text: show ? pr.figure : (pr.revealed ? pr.figure : "—") }),
          el("td", { text: pr.solved ? "gelöst" : pr.wrong ? "daneben" : "offen" }),
        ]);
      });
      wrap.appendChild(el("div", { style: { maxWidth: "560px", margin: "18px auto 0" } },
        el("table", { class: "scoreboard" }, [
          el("thead", {}, el("tr", {}, [el("th", { text: "Person" }), el("th", { text: "Figur" }), el("th", { text: "Stand" })])),
          el("tbody", {}, rows),
        ])));

      wrap.appendChild(el("div", { class: "center", style: { marginTop: "16px" } }, [
        (ctx.isHost || ctx.isLocal)
          ? el("button", { class: "btn " + (solvedAll ? "btn-gold" : "btn-outline"), text: solvedAll ? "Alle gelöst — neue Figuren" : "Neue Figuren", onclick: () => SS.act("next", {}) })
          : el("p", { class: "muted", text: "Der Host verteilt neue Figuren." }),
      ]));
      wrap.appendChild(el("div", { style: { marginTop: "18px" } }, U().scoreTable(ctx)));
      return wrap;
    },
  };

  /* ══════════════════════════════════════════════════════════════════════
     GROSSE DEBATTE
     ══════════════════════════════════════════════════════════════════════ */
  const debate = {
    init(ctx) {
      ctx.pub.game = "debate";
      const topics = U().sharedShuffle(ctx, (dataList().THESES || []).slice(), "theses");
      ctx.pub.topics = topics;
      ctx.pub.run = 1;
      ctx.pub.runId = SS.uid(6);
      newDebateRound(ctx);
      ctx.log("Grosse Debatte gestartet.");
    },
    action(ctx, pid, name, payload) {
      const pub = ctx.pub;
      if (name === "side") {
        pub.sides[pid] = payload.side;
      } else if (name === "vote") {
        pub.votes[pid] = payload.side;
        resolveVote(ctx);
      } else if (name === "next") {
        pub.run++;
        if (pub.run > pub.topics.length) { ctx.state.phase = "over"; ctx.finish(); return; }
        newDebateRound(ctx);
      }
    },
    render(ctx) {
      const pub = ctx.pub;
      if (pub.game !== "debate" || !pub.topics) return el("div");
      if (ctx.state.phase === "over") { stopTick(); return U().finalScreen(ctx, "Debatte beendet"); }
      const wrap = el("div");
      const topic = pub.topics[pub.run - 1];
      const seconds = Number(ctx.settings.seconds) || 90;
      markRun(pub.runId);
      const remain = Math.max(0, seconds - Math.floor(elapsedSeconds()));

      wrap.appendChild(el("div", { class: "center" }, [
        el("span", { class: "tag", text: "These " + pub.run + " von " + pub.topics.length }),
        el("h2", { style: { marginTop: "12px", maxWidth: "760px", marginLeft: "auto", marginRight: "auto" }, text: "«" + topic + "»" }),
        el("div", { class: "serif", style: { fontSize: "30px", color: remain <= 10 ? "var(--red)" : "var(--navy)" }, text: remain + " s" }),
      ]));

      const pro = ctx.players.filter((p) => pub.sides[p.id] === "pro");
      const contra = ctx.players.filter((p) => pub.sides[p.id] === "contra");

      wrap.appendChild(el("div", { class: "debate-grid", style: { marginTop: "18px" } }, [
        el("div", { class: "debate-card" }, [
          el("h4", { text: "Dafür (" + pro.length + ")" }),
          el("ul", { class: "debate-list" }, pro.length ? pro.map((p) => el("li", { text: p.name })) : [el("li", { class: "muted", text: "noch niemand" })]),
        ]),
        el("div", { class: "debate-card" }, [
          el("h4", { text: "Dagegen (" + contra.length + ")" }),
          el("ul", { class: "debate-list" }, contra.length ? contra.map((p) => el("li", { text: p.name })) : [el("li", { class: "muted", text: "noch niemand" })]),
        ]),
      ]));

      if (!pub.votes || Object.keys(pub.votes).length === 0 || !pub.resolved) {
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "18px" } }, [
          el("p", { class: "muted", text: "Jede Person wählt eine Seite. Danach tragen die beiden Seiten nacheinander ihre Argumente vor." }),
          el("div", { class: "btn-row", style: { justifyContent: "center" } }, [
            el("button", { class: "btn " + (pub.sides[ctx.me] === "pro" ? "btn-gold" : "btn-outline"), text: "Ich bin dafür", onclick: () => SS.actAs(ctx.me, "side", { side: "pro" }) }),
            el("button", { class: "btn " + (pub.sides[ctx.me] === "contra" ? "btn-gold" : "btn-outline"), text: "Ich bin dagegen", onclick: () => SS.actAs(ctx.me, "side", { side: "contra" }) }),
          ]),
        ]));
      }

      if (pub.resolved) {
        wrap.appendChild(el("hr", { class: "rule" }));
        wrap.appendChild(el("div", { class: "center" }, [
          el("h3", { text: "Abstimmung" }),
          el("p", { class: "lead", text: "Die überzeugendere Seite: " + (pub.winnerSide === "pro" ? "Dafür" : "Dagegen") }),
        ]));
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "14px" } }, [
          (ctx.isHost || ctx.isLocal)
            ? el("button", { class: "btn btn-gold", text: pub.run >= pub.topics.length ? "Auswertung" : "Nächste These", onclick: () => SS.act("next", {}) })
            : el("p", { class: "muted", text: "Warte auf den Host." }),
        ]));
      } else {
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "20px" } }, [
          el("p", { class: "muted", text: "Wenn alle gesprochen haben, wird abgestimmt. Wer zu welcher Seite gehört, ist oben zu sehen." }),
          el("div", { class: "btn-row", style: { justifyContent: "center" } }, [
            el("button", { class: "btn btn-outline", text: "Stimme: Dafür", onclick: () => SS.actAs(ctx.me, "vote", { side: "pro" }) }),
            el("button", { class: "btn btn-outline", text: "Stimme: Dagegen", onclick: () => SS.actAs(ctx.me, "vote", { side: "contra" }) }),
          ]),
        ]));
      }

      wrap.appendChild(el("div", { style: { marginTop: "18px" } }, U().scoreTable(ctx)));

      if (!pub.resolved) { if (!local.tickerKey) startTick("debate", () => ctx.rerender()); } else stopTick();
      return wrap;
    },
  };

  function newDebateRound(ctx) {
    ctx.pub.runId = SS.uid(6);
    ctx.pub.sides = {};
    ctx.pub.votes = {};
    ctx.pub.resolved = false;
    ctx.pub.winnerSide = null;
  }

  function resolveVote(ctx) {
    const pub = ctx.pub;
    const active = ctx.players.filter((p) => p.connected !== false);
    if (!active.every((p) => pub.votes[p.id])) return;
    let pro = 0, contra = 0;
    Object.values(pub.votes).forEach((v) => { if (v === "pro") pro++; else contra++; });
    pub.winnerSide = pro >= contra ? "pro" : "contra";
    pub.resolved = true;
    ctx.players.filter((p) => pub.sides[p.id] === pub.winnerSide).forEach((p) => ctx.addScore(p.id, 1));
    ctx.log("Abstimmung: " + (pub.winnerSide === "pro" ? "Dafür" : "Dagegen") + " gewinnt (" + pro + ":" + contra + ").");
  }

  /* ══════════════════════════════════════════════════════════════════════
     FÜNF-SIEBEN-FÜNF (Haiku)
     ══════════════════════════════════════════════════════════════════════ */
  const haiku = {
    init(ctx) {
      ctx.pub.game = "haiku";
      const themes = U().sharedShuffle(ctx, (dataList().THEMES || []).slice(), "themes");
      ctx.pub.themes = themes.length ? themes : ["Pausenhof", "Klassenfahrt"];
      ctx.pub.run = 1;
      ctx.pub.runId = SS.uid(6);
      newHaikuRound(ctx);
      ctx.log("Fünf-Sieben-Fünf gestartet.");
    },
    action(ctx, pid, name, payload) {
      const pub = ctx.pub;
      if (name === "submit") {
        pub.pieces[pid] = payload.lines;
        resolveHaiku(ctx);
      } else if (name === "vote") {
        if (pid === payload.target) return;
        pub.votes[pid] = payload.target;
        resolveHaiku(ctx);
      } else if (name === "next") {
        pub.run++;
        if (pub.run > pub.themes.length) { ctx.state.phase = "over"; ctx.finish(); return; }
        newHaikuRound(ctx);
      } else if (name === "phase") {
        pub.stage = payload.stage;
      }
    },
    render(ctx) {
      const pub = ctx.pub;
      if (pub.game !== "haiku" || !pub.themes) return el("div");
      if (ctx.state.phase === "over") { stopTick(); return U().finalScreen(ctx, "Fünf-Sieben-Fünf beendet"); }
      const wrap = el("div");
      const theme = pub.themes[(pub.run - 1) % pub.themes.length];
      const seconds = Number(ctx.settings.seconds) || 180;
      markRun(pub.runId);
      const remain = Math.max(0, seconds - Math.floor(elapsedSeconds()));
      const active = ctx.players.filter((p) => p.connected !== false);

      wrap.appendChild(el("div", { class: "center" }, [
        el("span", { class: "tag", text: "Haiku " + pub.run + " von " + pub.themes.length }),
        el("h2", { style: { marginTop: "12px" }, text: "Thema: " + theme }),
      ]));

      if (pub.stage === "write") {
        wrap.appendChild(el("div", { class: "center" }, [
          el("p", { class: "muted", text: "Erste Zeile 5 Silben, zweite 7, dritte 5." }),
          pub.pieces[ctx.me]
            ? el("p", { class: "lead", text: "Abgegeben. Warte auf die anderen." })
            : haikuForm(ctx),
          el("div", { class: "serif", style: { fontSize: "28px", color: remain <= 10 ? "var(--red)" : "var(--navy)", marginTop: "12px" }, text: remain + " s" }),
          el("p", { class: "muted", text: active.filter((p) => pub.pieces[p.id]).length + " von " + active.length + " haben abgegeben." }),
          (ctx.isHost || ctx.isLocal)
            ? el("button", { class: "btn btn-outline", text: "Zur Bewertung", style: { marginTop: "12px" }, onclick: () => SS.act("phase", { stage: "vote" }) })
            : null,
        ]));
        if (!local.tickerKey) startTick("haiku", () => ctx.rerender());
      } else {
        // Vorlesen und bewerten
        const entries = active.filter((p) => pub.pieces[p.id]);
        wrap.appendChild(el("p", { class: "lead center", text: "Alle lesen nacheinander vor. Danach stimmt ihr ab — die eigene darf nicht gewählt werden." }));
        wrap.appendChild(el("div", { class: "debate-grid" }, entries.map((p) =>
          el("div", { class: "debate-card" }, [
            el("h4", {}, [el("span", { class: "avatar", style: { background: p.color }, text: SS.initial(p.name) }), " " + p.name]),
            el("div", { class: "serif", style: { fontSize: "18px", lineHeight: "1.6" } }, pub.pieces[p.id].map((l) => el("div", { text: l || "…" }))),
            el("div", { style: { marginTop: "10px" } }, [
              el("button", {
                class: "btn btn-sm " + (pub.votes[ctx.me] === p.id ? "btn-gold" : "btn-outline"),
                text: pub.votes[ctx.me] === p.id ? "Gewählt" : "Wählen",
                disabled: p.id === ctx.me,
                onclick: () => SS.actAs(ctx.me, "vote", { target: p.id }),
              }),
            ]),
          ])
        )));

        if (pub.winner) {
          const w = ctx.player(pub.winner);
          wrap.appendChild(el("div", { class: "turn-banner", style: { marginTop: "18px", borderColor: "var(--green)" } }, [
            U().dot(pub.winner, ctx), el("span", { text: "Bestes Haiku: " + (w ? w.name : "—") }),
          ]));
          wrap.appendChild(el("div", { class: "center", style: { marginTop: "14px" } }, [
            (ctx.isHost || ctx.isLocal)
              ? el("button", { class: "btn btn-gold", text: pub.run >= pub.themes.length ? "Auswertung" : "Nächstes Thema", onclick: () => SS.act("next", {}) })
              : el("p", { class: "muted", text: "Warte auf den Host." }),
          ]));
        } else {
          wrap.appendChild(el("div", { class: "center", style: { marginTop: "16px" } }, [
            el("p", { class: "muted", text: Object.keys(pub.votes).length + " von " + active.length + " haben abgestimmt." }),
            (ctx.isHost || ctx.isLocal)
              ? el("button", { class: "btn btn-outline", text: "Auswerten", style: { marginTop: "10px" }, onclick: () => resolveHaiku(ctx, true) })
              : null,
          ]));
        }
      }
      return wrap;
    },
  };

  function haikuForm(ctx) {
    const saved = ctx.state.priv[ctx.me] || {};
    const inputs = [0, 1, 2].map((i) =>
      el("input", {
        type: "text", placeholder: (i === 0 ? "5 Silben" : i === 1 ? "7 Silben" : "5 Silben"),
        value: (saved.lines && saved.lines[i]) || "",
        dataset: { persist: "hk" + i },
        style: { maxWidth: "420px", margin: "6px auto", textAlign: "center", fontFamily: "var(--serif)", fontSize: "17px" },
      })
    );
    return el("div", {}, [
      el("div", { class: "center" }, inputs),
      el("div", { class: "btn-row", style: { justifyContent: "center", marginTop: "10px" } }, [
        el("button", {
          class: "btn btn-gold", text: "Haiku abgeben",
          onclick: () => {
            const lines = inputs.map((x) => x.value.trim());
            if (!lines[0] && !lines[1] && !lines[2]) { SS.toast("Schreib zuerst etwas.", "err"); return; }
            ctx.state.priv[ctx.me] = Object.assign({}, ctx.state.priv[ctx.me] || {}, { lines: lines });
            SS.actAs(ctx.me, "submit", { lines: lines });
          },
        }),
      ]),
    ]);
  }

  function newHaikuRound(ctx) {
    ctx.pub.runId = SS.uid(6);
    ctx.pub.stage = "write";
    ctx.pub.pieces = {};
    ctx.pub.votes = {};
    ctx.pub.winner = null;
    local.runId = null;
  }

  function resolveHaiku(ctx, force) {
    const pub = ctx.pub;
    const active = ctx.players.filter((p) => p.connected !== false);
    const voters = active.filter((p) => pub.pieces[p.id]);
    if (!force && !voters.every((p) => pub.votes[p.id])) return;
    if (force && !Object.keys(pub.votes).length) { SS.toast("Noch keine Stimmen abgegeben.", "err"); return; }
    const tally = {};
    Object.values(pub.votes).forEach((t) => { tally[t] = (tally[t] || 0) + 1; });
    let best = null, bestN = -1;
    Object.entries(tally).forEach(([pid, n]) => { if (n > bestN) { bestN = n; best = pid; } });
    if (!best) best = voters[0] ? voters[0].id : null;
    pub.winner = best;
    if (best) ctx.addScore(best, 2);
    active.forEach((p) => { if (p.id !== best && pub.pieces[p.id]) ctx.addScore(p.id, 1); });
    ctx.log("Bestes Haiku: " + (best ? ctx.player(best).name : "—"));
  }

  /* ══════════════════════════════════════════════════════════════════════
     ANMELDUNG
     ══════════════════════════════════════════════════════════════════════ */
  /* Beim Spielwechsel müssen alte Zeitgeber und Laufzeiten zurückgesetzt werden. */
  SS.partyReset = function () {
    stopTick();
    local.runId = null;
    local.startAt = 0;
    local.goAt = 0;
  };

  SS.registerImpl("reaction", reaction);
  SS.registerImpl("anagram", anagram);
  SS.registerImpl("sort", sortGame);
  SS.registerImpl("werbinich", werbinich);
  SS.registerImpl("werbistdu", werbistdu);
  SS.registerImpl("debate", debate);
  SS.registerImpl("haiku", haiku);
})();

;

/* ==========================================================================
   Schulspiele — Quizduell
   Alle antworten gleichzeitig. Der Host löst auf und verteilt die Punkte.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;
  const { el } = SS;
  const U = () => SS.util;

  const local = { runId: null, deadline: 0, ticker: null };

  const trivia = {
    init(ctx) {
      ctx.pub.game = "trivia";
      const qs = U().sharedShuffle(ctx, (window.SS_DATA.QUESTIONS || []).slice(), "trivia");
      const n = Math.min(Number(ctx.settings.rounds) || 12, qs.length);
      ctx.pub.questions = qs.slice(0, n);
      ctx.pub.total = n;
      ctx.pub.seconds = Number(ctx.settings.seconds) || 20;
      ctx.pub.run = 1;
      ctx.pub.resolved = false;
      ctx.pub.answers = {};
      ctx.pub.reveal = true;
      ctx.turn = null; // kein Zugwechsel — alle gleichzeitig
      nextQuestion(ctx);
      ctx.log("Quizduell: " + n + " Fragen.");
    },
    action(ctx, pid, name, payload) {
      const pub = ctx.pub;
      if (name === "answer") {
        if (pub.resolved) return;
        if (pub.answers[pid] !== undefined) return;
        pub.answers[pid] = payload.i;
        pub.times = pub.times || {};
        pub.times[pid] = Date.now();
      } else if (name === "resolve") {
        if (pub.resolved) return;
        resolve(ctx);
      } else if (name === "next") {
        pub.run++;
        if (pub.run >= ctx.pub.total) { ctx.state.phase = "over"; ctx.finish(); return; }
        nextQuestion(ctx);
      }
    },
    render(ctx) {
      const pub = ctx.pub;
      if (pub.game !== "trivia" || !pub.total) return el("div");
      if (ctx.state.phase === "over") { stopTriviaTick(); return U().finalScreen(ctx, "Quizduell beendet"); }
      const wrap = el("div");
      const q = pub.questions[pub.run - 1];
      const active = ctx.players.filter((p) => p.connected !== false);
      const answered = active.filter((p) => pub.answers[p.id] !== undefined).length;

      // Zeitmarke setzen
      if (local.runId !== pub.runId) { local.runId = pub.runId; local.deadline = Date.now() + pub.seconds * 1000; }
      const remain = Math.max(0, Math.ceil((local.deadline - Date.now()) / 1000));
      if (remain === 0 && !pub.resolved && ctx.isHost) resolve(ctx, true);

      wrap.appendChild(el("div", { class: "q-card" }, [
        el("div", { class: "tags", style: { justifyContent: "space-between" } }, [
          el("span", { class: "tag", text: q.cat || "Wissen" }),
          el("span", { class: "tag", text: "Frage " + pub.run + " von " + pub.total }),
        ]),
        el("div", { class: "q-text", text: q.q }),
        el("div", { class: "center", style: { marginBottom: "14px" } }, [
          el("span", { class: "serif", style: { fontSize: "26px", color: remain <= 5 ? "var(--red)" : "var(--navy)" }, text: remain + " s" }),
          el("span", { class: "muted", style: { marginLeft: "12px" }, text: answered + " von " + active.length + " haben geantwortet" }),
        ]),
        el("div", { class: "answers" }, q.a.map((text, i) => {
          const mine = pub.answers[ctx.me] === i;
          let cls = "answer";
          if (pub.resolved) {
            if (i === q.c) cls += " right";
            else if (mine) cls += " wrong";
          } else if (mine) {
            cls += "";
            cls = "answer";
          }
          return el("button", {
            class: cls,
            "aria-pressed": mine ? "true" : "false",
            disabled: pub.resolved || ctx.state.phase !== "playing" || mine,
            onclick: () => SS.actAs(ctx.me, "answer", { i: i }),
          }, [
            el("span", { class: "key", text: String.fromCharCode(65 + i) }),
            el("span", { text: text }),
          ]);
        })),
      ]));

      if (pub.resolved) {
        const correct = q.a[q.c];
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "18px" } }, [
          el("p", { class: "lead", text: "Richtig: " + correct }),
          (ctx.isHost || ctx.isLocal)
            ? el("button", { class: "btn btn-gold", text: pub.run >= pub.total ? "Endstand" : "Nächste Frage", onclick: () => SS.act("next", {}) })
            : el("p", { class: "muted", text: "Warte auf die nächste Frage." }),
        ]));
      } else if (ctx.isHost || ctx.isLocal) {
        wrap.appendChild(el("div", { class: "center", style: { marginTop: "18px" } }, [
          el("button", { class: "btn btn-outline", text: "Auflösen", onclick: () => SS.act("resolve", {}) }),
        ]));
      }

      wrap.appendChild(el("div", { style: { marginTop: "20px" } }, U().scoreTable(ctx)));

      if (!pub.resolved) {
        if (!local.ticker) local.ticker = setInterval(() => ctx.rerender(), 500);
        local.tickerKey = "trivia";
      } else stopTriviaTick();
      return wrap;
    },
  };

  function stopTriviaTick() {
    if (local.ticker) { clearInterval(local.ticker); local.ticker = null; }
  }

  function nextQuestion(ctx) {
    ctx.pub.runId = SS.uid(6);
    ctx.pub.answers = {};
    ctx.pub.resolved = false;
    local.runId = null;
    local.deadline = 0;
  }

  function resolve(ctx) {
    const pub = ctx.pub;
    if (pub.resolved) return;
    const q = pub.questions[pub.run - 1];
    const active = ctx.players.filter((p) => p.connected !== false);
    const sound = active.filter((p) => pub.answers[p.id] === q.c);
    sound.forEach((p) => ctx.addScore(p.id, 1));
    // Zusatzpunkt für die schnellste richtige Antwort dieser Runde.
    const speeders = sound
      .filter((p) => pub.times && pub.times[p.id] !== undefined)
      .sort((a, b) => pub.times[a.id] - pub.times[b.id]);
    if (speeders.length) {
      ctx.addScore(speeders[0].id, 1);
      ctx.log(speeders[0].name + " war am schnellsten und bekommt einen Zusatzpunkt.");
    }
    pub.resolved = true;
    ctx.log("Frage " + pub.run + ": " + sound.length + " von " + active.length + " richtig.");
    stopTriviaTick();
  }

  SS.triviaReset = function () { stopTriviaTick(); local.runId = null; local.deadline = 0; };

  SS.registerImpl("trivia", trivia);
})();

;

/* ==========================================================================
   Schulspiele — Start
   Liest einen Gruppencode aus der Adresse, startet die Oberfläche und prüft
   einmalig, ob der Verbindungsdienst erreichbar ist.
   ========================================================================== */
(function () {
  "use strict";
  const SS = window.SS;

  function param(name) {
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }

  function start() {
    SS.ui.initUI();

    const code = (param("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const direct = param("join");
    if (code.length === 4 || direct) {
      const c = code.length === 4 ? code : String(direct).toUpperCase().replace(/[^A-Z0-9]/g, "");
      setTimeout(() => SS.ui.openJoinDialog ? SS.ui.openJoinDialog(c) : null, 250);
    }

    // Verbindungsdienst einmalig prüfen und den Status im Kopf anzeigen.
    SS.net.init().then((ok) => {
      if (!ok) {
        const badge = SS.$("#netBadge");
        if (badge) { badge.className = "net-badge warn"; badge.textContent = "Nur lokal"; }
        console.info("Schulspiele: Gruppen sind derzeit nicht verfügbar — «Am selben Gerät» funktioniert weiterhin.");
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
